<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>主訴處理</title>
<style>
/* Layout: pager console — sticky status bar, one working column, live-note rail on wide screens.
   Palette: cool ward-light neutrals + pager-LCD amber; semantic red/green kept apart from the accent. */
:root{
  --bg:#F1F3F2; --surface:#FFFFFF; --surface-2:#E7EBE9; --ink:#172024; --ink-2:#465259; --ink-3:#6E7B84; --line:#D2D9D6;
  --accent:#A35500; --accent-ink:#FFFFFF; --accent-soft:#F5E5CF;
  --crit:#BC2F27; --crit-soft:#F9DEDA; --ok:#25744A; --ok-soft:#DAEEE2; --info:#2C5C8C; --info-soft:#DFE8F2;
  --paper:#FBFBF8; --shadow:rgba(16,22,26,.18);
  --f-display:"Barlow Condensed","Noto Sans TC",system-ui,sans-serif;
  --f-body:"Noto Sans TC",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1317; --surface:#161C21; --surface-2:#1E262C; --ink:#E5E9EB; --ink-2:#A8B2B8; --ink-3:#7E8B93; --line:#2A343B;
  --accent:#F0A23A; --accent-ink:#1B1205; --accent-soft:#3A2911;
  --crit:#FF6E62; --crit-soft:#3A1916; --ok:#5DC48D; --ok-soft:#14301F; --info:#80B1E0; --info-soft:#162636;
  --paper:#0C1013; --shadow:rgba(0,0,0,.55); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1317; --surface:#161C21; --surface-2:#1E262C; --ink:#E5E9EB; --ink-2:#A8B2B8; --ink-3:#7E8B93; --line:#2A343B;
  --accent:#F0A23A; --accent-ink:#1B1205; --accent-soft:#3A2911;
  --crit:#FF6E62; --crit-soft:#3A1916; --ok:#5DC48D; --ok-soft:#14301F; --info:#80B1E0; --info-soft:#162636;
  --paper:#0C1013; --shadow:rgba(0,0,0,.55); color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
a{color:var(--info)}
h1,h2,h3,h4{text-wrap:balance}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:18px 150px}
.muted{color:var(--ink-3)} .small{font-size:13px}
.eyebrow{font-family:var(--f-display);text-transform:uppercase;letter-spacing:.12em;font-size:13px;font-weight:600;color:var(--accent)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sh{font-size:16px;font-weight:700;margin:22px 0 10px}

/* top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.topbar-in{max-width:1180px;margin:0 auto;padding:8px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:9px;background:none;border:0;cursor:pointer;padding:4px 0}
.brand b{font-family:var(--f-body);font-weight:700;font-size:18px;letter-spacing:.04em}
.led{width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.top-right{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.mode{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:2px;background:var(--surface)}
.mode button{border:0;background:none;padding:3px 12px;border-radius:999px;font-size:13px;cursor:pointer;color:var(--ink-2)}
.mode button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.lvl{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 12px 3px 4px;cursor:pointer;font-size:13px}
.lvl .rank{font-family:var(--f-display);font-weight:700;font-size:15px;background:var(--ink);color:var(--bg);border-radius:999px;padding:0 9px;letter-spacing:.04em}
.lvl .xpb{width:54px;height:4px;border-radius:2px;background:var(--surface-2);overflow:hidden}
.lvl .xpb i{display:block;height:100%;background:var(--accent)}
.lvl .num{font-family:var(--f-mono);font-size:12px;color:var(--ink-2)}
.sync{width:7px;height:7px;border-radius:50%;background:var(--ink-3)}
.sync.on{background:var(--ok)}

/* buttons, chips, tags */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;cursor:pointer;font-size:14px;font-weight:500;line-height:1.25;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.dark{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--surface-2)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn svg{width:16px;height:16px;flex:none}
.icon-btn{border:0;background:none;cursor:pointer;padding:6px;border-radius:6px;color:var(--ink-2);display:inline-flex}
.icon-btn:hover{background:var(--surface-2)}
.icon-btn svg{width:18px;height:18px}
.tag{display:inline-block;font-size:11px;font-weight:500;line-height:1.5;border:1px solid var(--line);border-radius:4px;padding:0 5px;vertical-align:2px;color:var(--ink-2);white-space:nowrap}
.tag.must{color:var(--crit);border-color:var(--crit)}
.tag.key{color:var(--accent);border-color:var(--accent)}
.bedchip{border:1.5px solid var(--hub-todo);background:var(--surface);color:var(--hub-todo);border-radius:999px;padding:0 10px;font:700 13px/1.7 var(--f-body);cursor:pointer;letter-spacing:0;vertical-align:1px}
.bedchip.none{border-style:dashed}
.bedask{position:fixed;left:50%;top:max(14vh,calc(env(safe-area-inset-top,0px) + 24px));z-index:47;transform:translateX(-50%);width:min(420px,calc(100% - 32px));background:var(--surface);border-radius:16px;border-top:4px solid var(--hub-todo);padding:18px 18px 16px;box-shadow:0 18px 40px rgba(0,0,0,.3);display:flex;flex-direction:column;gap:10px;animation:hub-in .22s var(--hub-ease)}
.bedask h3{margin:0;font-size:19px}
.bedask p{margin:0}
.bedrow{display:flex;gap:8px}
.bedrow .inp{flex:1;font-size:22px!important;text-align:center;font-weight:700;padding:10px}
.bedrow .go{min-width:84px}
.nowurg{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:12px 0 4px}
.btn.urg{background:var(--hub-p2);border-color:var(--hub-p2);color:var(--surface);font-weight:700}
.tag.stg{color:var(--hub-todo);border:1.5px dashed var(--hub-todo);font-weight:600}
.impbar.bump .ib-t b{animation:hub-pop .45s var(--hub-ease)}
.impbar .go:disabled{opacity:.5}
.tag.td{color:var(--surface);background:var(--hub-todo);border-color:var(--hub-todo)}
.tag.tdd{color:var(--hub-todo);border-color:var(--hub-todo);text-decoration:line-through}
.tag.ai{color:var(--info);border-color:var(--info)}
.tag.hit{color:var(--ok);border-color:var(--ok)}
.tag.miss{background:var(--crit);border-color:var(--crit);color:var(--surface)}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:13px;cursor:pointer}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.needs-ai{display:none!important}
body.ai-on .needs-ai{display:inline-flex!important}
.mini{font-size:12px;border:0;background:none;color:var(--info);cursor:pointer;padding:0;text-decoration:none;display:inline-flex;align-items:center;gap:3px}
.mini:hover{text-decoration:underline}
.mini svg{width:12px;height:12px}

/* home */
.hero{padding-block:8px 6px}
.hero h1{font-size:clamp(26px,4.4vw,36px);line-height:1.2;margin:6px 0 16px;font-weight:700;letter-spacing:.01em}
.cc-form{display:flex;gap:8px;max-width:720px}
.cc-input{flex:1;min-width:0;border:2px solid var(--ink);background:var(--surface);border-radius:10px;padding:12px 14px;font-size:18px}
.cc-input::placeholder{color:var(--ink-3)}
.cc-suggest{max-width:720px;margin-top:8px;border:1px solid var(--line);background:var(--surface);border-radius:10px;overflow:hidden}
.cc-suggest button{display:flex;width:100%;gap:10px;align-items:center;text-align:left;border:0;border-top:1px solid var(--line);background:none;padding:10px 14px;cursor:pointer}
.cc-suggest button:first-child{border-top:0}
.cc-suggest button:hover{background:var(--surface-2)}
.cc-suggest .gen{color:var(--info)}
.cc-suggest .status{padding:12px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.cc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:18px}
.ccchip{display:grid;grid-template-columns:1fr auto;gap:2px 8px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;cursor:pointer}
.ccchip:hover{border-color:var(--ink-3)}
.ccchip .zh{font-weight:700;font-size:15px}
.ccchip .en{grid-column:1/-1;font-family:var(--f-mono);font-size:11px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pips{display:inline-flex;gap:2px;align-items:center}
.pips i{width:8px;height:4px;border-radius:1px;background:var(--surface-2)}
.pips i.on{background:var(--accent)}
.ccchip.due{border-color:var(--accent)}
.home-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-top:26px}
@media (max-width:760px){.home-row{grid-template-columns:minmax(0,1fr)}}
.tile{display:flex;gap:12px;align-items:flex-start;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:14px 16px;cursor:pointer}
.tile:hover{border-color:var(--ink-3)}
.tile svg{width:22px;height:22px;flex:none;color:var(--accent);margin-top:2px}
.tile b{display:block;font-size:16px}
.tile span{font-size:13px;color:var(--ink-3)}
.tile.hot{border-color:var(--accent);background:var(--accent-soft)}
.resume{display:flex;flex-direction:column;gap:6px;margin:0 0 18px}
.resume-item{display:flex;align-items:center;gap:10px;flex-wrap:wrap;border:1px dashed var(--accent);border-radius:10px;padding:8px 12px;background:var(--surface)}
.resume-item .grow{flex:1;min-width:0}
.how{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:26px;padding:14px 16px;border-radius:12px;background:var(--surface-2)}
.how div{font-size:13px;color:var(--ink-2)}
.how b{display:block;font-family:var(--f-display);font-size:18px;color:var(--ink)}
@media (max-width:640px){.how{grid-template-columns:minmax(0,1fr)}}
.recent{margin-top:28px}
.loglist{display:flex;flex-direction:column}
.logrow{display:grid;grid-template-columns:86px minmax(0,1fr) auto;gap:10px;padding:9px 0;border-top:1px solid var(--line);align-items:baseline;font-size:14px}
.logrow .d{font-family:var(--f-mono);font-size:12px;color:var(--ink-3)}
.logrow .p{color:var(--ink-3);font-size:13px}
.foot{margin-top:36px;font-size:12px;color:var(--ink-3);border-top:1px solid var(--line);padding-top:12px}

/* call view */
.call-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.call-title{font-size:clamp(24px,4vw,32px);margin:2px 0 0;line-height:1.15}
.call-title .en{font-family:var(--f-display);font-weight:600;color:var(--ink-3);font-size:.7em;letter-spacing:.02em;margin-left:6px}
.call-meta{display:flex;gap:8px;align-items:center}
.timer{font-family:var(--f-display);font-size:24px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--ink-2);letter-spacing:.04em}
.reason{margin-top:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.reason label{font-size:13px;color:var(--ink-3)}
.reason input{flex:1;min-width:200px}
.vitals{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px;margin-top:12px}
.vf{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:5px 9px}
.vf span{font-size:10.5px;font-family:var(--f-mono);color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em}
.vf input{border:0;background:transparent;font-family:var(--f-display);font-size:22px;font-weight:600;width:100%;min-width:0;padding:0;font-variant-numeric:tabular-nums;outline-offset:0}
.vf .bp{display:flex;align-items:baseline;gap:2px}
.vf .bp input{width:50%}
.vf .bp em{font-style:normal;color:var(--ink-3)}
.vf.warn{border-color:var(--accent);background:var(--accent-soft)}
.vf.crit{border-color:var(--crit);background:var(--crit-soft)}
.vflags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;align-items:center;min-height:28px}
.flag{font-size:12.5px;border-radius:6px;padding:2px 8px;background:var(--accent-soft);color:var(--ink)}
.flag.crit{background:var(--crit);color:var(--surface);font-weight:500}
.toggle{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:2px 9px;font-size:12.5px;cursor:pointer}
.toggle[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.rail{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:2px;border-bottom:1px solid var(--line);margin:16px 0 18px}
.rail::-webkit-scrollbar{display:none}
.rail button{min-width:0;border:0;background:none;padding:10px 2px;cursor:pointer;color:var(--ink-3);border-bottom:2px solid transparent;font-size:14px;display:flex;gap:7px;align-items:center;justify-content:center;margin-bottom:-1px;white-space:nowrap}
.rail .ls{display:none}
@media (max-width:640px){.rail button{flex-direction:column;gap:3px;padding:8px 0 9px;font-size:13px}.rail .lf{display:none}.rail .ls{display:inline}.rail .n{min-width:22px;line-height:20px;font-size:12px}}
.rail .n{font-family:var(--f-mono);font-size:11px;border:1px solid currentColor;border-radius:4px;min-width:18px;text-align:center;line-height:16px}
.rail button[aria-current="step"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:700}
.rail button.done .n{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.call-grid{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:24px;align-items:start}
.notepane{position:sticky;top:calc(env(safe-area-inset-top,0px) + 66px)}
.np-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.notepre{font-family:var(--f-mono);font-size:12.5px;line-height:1.55;white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:14px;max-height:72vh;overflow:auto;margin:0}
.notepre.tall{max-height:none}
.mobile-note{display:none}
@media (max-width:960px){.call-grid{grid-template-columns:minmax(0,1fr)}.notepane{display:none}.mobile-note{display:block}}
.stepnav{display:flex;justify-content:space-between;gap:8px;margin-top:22px;padding-top:14px;border-top:1px solid var(--line)}

.alarm{border:1.5px solid var(--crit);background:var(--crit-soft);border-radius:10px;padding:12px 16px}
.alarm h3{margin:0 0 6px;font-size:15px;color:var(--crit);display:flex;gap:6px;align-items:center}
.alarm h3 svg{width:18px;height:18px}
.alarm ul{margin:0;padding-left:20px}
.alarm li{margin:3px 0}
.items{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;padding:10px 14px;border-top:1px solid var(--line);align-items:center}
.item:first-child{border-top:0}
.item .t{font-weight:500}
.item .why{font-size:12.5px;color:var(--ink-3)}
.item .detail{grid-column:1/-1}
.check-row{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;border:0;border-top:1px solid var(--line);background:none;padding:10px 14px;cursor:pointer}
.check-row:first-child{border-top:0}
.check-row .box{width:18px;height:18px;border:1.5px solid var(--ink-3);border-radius:4px;flex:none;margin-top:3px;display:grid;place-items:center}
.check-row[aria-pressed="true"] .box{background:var(--ok);border-color:var(--ok)}
.check-row[aria-pressed="true"] .box::after{content:"";width:5px;height:9px;border:solid var(--surface);border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.check-row[aria-pressed="true"] .lbl{color:var(--ink-2)}
.check-row .sub{display:block;font-family:var(--f-mono);font-size:11.5px;color:var(--ink-3)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex:none}
.seg button{border:0;background:var(--surface);padding:6px 11px;cursor:pointer;font-size:13px;min-width:42px;color:var(--ink-2)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"].bad{background:var(--crit-soft);color:var(--crit);font-weight:700}
.seg button[aria-pressed="true"].good{background:var(--ok-soft);color:var(--ok);font-weight:700}
.seg button[aria-pressed="true"].lk{background:var(--accent);color:var(--accent-ink);font-weight:700}
.seg button[aria-pressed="true"].cs{background:var(--info-soft);color:var(--info);font-weight:700}
.item > .seg button{flex:1 1 0}
.item .why.mono{font-family:var(--f-mono);font-size:12px}
.seg button[aria-pressed="true"].pend{background:var(--hub-todo-soft);color:var(--hub-todo);font-weight:700}
.seg button[aria-pressed="true"].skip{background:var(--surface-2);color:var(--ink-3);text-decoration:line-through}
.seg button.pend,.seg button.skip{color:var(--ink-3)}
.seg button[aria-pressed="true"].ex{background:var(--surface-2);color:var(--ink-3);text-decoration:line-through}
.inp{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:7px 10px;font-size:14px}
.inp.s{max-width:140px}
.inp.mono,textarea.mono{font-family:var(--f-mono);font-size:13px;line-height:1.55}
textarea.inp{resize:vertical;min-height:64px}
.inp::placeholder{color:var(--ink-3)}

.recall{border:1.5px dashed var(--accent);border-radius:12px;padding:16px;background:var(--surface)}
.recall h3{margin:6px 0 10px;font-size:17px}
.guess-box{display:flex;flex-wrap:wrap;gap:6px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:6px;background:var(--bg);margin-bottom:12px}
.guess-box input{flex:1;min-width:180px;border:0;background:transparent;padding:6px}
.gchip{display:inline-flex;align-items:center;gap:4px;background:var(--ink);color:var(--bg);border-radius:999px;padding:2px 4px 2px 10px;font-size:13px}
.gchip button{border:0;background:none;color:inherit;cursor:pointer;padding:0 4px;font-size:14px;line-height:1}
.score{display:flex;flex-wrap:wrap;gap:16px;align-items:baseline;border-radius:10px;padding:12px 16px;background:var(--surface-2);margin-bottom:14px}
.score .big{font-family:var(--f-display);font-size:30px;font-weight:700;line-height:1}
.score .k{font-size:12px;color:var(--ink-3);display:block}
.ddx-list{display:flex;flex-direction:column;gap:8px}
.ddx{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;border:1px solid var(--line);border-radius:10px;padding:10px 14px;background:var(--surface);align-items:start}
.ddx.must .nm{color:var(--crit)}
.ddx .nm{font-weight:700}
.ddx .dd{font-size:13px;color:var(--ink-2)}
.ddx .dd .l{font-family:var(--f-mono);font-size:11px;color:var(--ink-3);margin-right:6px}
.ddx .links{display:flex;gap:12px;margin-top:4px}
@media (max-width:560px){.ddx,.item{grid-template-columns:minmax(0,1fr)}}
.safetynote{border-radius:10px;padding:10px 14px;background:var(--info-soft);font-size:13.5px;margin-bottom:14px}
.ogroup{margin-bottom:14px}

@keyframes sheet-up{from{transform:translateY(40%);opacity:.4}}
@keyframes hub-fade{from{opacity:0}}
body.sheet-on{overflow:hidden}

<script>
/* 待辦表共用：同一個總站共用 localStorage（shiftboard.v1），待辦表那邊會即時更新
   ‧ hubTodo.add()：加一項（可帶子項目）
   ‧ hubTodo.pickerHTML()：跟待辦表一樣的「立即／緊急／待辦／有空＋倒數」按鈕
   ‧ data-swipe 的列：手指右滑加入待辦（主程式提供 window.hubOnSwipe(el) 回傳內容）
   ‧ 床號預設 = 最近一次輸入的床號（hub.lastBed，各工具共用） */
(function () {
  const KEY = 'shiftboard.v1', BED = 'hub.lastBed', PK = 'hub.todoPick';
  const PRN = { 1: '立即', 2: '緊急', 3: '待辦', 4: '有空' };
  const TM = { 2: [[5, '5分'], [10, '10分'], [15, '15分'], [30, '30分']], 3: [[60, '1時'], [120, '2時'], [240, '4時'], [-1, '明天'], [-2, '日期']] };
  const timed = p => p === 2 || p === 3;
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const ymd = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  const get = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
  const set = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };

  let pk = { p: 3, tm: 0, cm: '', d: '', t: '08:00', open: false };
  try { const s = JSON.parse(get(PK) || 'null'); if (s && PRN[s.p]) pk = { ...pk, ...s, open: false }; } catch (e) {}
  const savePk = () => set(PK, JSON.stringify({ p: pk.p, tm: pk.tm, t: pk.t }));

  function tmLabel() {
    if (!timed(pk.p)) return '';
    const cm = parseInt(pk.cm, 10);
    if (cm > 0) return cm >= 60 && cm % 60 === 0 ? `${cm / 60}時` : `${cm}分`;
    if (pk.tm === -1) return '明天';
    if (pk.tm === -2) return pk.d ? `${+pk.d.slice(5, 7)}/${+pk.d.slice(8, 10)}` : '日期';
    const hit = (TM[pk.p] || []).find(x => x[0] === pk.tm); return hit ? hit[1] : '';
  }
  function inner() {
    const lbl = tmLabel(), cmOn = parseInt(pk.cm, 10) > 0;
    let h = `<div class="hp-row" role="group" aria-label="緊急程度">${[1, 2, 3, 4].map(p =>
      `<button type="button" class="hp-pr" data-p="${p}" data-hp-p="${p}" aria-pressed="${pk.p === p}"><span>${PRN[p]}</span><small>${pk.p === p ? lbl : ''}</small></button>`).join('')}</div>`;
    if (pk.open && timed(pk.p)) {
      h += `<div class="hp-tm" role="group" aria-label="倒數時間">${TM[pk.p].map(([m, t]) =>
        `<button type="button" class="hp-c" data-hp-tm="${m}" aria-pressed="${pk.tm === m && !cmOn}">${t}</button>`).join('')}<input type="number" data-hp-cm min="1" max="1440" inputmode="numeric" placeholder="自訂分" aria-label="自訂分鐘" value="${esc(pk.cm)}"></div>`;
      if (pk.tm < 0 && !cmOn) h += `<div class="hp-dt"><input type="date" data-hp-d aria-label="日期" value="${esc(pk.d)}"><input type="time" data-hp-t aria-label="時間" value="${esc(pk.t || '08:00')}"></div>`;
    }
    return h;
  }
  function sumText() { const b = api.bed(), l = tmLabel(); return `${b ? b + ' 床 · ' : ''}${PRN[pk.p]}${l ? ' · ' + l : ''}`; }
  function refresh(full) {
    document.querySelectorAll('[data-hp-root]').forEach(r => {
      if (full) r.innerHTML = inner();
      else r.querySelectorAll('.hp-pr').forEach(b => { b.querySelector('small').textContent = +b.dataset.hpP === pk.p ? tmLabel() : ''; });
    });
    document.querySelectorAll('[data-hp-sum]').forEach(e => { e.textContent = sumText(); });
  }

  const api = window.hubTodo = {
    KEY,
    bed() { return (get(BED) || '').trim(); },
    setBed(v) { set(BED, (v || '').trim()); document.querySelectorAll('[data-hp-bed]').forEach(i => { if (i !== document.activeElement) i.value = v; }); refresh(false); },
    pickerHTML() { return `<div class="hp" data-hp-root>${inner()}</div>`; },
    sumHTML() { return `<span data-hp-sum>${esc(sumText())}</span>`; },
    // 依目前按鈕算到時時間；回傳 { due, err }
    due() {
      const now = Date.now(), cm = parseInt(pk.cm, 10);
      if (!timed(pk.p)) return { due: 0 };
      if (cm > 0) return { due: now + cm * 60e3 };
      if (pk.tm === -1) { const d = new Date(); d.setDate(d.getDate() + 1); const [h, m] = (pk.t || '08:00').split(':'); d.setHours(+h, +m, 0, 0); return { due: d.getTime() }; }
      if (pk.tm === -2) {
        const w = pk.d ? new Date(`${pk.d}T${pk.t || '08:00'}`).getTime() : NaN;
        return w > now ? { due: w } : { err: pk.d ? '選的時間已經過了' : '請先選日期' };
      }
      return { due: pk.tm > 0 ? now + pk.tm * 60e3 : 0 };
    },
    lastErr: '',
    _read() { try { const st = JSON.parse(get(KEY) || 'null'); if (st && Array.isArray(st.items)) return st; } catch (e) {} return null; },
    // 這一項在待辦表裡的狀態：'open'（還沒做）、'done'（已完成）或 null（不在／被刪掉）
    status(id) { if (!id) return null; const st = api._read(); if (!st) return null; if (st.items.some(i => i.id === id)) return 'open'; return (st.done || []).some(i => i.id === id) ? 'done' : null; },
    // 子項目用自己的 id（建立時是「待辦 id.k」）找，不用陣列位置：待辦表刪掉其中一項，其他項不會對錯
    subStatus(id, k) {
      const st = api._read(); if (!st) return null;
      const it = st.items.find(i => i.id === id), d = it ? null : (st.done || []).find(i => i.id === id);
      const x = it || d, s = x && x.subs && x.subs.find(y => y.id === id + '.' + k); if (!s) return null;
      return s.d || d ? 'done' : 'open';
    },
    subDone(id, k) {
      const st = api._read(); if (!st) return false;
      const it = st.items.find(i => i.id === id), s = it && it.subs && it.subs.find(y => y.id === id + '.' + k); if (!s) return false;
      s.d = 1; set(KEY, JSON.stringify(st)); return true;
    },
    complete(id) {
      const st = api._read(); if (!st) return false;
      const it = st.items.find(i => i.id === id); if (!it) return false;
      st.items = st.items.filter(i => i !== it); st.done = st.done || []; st.done.push({ ...it, doneAt: Date.now() });
      set(KEY, JSON.stringify(st)); return true;
    },
    // b = { bed?, text, p?, mins?, subs:[{t, tag}], src }；沒給 p 就用按鈕目前的設定
    add(b) {
      const now = Date.now();
      let p = b.p, due = b.mins ? now + b.mins * 60e3 : 0;
      if (!p) { const r = api.due(); if (r.err) { api.lastErr = r.err; return null; } p = pk.p; due = r.due; }
      const bed = b.bed != null ? String(b.bed).trim() : api.bed();
      let st = null;
      try { st = JSON.parse(get(KEY) || 'null'); } catch (e) {}
      if (!st || !Array.isArray(st.items)) st = { items: [], done: [] };
      if (st.seeded) { st.items = st.items.filter(i => !i.ex); st.done = (st.done || []).filter(i => !i.ex); st.seeded = false; }
      const id = now.toString(36) + Math.random().toString(36).slice(2, 5);
      const it = { id, bed, text: b.text, p, due, start: now, src: b.src || '' };
      if (b.subs && b.subs.length) it.subs = b.subs.map((s, k) => ({ id: id + '.' + k, t: s.t, tag: s.tag || '', d: 0 }));
      st.items.push(it);
      try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) { api.lastErr = '存不進待辦表'; return null; }
      if (bed) set(BED, bed);
      if (!b.p && parseInt(pk.cm, 10) > 0) { pk.cm = ''; pk.tm = 0; refresh(true); }
      try { parent.postMessage({ hub: 'todo-add', id, text: it.text, bed, n: (it.subs || []).length }, '*'); } catch (e) {}
      return id;
    }
  };

  // 按鈕行為跟待辦表的快速新增一樣：點「緊急／待辦」展開倒數，再點一次收起；倒數再點一次＝不計時
  document.addEventListener('click', e => {
    const pb = e.target.closest('[data-hp-p]'), tb = e.target.closest('[data-hp-tm]');
    if (pb) {
      const p = +pb.dataset.hpP;
      if (p === pk.p) pk.open = timed(p) && !pk.open;
      else { pk.p = p; pk.tm = 0; pk.cm = ''; pk.open = timed(p); }
      savePk(); refresh(true); return;
    }
    if (tb) {
      const m = +tb.dataset.hpTm; pk.cm = ''; pk.tm = pk.tm === m ? 0 : m;
      if (pk.tm === -2 && !pk.d) pk.d = ymd(new Date());
      savePk(); refresh(true);
      if (pk.tm === -2) { const d = document.querySelector('[data-hp-d]'); try { d && d.showPicker(); } catch (er) {} }
    }
  });
  document.addEventListener('input', e => {
    const t = e.target;
    if (t.matches('[data-hp-bed]')) { api.setBed(t.value); return; }
    if (t.matches('[data-hp-cm]')) { pk.cm = t.value; if (pk.tm < 0) pk.tm = 0; refresh(false); document.querySelectorAll('[data-hp-tm]').forEach(b => b.setAttribute('aria-pressed', 'false')); }
    if (t.matches('[data-hp-d]')) { pk.d = t.value; refresh(false); }
    if (t.matches('[data-hp-t]')) { pk.t = t.value; savePk(); refresh(false); }
  });
  addEventListener('storage', e => { if (e.key === BED) { document.querySelectorAll('[data-hp-bed]').forEach(i => { if (i !== document.activeElement) i.value = api.bed(); }); refresh(false); } });

  // 右滑加入待辦（滑超過門檻放開才加入；只往右，不影響上下捲動）
  // 手機用 touch 事件：第一下判斷是往右滑就立刻 preventDefault，iPhone 才不會把手勢交給外層去切換工具
  const TH = 64; let g = null, swiped = 0;
  function start(el, x, y, kind) { g = { el, x, y, kind, lock: false, dx: 0 }; }
  function move(x, y, ev) {
    if (!g) return;
    const dx = x - g.x, dy = y - g.y;
    if (!g.lock) {
      if (Math.abs(dx) < 4 && Math.abs(dy) < 4) return;
      if (dx > 0 && dx > Math.abs(dy)) {
        g.lock = true; g.el.classList.add('sw-drag'); document.body.classList.add('sw-on');
        try { getSelection().removeAllRanges(); } catch (er) {}
      } else { g = null; return; }
    }
    if (ev.cancelable) ev.preventDefault();
    ev.stopPropagation();
    const d = Math.max(0, dx), v = d < TH ? d : TH + (d - TH) * 0.35;
    g.dx = d;
    g.el.style.transform = `translateX(${v}px)`;
    g.el.style.setProperty('--sw', v + 'px'); g.el.style.setProperty('--swo', Math.min(1, d / TH));
    g.el.classList.toggle('sw-arm', d >= TH);
  }
  function finish(commit) {
    const G = g; g = null;
    if (!G || !G.lock) return;
    swiped = Date.now(); document.body.classList.remove('sw-on');
    const el = G.el;
    el.classList.remove('sw-drag', 'sw-arm'); el.classList.add('sw-back');
    el.style.transform = ''; el.style.setProperty('--sw', '0px'); el.style.setProperty('--swo', '0');
    setTimeout(() => el.classList.remove('sw-back'), 240);
    if (commit && G.dx >= TH && window.hubOnSwipe) {
      const r = window.hubOnSwipe(el); if (!r) return;
      if (r === true) { el.classList.remove('sw-done'); void el.offsetWidth; el.classList.add('sw-done'); try { navigator.vibrate && navigator.vibrate(15); } catch (er) {} return; }
      const id = api.add(r);
      if (!id) { window.hubSwipeErr && window.hubSwipeErr(api.lastErr); return; }
      el.classList.remove('sw-done'); void el.offsetWidth; el.classList.add('sw-done');
      if (window.hubOnSwiped) window.hubOnSwiped(el, id);
      try { navigator.vibrate && navigator.vibrate(15); } catch (er) {}
    }
  }
  const swEl = t => t && t.closest && !t.closest('input,textarea,select') ? t.closest('[data-swipe]') : null;
  document.addEventListener('touchstart', e => {
    if (e.touches.length !== 1) { g = null; return; }
    const el = swEl(e.target); if (!el) { g = null; return; }
    start(el, e.touches[0].clientX, e.touches[0].clientY, 'touch');
  }, { passive: true, capture: true });
  document.addEventListener('touchmove', e => { if (g && g.kind === 'touch') move(e.touches[0].clientX, e.touches[0].clientY, e); }, { passive: false, capture: true });
  document.addEventListener('touchend', () => { if (g && g.kind === 'touch') finish(true); }, { passive: true, capture: true });
  document.addEventListener('touchcancel', () => { if (g && g.kind === 'touch') finish(false); }, { passive: true, capture: true });
  // 電腦用滑鼠拖也可以
  document.addEventListener('pointerdown', e => { if (e.pointerType !== 'mouse' || e.button > 0) return; const el = swEl(e.target); if (el) start(el, e.clientX, e.clientY, 'mouse'); }, true);
  document.addEventListener('pointermove', e => { if (g && g.kind === 'mouse') move(e.clientX, e.clientY, e); }, true);
  document.addEventListener('pointerup', () => { if (g && g.kind === 'mouse') finish(true); }, true);
  document.addEventListener('click', e => { if (Date.now() - swiped < 400) { e.preventDefault(); e.stopPropagation(); } }, true);
})();
</script>

const nm = x => { const n = parseFloat(x); return isNaN(n) ? null : n; };
const VSD = {
  bt38: c => { const t = nm(c.v && c.v.bt); return t == null ? null : t >= 38 ? '+' : '-'; },
  bt39: c => { const t = nm(c.v && c.v.bt); return t == null ? null : t >= 39.5 ? '+' : '-'; },
  sbp90: c => { const t = nm(c.v && c.v.sbp); return t == null ? null : t < 90 ? '+' : '-'; },
  hr100: c => { const t = nm(c.v && c.v.pr); return t == null ? null : t > 100 ? '+' : '-'; },
  hr150: c => { const t = nm(c.v && c.v.pr); return t == null ? null : t >= 150 ? '+' : '-'; },
  spo2: c => { const t = nm(c.v && c.v.spo2); return t == null ? null : t < 90 ? '+' : '-'; },
  sug70: c => { const t = nm(c.v && c.v.sugar); return t == null ? null : t < 70 ? '+' : '-'; },
};
const odds = p => { p = Math.min(.999, Math.max(.001, p)); return p / (1 - p); };
const prob = o => o / (1 + o);
const pct = p => p < .01 ? '<1%' : p > .99 ? '>99%' : p < .1 ? (p * 100).toFixed(1) + '%' : Math.round(p * 100) + '%';
const lrTxt = v => v >= 10 ? Math.round(v) : v >= 1 ? +v.toFixed(1) : +v.toFixed(2);
const srcShort = s => s === 'est' ? '估計' : s === 'def' ? '定義' : String(s || '').replace(/(\d{2})$/, (m, y) => ' ' + (+y > 30 ? '19' : '20') + y);

const BXC = {};
function bdata(p){
  if (!p) return null;
  if (BXC[p.id]) return BXC[p.id];
  let src = BAYES[p.id];
  if (!src && p.ai){ const raw = PROG.custom[p.id]; src = raw && raw.bx; }
  if (!src || !src.d) return null;
  const ids = String(src.d).split(/\s+/);
  const dx = p.ddx.map((d, i) => ({...d, i, id:ids[i] || 'd' + i, pre:Math.min(.95, Math.max(.001, +src.p[i] || .05))}));
  const f = (src.f || []).map(a => ({id:a[0], zh:a[1], en:a[2], k:a[3], l:a[4], lr:a[5] || {}, src:a[6] || 'est', grp:a[7] || null, af:a[8] || null})).filter(f => f.id && f.zh);
  return BXC[p.id] = {dx, f, fid:Object.fromEntries(f.map(x => [x.id, x]))};
}
/* AI 產生的流程 → 與內建相同的精簡格式 */
function bxFromAI(data){
  const ddx = Array.isArray(data.ddx) ? data.ddx : [];
  const ids = ddx.map((d, i) => String(d.id || 'd' + i).replace(/[^\w]/g, '').slice(0, 12) || 'd' + i);
  const okId = new Set(ids);
  const f = (Array.isArray(data.fx) ? data.fx : []).slice(0, 30).map((x, j) => {
    const lr = {};
    Object.entries(x.lr || {}).forEach(([k, v]) => { if (!okId.has(k) || !Array.isArray(v)) return; const a = Math.min(50, Math.max(.02, +v[0] || 1)), b = Math.min(50, Math.max(.02, +v[1] || 1)); lr[k] = [a, b]; });
    let k = x.k === 'pe' ? 'p' : x.k === 't' ? 't' : 'x', l = 0;
    if (x.k === 'hx' && Number.isInteger(x.h)){ k = 'h'; l = x.h; }
    if (x.k === 'pe' && Number.isInteger(x.pe)) l = x.pe; else if (x.k === 'pe') k = 't';
    return ['a' + j, String(x.zh || x.en || '').slice(0, 60), String(x.en || x.zh || '').slice(0, 120), k, l, lr, String(x.src || 'est').slice(0, 40)];
  }).filter(a => a[1] && Object.keys(a[5]).length);
  return {d:ids.join(' '), p:ddx.map(d => Math.min(.9, Math.max(.002, +d.pre || .05))), f};
}

function fst(ctx, f){
  const o = ctx.fx && ctx.fx[f.id];
  if (o) return o === '?' ? null : o;
  if (f.k === 'h'){ const v = ctx.hx && ctx.hx[f.l]; return v === '+' ? '+' : v === '-' ? '-' : null; }
  if (f.k === 'p'){ const v = ctx.pe && ctx.pe[f.l]; if (v === 'n') return '-'; if (v === 'a') return ctx.pf && ctx.pf[f.id] ? '+' : null; return null; }
  if (f.k === 'v'){ const fn = VSD[f.l]; return fn ? fn(ctx) : null; }
  return null;
}
function bcalc(ctx, p){
  const B = bdata(p); if (!B) return null;
  const pre = ctx.pre || {}, cust = ctx.cust || [];
  const st = {}; B.f.forEach(f => { st[f.id] = fst(ctx, f); });
  const res = B.dx.map(d => {
    const p0 = pre[d.id] != null ? pre[d.id] : d.pre;
    const ev = [], best = {};
    B.f.forEach(f => {
      const lr = f.lr[d.id], s = st[f.id]; if (!lr || !s) return;
      const v = s === '+' ? lr[0] : lr[1]; if (!v || v === 1) return;
      const e = {f, s, v};
      if (f.grp){ const g = best[f.grp]; if (!g || Math.abs(Math.log(v)) > Math.abs(Math.log(g.v))) best[f.grp] = e; }
      else ev.push(e);
    });
    Object.values(best).forEach(e => ev.push(e));
    cust.forEach(u => { const v = +u.lr[d.id]; if (v && v !== 1) ev.push({f:{id:u.id, zh:u.zh, en:u.en, src:u.src, cust:true, why:u.why}, s:'+', v}); });
    let o = odds(p0); ev.forEach(e => { o *= e.v; });
    const post = prob(o);
    const usedGrp = new Set(Object.keys(best));
    const nxt = B.f.filter(f => f.lr[d.id] && !st[f.id] && !(f.grp && usedGrp.has(f.grp)))
      .map(f => { const [a, b] = f.lr[d.id]; const pa = prob(o * a), pb = prob(o * b); return {f, pa, pb, gain:Math.abs(pa - pb)}; })
      .filter(x => x.gain >= .02).sort((x, y) => y.gain - x.gain).slice(0, 3);
    ev.sort((a, b) => Math.abs(Math.log(b.v)) - Math.abs(Math.log(a.v)));
    return {d, pre:p0, post, ev, nxt};
  });
  return {B, res, st, n:Object.values(st).filter(Boolean).length + cust.length};
}
function bxRank(ctx, p){ const r = bcalc(ctx, p); return r ? r.res.slice().sort((a, b) => b.post - a.post) : null; }

function evLine(e){
  const up = e.v > 1, st = e.f.cust ? '' : e.s === '+' ? '陽性' : '陰性';
  return `<li class="${up ? 'up' : 'down'}"><span class="arw">${up ? '↑' : '↓'}</span><span>因為 <b>${esc(e.f.zh)}</b>${st ? ' ' + st : '（新資訊）'}，所以${up ? '較可能' : '較不可能'} <span class="lr">×${lrTxt(e.v)}</span> <span class="src" title="${esc(SRC[e.f.src] || e.f.src || '')}${e.f.why ? '：' + esc(e.f.why) : ''}">${esc(srcShort(e.f.src))}</span></span></li>`;
}
function bxCard(r, ctx, scope, mine){
  const d = r.d, open = BXUI.open.has(scope + d.id), must = d.tier === 'm';
  const prov = mine ? (mine.has(d.i) ? '<span class="pv me" title="你想到的"></span>' : '<span class="pv tool" title="工具補充"></span>') : '';
  const thr = must ? (r.post >= .02 ? `<p class="thr crit-t">尚未排除（≥2%）→ ${esc(d.check)}</p>` : `<p class="thr">已低於 2%；病人變化時要重新評估。</p>`) : '';
  const mark = ctx.ddx ? ctx.ddx[d.i] : null;
  return `<details class="bxc ${must ? 'must' : ''}" data-key="${scope}${d.id}" ${open ? 'open' : ''}>
    <summary>${prov}<span class="nm">${esc(d.n)}</span><span class="pc">${pct(r.post)}</span><span class="bar"><i style="width:${Math.max(1, Math.round(r.post * 100))}%"></i></span></summary>
    <div class="bxc-body">
      <div class="prepost"><label>驗前 <input class="inp s" type="number" min="0.1" max="95" step="0.1" data-in="bxpre" data-scope="${scope}" data-d="${d.id}" value="${+(r.pre * 100).toFixed(1)}">%</label><span>→ 驗後 <b>${pct(r.post)}</b></span></div>
      ${r.ev.length ? `<ul class="ev">${r.ev.map(evLine).join('')}</ul>` : '<p class="muted small">還沒有影響這個診斷的發現，目前就是驗前機率。</p>'}
      ${r.nxt.length ? `<div class="nx"><span class="k">還沒確認、最能改變判斷的</span>${r.nxt.map(x => `<div class="nxr"><span>${esc(x.f.zh)}</span><span class="seg"><button class="bad" data-act="bx-f" data-scope="${scope}" data-f="${x.f.id}" data-v="+">陽性 → ${pct(x.pa)}</button><button class="good" data-act="bx-f" data-scope="${scope}" data-f="${x.f.id}" data-v="-">陰性 → ${pct(x.pb)}</button></span></div>`).join('')}</div>` : ''}
      ${thr}
      <p class="small muted">線索：${esc(d.clue)}｜確認：${esc(d.check)}</p>
      <div class="row"><span class="seg" role="group" aria-label="判斷"><button class="lk" data-act="bx-mark" data-scope="${scope}" data-i="${d.i}" data-v="l" aria-pressed="${mark === 'l'}">最可能</button><button class="cs" data-act="bx-mark" data-scope="${scope}" data-i="${d.i}" data-v="c" aria-pressed="${mark === 'c'}">考慮</button><button class="ex" data-act="bx-mark" data-scope="${scope}" data-i="${d.i}" data-v="x" aria-pressed="${mark === 'x'}">排除</button></span>
        <a class="mini" href="${esc(utdUrl(d.n))}" target="_blank" rel="noopener">UpToDate ${ICON.ext}</a></div>
    </div></details>`;
}
function bxPanel(ctx, p, scope, R){
  const B = R.B, tri = f => { const s = R.st[f.id]; return `<span class="seg"><button class="bad" data-act="bx-f" data-scope="${scope}" data-f="${f.id}" data-v="+" aria-pressed="${s === '+'}">陽性</button><button class="good" data-act="bx-f" data-scope="${scope}" data-f="${f.id}" data-v="-" aria-pressed="${s === '-'}">陰性</button></span>`; };
  const tests = B.f.filter(f => f.k === 't' || f.k === 'x');
  const known = B.f.filter(f => R.st[f.id] && f.k !== 't' && f.k !== 'x');
  return `<div class="bx-new">
    <h4>檢驗、影像、補充病史</h4>
    <div class="items">${tests.map(f => `<div class="item"><div class="t">${esc(f.zh)}</div>${tri(f)}</div>`).join('')}</div>
    <details class="manual"><summary class="small">手動輸入 LR</summary>
      <div class="row" style="margin-top:6px"><input class="inp" id="bxmL" placeholder="發現名稱" style="flex:1;min-width:140px"><select class="inp s" id="bxmD">${B.dx.map(d => `<option value="${d.id}">${esc(d.n.slice(0, 40))}</option>`).join('')}</select><input class="inp s" id="bxmV" type="number" step="0.1" min="0.01" placeholder="LR"><button class="btn sm" data-act="bx-man" data-scope="${scope}">加入</button></div></details>
    ${(ctx.cust || []).length ? `<h4>已加入的新資訊</h4><div class="chips">${ctx.cust.map(u => `<span class="gchip">${esc(u.zh)}<button data-act="bx-cdel" data-scope="${scope}" data-id="${u.id}" aria-label="移除">×</button></span>`).join('')}</div>` : ''}
    ${known.length ? `<h4>目前採用的病史與檢查（從前面步驟帶入，可在這裡改）</h4><div class="items">${known.map(f => `<div class="item"><div class="t">${esc(f.zh)}</div>${tri(f)}</div>`).join('')}</div>` : ''}
  </div>`;
}
function bayesBoard(ctx, p, scope, mine){
  const R = bcalc(ctx, p); if (!R) return '';
  const list = R.res.slice().sort((a, b) => b.post - a.post);
  const open = !!BXUI.panel[scope];
  return `<div class="bx">
    <div class="bx-head"><div><span class="eyebrow">貝氏推論</span> <span class="muted small">採用 ${R.n} 項發現</span></div>
      <button class="btn sm ${open ? 'dark' : 'primary'}" data-act="bx-panel" data-scope="${scope}">${open ? '收起新資訊' : '＋ 輸入新資訊'}</button></div>
    ${open ? bxPanel(ctx, p, scope, R) : ''}
    <p class="bx-legend">${mine ? '<span class="pv me"></span>你想到的　<span class="pv tool"></span>工具補充　' : ''}<span class="crit-t">紅字</span>＝必須排除　點卡片看理由</p>
    <div class="bx-list">${list.map(r => bxCard(r, ctx, scope, mine)).join('')}</div>
    <p class="muted small">驗後勝算 = 驗前勝算 × 各發現的 LR。各診斷分開計算（可同時存在，不會加總為 100%），並假設發現彼此獨立。驗前機率為住院成人的粗估，請依病人調整；LR 標文獻者為約略值、標「估計」者無直接文獻。</p>
  </div>`;
}

document.addEventListener('toggle', e => {
  const d = e.target; if (!d.classList || !d.classList.contains('bxc')) return;
  const k = d.dataset.key; if (d.open) BXUI.open.add(k); else BXUI.open.delete(k);
}, true);
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act^="bx-"]'); if (!b) return;
  const d = b.dataset, scope = d.scope || 'call', ctx = bxCtx(scope); if (!ctx) return;
  const p = getProto(ctx.pid), B = bdata(p);
  ctx.fx = ctx.fx || {}; ctx.pf = ctx.pf || {}; ctx.cust = ctx.cust || []; ctx.ddx = ctx.ddx || {};
  switch (d.act){
  case 'bx-f': {
    const f = B && B.fid[d.f], curS = f ? fst(ctx, f) : null;
    if (curS === d.v) ctx.fx[d.f] = (f && (f.k === 't' || f.k === 'x' || scope === 'admit')) ? null : '?';
    else ctx.fx[d.f] = d.v;
    if (ctx.fx[d.f] == null) delete ctx.fx[d.f];
    break;
  }
  case 'bx-pf': ctx.pf[d.f] = !ctx.pf[d.f]; break;
  case 'bx-panel': BXUI.panel[scope] = !BXUI.panel[scope]; break;
  case 'bx-mark': ctx.ddx[d.i] = ctx.ddx[d.i] === d.v ? null : d.v; break;
  case 'bx-cdel': ctx.cust = ctx.cust.filter(u => u.id !== d.id); break;
  case 'bx-man': {
    const lab = ($('#bxmL').value || '').trim(), did = $('#bxmD').value, v = parseFloat($('#bxmV').value);
    if (!lab || !(v > 0)){ toast('請輸入發現名稱與 LR'); return; }
    ctx.cust.push({id:'u' + Date.now().toString(36), zh:lab, en:lab, lr:{[did]:Math.min(100, Math.max(.01, v))}, src:'手動'});
    break;
  }
  default: return;
  }
  bxRerender(scope);
});
document.addEventListener('change', e => {
  const el = e.target; if (!el.dataset || el.dataset.in !== 'bxpre') return;
  const ctx = bxCtx(el.dataset.scope); if (!ctx) return;
  const v = parseFloat(el.value); ctx.pre = ctx.pre || {};
  if (v > 0 && v < 100) ctx.pre[el.dataset.d] = v / 100; else delete ctx.pre[el.dataset.d];
  bxRerender(el.dataset.scope);
});

const wkNew = () => ({pid:null, mine:[], hits:null, extra:[], revealed:true, inc:{}, lq:{}, ev:[], evTxt:{}, fx:{}, pf:{}, pre:{}, cust:[], ddx:{}, ed:'', order:null, imp:'', pi:'', qmine:'', qhits:null, blindRes:null});
function wkEnsure(){ const a = UI.admit; if (!a) return null; if (!a.w) a.w = wkNew(); if (!a.ph) a.ph = 'form'; return a.w; }
function wkRender(){ if (UI.view !== 'admit' || !UI.admit) return; const y = window.scrollY; render(); window.scrollTo(0, y); saveDraft(); }
function wkSync(){
  const a = UI.admit, w = a.w, f = a.f;
  w.v = {bt:f.bt, sbp:f.sbp, pr:f.pr, rr:f.rr};
  const g = gcsOf(f); w.ams = g != null && /^\d+$/.test(g) && +g < 15;

/* ---------- 3 整理 PI ---------- */
function wkPron(f){ const F = f.gender === '女', M = f.gender === '男'; return {S:F ? 'She' : M ? 'He' : 'The patient', s:F ? 'she' : M ? 'he' : 'the patient', o:F ? 'her' : M ? 'him' : 'the patient', sex:F ? 'woman' : M ? 'man' : 'patient'}; }

  return {L:L.L, Q:L.Q, N, R:L.R, P:L.P, E:L.E, on:parseOpts(LQ_BASE.on), dur:parseOpts(LQ_BASE.dur), crs:parseOpts(LQ_BASE.crs), ev:parseOpts(LQ_BASE.ev)};

function wkOrder(w, p){

function wkCompose(){

  const p1 = pmh.length ? [`This ${f.age || '[age]'}-year-old ${P.sex} had the history as below.`, ...pmh.map((s, i) => `${i + 1}. ${s}`)].join('\n') : `This ${f.age || '[age]'}-year-old ${P.sex} had [past history].`;
  const s2 = [], dur = sel('dur')[0], on = sel('on')[0], crs = sel('crs');

const PE_RE = /\b(on (?:physical )?exam(?:ination)?|physical examination|auscultation|crackles?|rales|rhonchi|egophony|murmurs?|gallops?|S3|JVE|JVD|jugular ven\w*|pitting|tenderness|rebound|guarding|Murphy|McBurney|psoas sign|knocking pain|bowel sounds?|asterixis|pupils?|GCS|E\dV\dM\d|SpO2|conjunctiva\w*|icteric|Stemmer)\b/gi;

/* ===== protocols ===== */
const CAT = {lab:'檢驗', img:'影像／ECG', med:'藥物／輸液', nurse:'護理', consult:'會診', note:'紀錄'};
const GENERIC_ORD = [
  {cat:'nurse', t:'密切監測生命徵象，惡化時立即通知', o:'Close monitoring of vital signs; notify if deterioration', g:1},
  {cat:'note', t:'已與學長姊／主治討論', o:'Discussed with senior resident / attending physician', g:1},
];
function normBuiltin(r){
  const k = s => s.startsWith('!');
  return {id:r.id, zh:r.zh, en:r.en, alias:r.alias, call:r.call, now:r.now,
    hx: r.hx.map(a => ({t:a[0].replace(/^!/,''), key:k(a[0]), en:a[1], why:a[2]||''})),
    pe: r.pe.map(a => ({t:a[0].replace(/^!/,''), key:k(a[0]), en:a[1], n:a[2]})),
    ddx: r.ddx.map(a => ({tier:a[0], n:a[1], k:a[2], clue:a[3], check:a[4]})),
    ord: [...r.ord.map(a => ({cat:a[0], t:a[1], o:a[2]})), ...GENERIC_ORD],
    pearl: r.pearl};
}
const BUILTIN = PROTOS_RAW.map(normBuiltin);
const PMAP = Object.fromEntries(BUILTIN.map(p => [p.id, p]));
const customCache = {};
function normAI(r){
  const arr = x => Array.isArray(x) ? x : [];
  const S = x => String(x ?? '').trim();
  return {id:r.id, zh:S(r.zh)||'自訂主訴', en:S(r.en), alias:`${S(r.zh)} ${S(r.en)}`, ai:true,
    call:arr(r.call).map(S).filter(Boolean), now:arr(r.now).map(S).filter(Boolean),
    hx:arr(r.hx).map(h => ({t:S(h.t), en:S(h.en)||S(h.t), why:S(h.why), key:!!h.key})).filter(h => h.t),
    pe:arr(r.pe).map(h => ({t:S(h.t), en:S(h.en)||S(h.t), n:S(h.n)||'normal', key:!!h.key})).filter(h => h.t),
    ddx:arr(r.ddx).map(d => ({tier:d.tier === 'm' ? 'm' : 'c', n:S(d.n), k:S(d.k), clue:S(d.clue), check:S(d.check)})).filter(d => d.n),
    ord:[...arr(r.ord).map(o => ({cat:CAT[o.cat] ? o.cat : 'note', t:S(o.t), o:S(o.o)||S(o.t)})).filter(o => o.t), ...GENERIC_ORD],
    pearl:arr(r.pearl).map(S).filter(Boolean)};
}
function getProto(id){
  if (!id) return null;
  if (PMAP[id]) return PMAP[id];
  const raw = PROG.custom[id]; if (!raw) return null;
  if (!customCache[id] || customCache[id].raw !== raw) customCache[id] = {raw, p:normAI(raw)};
  return customCache[id].p;
}
const allProtos = () => [...BUILTIN, ...Object.keys(PROG.custom).map(getProto).filter(Boolean)];

// 進行中的 call 只存在這個分頁（sessionStorage）。
// Admission note 存在 localStorage（oncall.admit.v1），總站的雲端同步會帶到你其他的裝置：手機問診打的，電腦打開就能接著寫、複製貼到 EMR。
function writeAdmit(){ try { const v = UI.admit ? JSON.stringify(UI.admit) : null; if (v == null) localStorage.removeItem(ADMIT_KEY); else if (localStorage.getItem(ADMIT_KEY) !== v) localStorage.setItem(ADMIT_KEY, v); } catch {} }
function saveDraft(){
  clearTimeout(draftT);
  draftT = setTimeout(() => { try { sessionStorage.setItem(DRAFT_KEY, JSON.stringify({calls:UI.calls})); } catch {} writeAdmit(); }, 400);
}
function loadDraft(){
  let old = null;
  try { const d = JSON.parse(sessionStorage.getItem(DRAFT_KEY) || 'null'); if (d){ UI.calls = Array.isArray(d.calls) ? d.calls : []; old = d.admit || null; } } catch {}
  try { UI.admit = JSON.parse(localStorage.getItem(ADMIT_KEY) || 'null') || old; } catch { UI.admit = old; }
  if (old && UI.admit === old) writeAdmit();   // 舊版存在分頁裡的 note，搬過去
  restoreDraftValidity();
}
// 別台裝置改了 admission note：正在這裡打字時先不換（免得游標跳走、打的字被蓋掉），停下來（離開輸入框）再換
let admitRemote;
function applyRemoteAdmit(){
  if (admitRemote === undefined) return;
  const raw = admitRemote; admitRemote = undefined;
  let a = null; try { a = JSON.parse(raw || 'null'); } catch { return; }
  if (JSON.stringify(UI.admit) === JSON.stringify(a)) return;
  clearTimeout(draftT);
  UI.admit = a;
  if (UI.view === 'admit' && !a) { go('home'); toast('Admission note 在另一台裝置清除了'); return; }
  const y = window.scrollY; render(); window.scrollTo(0, y);

}
addEventListener('storage', e => {

function findProtos(q){
  q = q.trim().toLowerCase(); if (!q) return [];
  const toks = q.split(/[\s,，、/]+/).filter(Boolean);
  return allProtos().map(p => {
    const hay = `${p.zh} ${p.en} ${p.alias}`.toLowerCase();
    let s = 0;
    if (q.includes(p.zh.toLowerCase())) s += 4;
    if (hay.includes(q)) s += 3;
    { const z = p.zh; let j = 0; for (const ch of q) if (ch === z[j]) j++; if (z.length >= 2 && j === z.length && !q.includes(z)) s += 3; }
    String(p.alias).toLowerCase().split(/\s+/).forEach(w => { if (w.length >= 2 && q.includes(w)) s += 2; });
    toks.forEach(t => { if (t.length >= 1 && hay.includes(t)) s += 1; });
    return {p, s};
  }).filter(x => x.s > 0).sort((a, b) => b.s - a.s).map(x => x.p);
}
function suggestHTML(){
  const q = UI.ccq.trim(); if (!q) return '';
  const hits = findProtos(q).slice(0, 5);
  return hits.length ? hits.map(p => `<button data-act="start" data-id="${p.id}"><b>${esc(p.zh)}</b><span class="muted small">${esc(p.en)}</span></button>`).join('')
    : `<div class="status muted small">內建清單沒有「${esc(q)}」，請從下方選最接近的主訴。</div>`;
}
function refreshSuggest(){ const el = $('#ccSuggest'); if (!el) return; el.innerHTML = suggestHTML(); el.hidden = !(UI.ccq.trim() || UI.gen); }
function submitCC(){
  const q = UI.ccq.trim(); if (!q) return;
  const hits = findProtos(q);
  if (hits.length) startCall(hits[0].id); else refreshSuggest();
}

function setEval(c, k, i, v){
  const key = k + ':' + i, nv = c[k][i] === v ? null : v;
  c[k][i] = nv; c.stage = c.stage || [];
  if (nv === 'p'){
    if (tdState(c, key) !== 'open' && !c.stage.includes(key)){
      c.stage.push(key); if (c.imp) delete c.imp['s:' + key];
      setTimeout(() => { const b = document.querySelector('.impbar'); if (b){ b.classList.remove('bump'); void b.offsetWidth; b.classList.add('bump'); } }, 0);
    }
  } else if (nv) tdSettle(c, key);
  else c.stage = c.stage.filter(x => x !== key);
}

function bedAskHTML(c){

}

function nowLeft(c, p){ return p.now.map((t, i) => i).filter(i => !c.safe[i] && !tdState(c, 'now:' + i)); }
function nowBtnHTML(c, p){
  const L = nowLeft(c, p); if (!L.length) return '';

function nowUrgent(c, p){
  const L = nowLeft(c, p); if (!L.length) return;
  if (!cbed(c)){ UI.bedAsk = true; UI.bedThen = 'now'; render(); return; }
  const id = hubTodo.add({bed:cbed(c), text:`${p.zh}：先做`, p:2, src:'主訴處理', subs:L.map(i => ({t:p.now[i], tag:'先做'}))});
  if (!id){ toast(hubTodo.lastErr || '存不進待辦表', 'err'); return; }
  c.todo = c.todo || {}; L.forEach((i, k) => { c.todo['now:' + i] = {id, k}; });
  rerenderCall();
}
function impGo(c, p){
  const R = impRows(c, p).filter(r => r.on); if (!R.length) return;
  if (!cbed(c)){ toast('先填床號再送出', 'err'); const i = $('#impBed'); if (i) i.focus(); return; }
  const id = hubTodo.add({bed:cbed(c), text:`${p.zh}${c.reason.trim() ? '（' + c.reason.trim() + '）' : ''}`, src:'主訴處理', subs:R.map(r => ({t:r.t, tag:r.tag}))});
  if (!id){ toast(hubTodo.lastErr || '存不進待辦表', 'err'); return; }
  c.imported = Date.now(); c.todo = c.todo || {};
  R.forEach((r, k) => { if (r.key){ c.todo[r.key] = {id, k}; } });
  const sent = new Set(R.filter(r => r.key).map(r => r.key));
  c.stage = (c.stage || []).filter(x => !sent.has(x)); c.imp = {};
  UI.impOpen = false; rerenderCall();
}

function checkSel(){
  const a = document.activeElement; let text = '';
  if (a && (a.tagName === 'TEXTAREA' || (a.tagName === 'INPUT' && (a.type === 'text' || a.type === '' || a.type === 'search')))){
    try { const s = a.selectionStart, e = a.selectionEnd; if (s != null && e > s) text = a.value.slice(s, e); } catch {}
  } else {
    const s = window.getSelection();
    if (s && !s.isCollapsed && s.anchorNode && !$('#selbar').contains(s.anchorNode)) text = s.toString();
  }

/* ===== toast & copy ===== */
let toastQ = [], toasting = false;
function toast(msg, kind){ toastQ.push([msg, kind]); if (!toasting) nextToast(); }
function nextToast(){
  const n = toastQ.shift(), el = $('#toast');
  if (!n){ toasting = false; el.hidden = true; return; }
  toasting = true; el.textContent = n[0]; el.className = 'toast ' + (n[1] || ''); el.hidden = false;
  el.style.animation = 'none'; void el.offsetWidth; el.style.animation = '';

async function copyText(t, btn){
  const done = ok => { if (!btn) return; const o = btn.innerHTML; btn.textContent = ok ? '已複製' : '請手動選取複製'; setTimeout(() => { btn.innerHTML = o; }, 1400); };
  try { await navigator.clipboard.writeText(t); done(true); }
  catch {
    const ta = document.createElement('textarea'); ta.value = t; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    let ok = false; try { ok = document.execCommand('copy'); } catch {}
    ta.remove(); done(ok);
  }
}

  case 'copy-an': copyText(buildAN(UI.admit.f), b); break;
  /* help */
  case 'help-to': { const el = document.getElementById(d.id); if (el) el.scrollIntoView({behavior:'smooth', block:'start'}); break; }
  /* drawer & selection */
  case 'sel-close': hideSelBar(); try { window.getSelection().removeAllRanges(); } catch {} break;
  }
});
document.addEventListener('input', e => {
  const el = e.target, k = el.dataset && el.dataset.in; if (!k) return;
  const c = cur();
  switch (k){
  case 'cc': UI.ccq = el.value; if (UI.gen && !UI.gen.ctl) UI.gen = null; refreshSuggest(); return;
  case 'v': c.v[el.dataset.k] = el.value.trim(); refreshVitals(); updateNote(); break;
  case 'reason': c.reason = el.value; updateNote(); break;
  case 'hxNote': c.hxNote = el.value; updateNote(); break;
  case 'peNote': c.peNote[el.dataset.i] = el.value; updateNote(); break;
  case 'ordExtra': c.ordExtra = el.value; updateNote(); break;
  case 'bed': c.bed = el.value; hubTodo.setBed(el.value); { const h = $('#callBed'); if (h) h.textContent = cbed(c) ? cbed(c) + ' 床' : '未填床號'; } break;
  case 'final': c.final = el.value; updateNote(); break;
  case 'af': UI.admit.f[el.dataset.k] = el.value; refreshAdmitMeta(el.dataset.k); break;
  case 'utd': PROG.prefs.utd = el.value.trim() || DEFAULT_PROG.prefs.utd; persist(); return;
  }
  saveDraft();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && UI.impOpen){ UI.impOpen = false; rerenderCall(); } });
function bedThen(c){ const t = UI.bedThen; UI.bedThen = null; if (t === 'now' && cbed(c)) nowUrgent(c, getProto(c.pid)); }
document.addEventListener('submit', e => {
  e.preventDefault();
  if (e.target.matches('[data-bedform]')){ const c = cur(); if (c){ setCallBed(c, $('#askBed').value); bedThen(c); } return; }
  if (e.target.id === 'ccForm') submitCC();
});
document.addEventListener('selectionchange', scheduleSel);
document.addEventListener('select', scheduleSel, true);
document.addEventListener('mouseup', scheduleSel, true);
document.addEventListener('keyup', scheduleSel, true);
document.addEventListener('touchend', scheduleSel, true);
setInterval(() => { const t = $('#timer'), c = cur(); if (t && c && UI.view === 'call') t.textContent = mmss((Date.now() - c.started)); }, 1000);

/* ===== boot ===== */
loadLocal();
loadDraft();
try { if (location.hash === '#help') UI.view = 'help'; } catch {}
render();

</script>
