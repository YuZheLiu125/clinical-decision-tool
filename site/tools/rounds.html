<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>查房板</title>
<style id="hub-base">
/* 臨床輔助決策工具 · 共用基底（每個工具都內嵌這一份）
   字體：系統字（iPhone = 蘋方，Android = Noto CJK），不下載網路字型，開啟更快
   色票：病房冷灰底 + 各工具辨識色；動畫：同一組曲線與時長 */
:root{
  --hub-bg:#EEF1F2; --hub-surface:#FFFFFF; --hub-surface2:#E6EAEC; --hub-ink:#152025; --hub-ink2:#4A575E; --hub-ink3:#6E7A81; --hub-line:#D3DADD;
  --hub-bad:#B3261E; --hub-bad-soft:#FBE6E4; --hub-warn:#9A5B00; --hub-warn-soft:#FBEFD9; --hub-ok:#1D7A3E; --hub-ok-soft:#E1F2E6;
  --hub-code:#C0262F; --hub-code-soft:#FBE4E5; --hub-pilot:#A35500; --hub-pilot-soft:#F6E7D2;
  --hub-consult:#2C5C8C; --hub-consult-soft:#DFE8F2; --hub-meds:#0D6870; --hub-meds-soft:#DDEFF0;
  --hub-labs:#5B4699; --hub-labs-soft:#EBE6F6; --hub-todo:#B4573A; --hub-todo-soft:#F5E3DA;
  --hub-p1:#B3322B; --hub-p2:#C27416; --hub-p3:#4F6B8A; --hub-p4:#8A867B;
  --hub-sans:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Noto Sans CJK TC","Microsoft JhengHei",system-ui,sans-serif;
  --hub-mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,"Roboto Mono",monospace;
  --hub-ease:cubic-bezier(.2,.8,.2,1); --hub-dur:.18s;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --hub-bg:#0E1316; --hub-surface:#161D21; --hub-surface2:#1E272C; --hub-ink:#E4E9EB; --hub-ink2:#A2AEB4; --hub-ink3:#7E8B93; --hub-line:#2A353B;
  --hub-bad:#FF7A70; --hub-bad-soft:#3A1B19; --hub-warn:#F0B04A; --hub-warn-soft:#352812; --hub-ok:#6CCF8E; --hub-ok-soft:#15301F;
  --hub-code:#FF6B70; --hub-code-soft:#3A1A1D; --hub-pilot:#F0A23A; --hub-pilot-soft:#3A2911;
  --hub-consult:#80B1E0; --hub-consult-soft:#162636; --hub-meds:#5CC2C8; --hub-meds-soft:#16302F;
  --hub-labs:#B4A2EC; --hub-labs-soft:#2A2440; --hub-todo:#E08A68; --hub-todo-soft:#3A241B; --hub-p1:#EF6A5E; --hub-p2:#E3A04A; --hub-p3:#8FABC9; --hub-p4:#A6A297; color-scheme:dark}}
:root[data-theme="dark"]{
  --hub-bg:#0E1316; --hub-surface:#161D21; --hub-surface2:#1E272C; --hub-ink:#E4E9EB; --hub-ink2:#A2AEB4; --hub-ink3:#7E8B93; --hub-line:#2A353B;
  --hub-bad:#FF7A70; --hub-bad-soft:#3A1B19; --hub-warn:#F0B04A; --hub-warn-soft:#352812; --hub-ok:#6CCF8E; --hub-ok-soft:#15301F;
  --hub-code:#FF6B70; --hub-code-soft:#3A1A1D; --hub-pilot:#F0A23A; --hub-pilot-soft:#3A2911;
  --hub-consult:#80B1E0; --hub-consult-soft:#162636; --hub-meds:#5CC2C8; --hub-meds-soft:#16302F;
  --hub-labs:#B4A2EC; --hub-labs-soft:#2A2440; --hub-todo:#E08A68; --hub-todo-soft:#3A241B; --hub-p1:#EF6A5E; --hub-p2:#E3A04A; --hub-p3:#8FABC9; --hub-p4:#A6A297; color-scheme:dark}

/* 觸控：點擊不延遲、不閃灰框、iPhone 不自動放大字 */
html{-webkit-tap-highlight-color:transparent;touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{-webkit-font-smoothing:antialiased;text-rendering:optimizeSpeed}
::selection{background:color-mix(in srgb,var(--hub-accent,var(--hub-ink)) 22%,transparent)}
/* iPhone 點進字小於 16px 的輸入框會自動放大、而且不會縮回來：觸控裝置上所有輸入框一律 ≥16px */
@media (pointer:coarse){input:not([type="checkbox"]):not([type="radio"]):not([type="range"]),textarea,select{font-size:max(16px,1em)!important}}
/* 共用動畫：按下去微縮、顏色淡入淡出（低權重，工具自己的設定優先） */
:where(button,.btn,.chip,.card,summary,[role="tab"],a){transition:background-color var(--hub-dur) var(--hub-ease),border-color var(--hub-dur) var(--hub-ease),color var(--hub-dur) var(--hub-ease),box-shadow var(--hub-dur) var(--hub-ease),opacity var(--hub-dur) var(--hub-ease),transform .12s var(--hub-ease)}
:where(button,.btn,.chip,[role="tab"]):active:not(:disabled){transform:scale(.97)}
@keyframes hub-in{from{opacity:0;transform:translateY(6px)}}
@keyframes hub-pop{0%{transform:scale(1)}40%{transform:scale(1.18)}100%{transform:scale(1)}}
.hub-toast{position:fixed;left:16px;right:16px;margin:0 auto;width:fit-content;bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:60;max-width:min(520px,calc(100% - 32px));box-sizing:border-box;display:flex;gap:10px;align-items:center;background:var(--hub-ink);color:var(--hub-bg);font:500 14px/1.4 var(--hub-sans);padding:9px 14px;border-radius:999px;box-shadow:0 8px 24px rgba(0,0,0,.25);animation:hub-in .22s var(--hub-ease)}
/* 待辦設定按鈕：跟待辦表的快速新增同一套（立即／緊急／待辦／有空，點緊急或待辦展開倒數） */
.hp{display:flex;flex-direction:column;gap:8px;min-width:0}
.hp-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.hp-pr{--pc:var(--hub-p3);display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:0;min-height:46px;padding:4px;border:1px solid color-mix(in srgb,var(--pc) 45%,var(--hub-line));border-radius:999px;background:transparent;color:var(--pc);font:500 15px/1.2 var(--hub-sans);cursor:pointer}
.hp-pr[data-p="1"]{--pc:var(--hub-p1)}.hp-pr[data-p="2"]{--pc:var(--hub-p2)}.hp-pr[data-p="4"]{--pc:var(--hub-p4)}
.hp-pr small{font-size:12px;font-variant-numeric:tabular-nums}
.hp-pr small:empty{display:none}
.hp-pr[aria-pressed="true"]{background:var(--pc);border-color:var(--pc);color:var(--hub-surface)}
.hp-tm{display:flex;gap:6px;overflow-x:auto;overscroll-behavior-x:contain;scrollbar-width:none;padding:2px}
.hp-tm::-webkit-scrollbar{display:none}
.hp-c{flex:none;min-height:40px;border:1px solid var(--hub-line);background:transparent;border-radius:999px;padding:6px 14px;font:15px/1 var(--hub-sans);color:var(--hub-ink);white-space:nowrap;cursor:pointer;font-variant-numeric:tabular-nums}
.hp-c[aria-pressed="true"]{background:var(--hub-ink);border-color:var(--hub-ink);color:var(--hub-bg)}
.hp input{flex:none;font:16px var(--hub-sans);min-height:40px;padding:5px 10px;border-radius:999px;border:1px solid var(--hub-line);background:var(--hub-bg);color:var(--hub-ink);width:80px;text-align:center}
.hp-dt{display:flex;gap:6px}
.hp-dt input[type="date"]{flex:1 1 9.5em;width:auto;max-width:12em}
.hp-dt input[type="time"]{width:7em}
/* 右滑加入待辦 */
[data-swipe]{position:relative;touch-action:pan-y}
[data-swipe].sw-drag{transition:none!important}
[data-swipe].sw-back{transition:transform .22s var(--hub-ease)!important}
[data-swipe]::before{content:"＋ 待辦";position:absolute;top:0;bottom:0;right:100%;width:var(--sw,0px);display:flex;align-items:center;justify-content:flex-end;padding-right:12px;box-sizing:border-box;background:var(--hub-todo);color:var(--hub-surface);font:700 14px/1 var(--hub-sans);white-space:nowrap;overflow:hidden;opacity:var(--swo,0);pointer-events:none}
[data-swipe].sw-arm::before{content:"放開加入"}
body.sw-on{-webkit-user-select:none;user-select:none}
@keyframes hub-flash{from{background-color:var(--hub-todo-soft);box-shadow:inset 4px 0 0 var(--hub-todo)}}
.sw-done{animation:hub-flash .9s var(--hub-ease)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}}

html:root:root{--bg:var(--hub-bg);--surface:var(--hub-surface);--line:var(--hub-line);--fg:var(--hub-ink);--muted:var(--hub-ink2);--accent:var(--hub-todo);--accent-soft:var(--hub-todo-soft);--p1:var(--hub-p1);--p1-soft:var(--hub-bad-soft);--p2:var(--hub-p2);--p3:var(--hub-p3);--p4:var(--hub-p4);--hub-accent:var(--hub-todo);--font-display:var(--hub-sans);--font-body:var(--hub-sans);--font-num:var(--hub-mono)}

/* 版面放寬（11/11）：卡片、按鈕、表單的間距和字級都加大，手機抽屜和電腦側欄都不擠 */
.wrap{gap:20px;padding-block:18px 56px}
form{padding:14px;gap:10px}
.row{gap:10px}
#bed{width:76px}
.prrow{gap:8px}
.summary{font-size:14px;gap:12px}
.list{gap:12px}
.item{padding:14px 14px 14px 16px;gap:6px 12px}
.meta{gap:10px}
.bed{font-size:15px}
.tag{font-size:12px}
.src,.ex{font-size:12px}
.text{font-size:16px;line-height:1.5}
.timer{font-size:23px}
.timer small{font-size:12px;margin-top:2px}
.actions{gap:10px;margin-top:10px}
.act{min-height:44px;padding:8px 18px;font-size:15px}
.sub{padding:12px 4px;font-size:15px;line-height:1.5;gap:10px}
.sbox{width:22px;height:22px}
.subadd{gap:8px;margin:10px 3px 4px}
.subadd input{min-height:44px!important;padding:8px 12px!important}
.subadd button{min-height:44px;padding:0 16px;font-size:15px}
.tbtn{min-height:42px;padding:8px 16px;font-size:14.5px}
.foot{gap:10px}
details{padding:12px 14px}
.donelist{gap:8px;font-size:15px}
.note{font-size:13px;line-height:1.6}
.triage{font-size:14px;padding:10px 12px}
/* 窄的時候（手機抽屜）：倒數移到卡片右上角，內容用整張卡的寬度 */
@media (max-width:460px){
  .item .timer{grid-row:1;grid-column:2;align-self:start;font-size:19px;white-space:nowrap}
  .item .timer small{display:inline;margin-left:4px}
  .item .text{grid-column:1/-1}
  .actions{gap:8px}
  .act{padding:8px 13px}
}
</style>
<style>
/* 查房板：每床一張卡（problem／每日清單／等待中結果／異常值趨勢），逐床跑、產生交班、匯入站（電腦 → QR → 手機）
   辨識色：苔綠 */
:root{--ac:#3F6B2E;--ac-soft:#E3EEDC;--hub-accent:var(--ac)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ac:#93CC7C;--ac-soft:#1E2E18}}
:root[data-theme="dark"]{--ac:#93CC7C;--ac-soft:#1E2E18}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--hub-bg);color:var(--hub-ink)}
body{font:16px/1.5 var(--hub-sans);padding:0 0 calc(90px + env(safe-area-inset-bottom,0px))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:780px;margin:0 auto;padding:0 16px}
.bar{position:sticky;top:0;z-index:10;background:var(--hub-bg);border-bottom:1px solid var(--hub-line);padding:6px 0}
.bar .wrap{display:flex;gap:6px;align-items:center;flex-wrap:nowrap}
/* 頂端列只佔一行：按鈕比內容區的按鈕小，主要畫面留給病人 */
.bar .btn{min-height:36px;padding:5px 12px;font-size:14px}
.bar .btn.ghost{padding-left:8px;padding-right:8px}
/* 頂端工具列在窄螢幕縮小一點，四顆按鈕才排得進一行 */
@media (max-width:440px){.bar .btn{padding:5px 10px;font-size:13.5px}.prog{font-size:12px}}
.btn{border:1px solid var(--hub-line);background:var(--hub-surface);border-radius:999px;padding:8px 16px;min-height:42px;font-size:15px;white-space:nowrap}
.btn.pri{background:var(--ac);border-color:var(--ac);color:var(--hub-surface);font-weight:700}
.btn.sm{min-height:36px;padding:5px 13px;font-size:14px}
.btn.bad{color:var(--hub-bad);border-color:color-mix(in srgb,var(--hub-bad) 45%,var(--hub-line))}
.btn.ghost{background:transparent}
.prog{font-size:13px;color:var(--hub-ink2);margin-right:auto;font-variant-numeric:tabular-nums;white-space:nowrap;min-width:0;overflow:hidden;text-overflow:ellipsis}
.prog b{color:var(--ac);font-size:15px}
.save{display:flex;align-items:center;gap:8px;margin:10px 0 0;padding:4px 6px 4px 12px;border-radius:999px;font-size:13px;background:var(--hub-warn-soft);color:var(--hub-warn);border:1px solid color-mix(in srgb,var(--hub-warn) 35%,transparent)}
.save.hot{background:var(--hub-bad);color:var(--hub-surface);border-color:var(--hub-bad);font-weight:700}
.save.ok{background:var(--hub-ok-soft);color:var(--hub-ok);border-color:transparent}
.save span{flex:1;min-width:0}
.save .btn{color:var(--hub-ink);min-height:30px;padding:2px 12px;font-size:13px}
h2{font-size:13.5px;letter-spacing:.1em;color:var(--hub-ink2);margin:26px 0 8px;font-weight:600;display:flex;align-items:center;gap:8px}
h2 .btn{margin-left:auto;letter-spacing:0}
.empty{color:var(--hub-ink3);font-size:14px;padding:10px 2px}
/* 床卡列表 */
.beds{display:grid;gap:8px;margin-top:10px}
.bed{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:2px 12px;align-items:center;text-align:left;background:var(--hub-surface);border:1px solid var(--hub-line);border-left:4px solid var(--ac);border-radius:12px;padding:10px 12px;width:100%}
.bed .no{grid-row:1/3;font:700 22px/1 var(--hub-mono);min-width:2.2em;text-align:center}
.bed .nm{font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bed .dx{font-size:13px;color:var(--hub-ink2);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bed .tags{grid-column:1/-1;display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.bed .ok{grid-row:1/3;grid-column:3;font-size:12px;color:var(--hub-ok);font-weight:700}
.tag{font-size:12px;border-radius:999px;padding:1px 8px;background:var(--hub-surface2);color:var(--hub-ink2);white-space:nowrap}
.tag.bad{background:var(--hub-bad-soft);color:var(--hub-bad);font-weight:600}
.tag.warn{background:var(--hub-warn-soft);color:var(--hub-warn)}
.tag.ac{background:var(--ac-soft);color:var(--ac)}
/* 詳細頁 */
.sec{background:var(--hub-surface);border:1px solid var(--hub-line);border-radius:14px;padding:14px;margin-top:10px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row+.row{margin-top:10px}
.fld{display:flex;flex-direction:column;gap:4px;flex:1 1 140px;min-width:0}
.fld>span{font-size:13px;color:var(--hub-ink3)}
input[type=text],input[type=date],input[type=number],select,textarea{border:1px solid var(--hub-line);background:var(--hub-bg);border-radius:10px;padding:9px 12px;min-height:44px;width:100%;min-width:0;font-size:16px}
textarea{min-height:88px;resize:vertical;line-height:1.55}
.list{display:grid;gap:8px}
.item{border:1px solid var(--hub-line);border-radius:12px;padding:12px;background:var(--hub-bg)}
.item.red{border-color:var(--hub-bad);box-shadow:inset 3px 0 0 var(--hub-bad)}
.item.done{opacity:.55}
.item .t{font-weight:600}
.sub{font-size:14px;color:var(--hub-ink2)}
/* 新增表單：第一層是一整列的主要輸入，第二層放日期／天數／選單和「新增」按鈕 */
.form{display:grid;gap:10px;margin-top:12px;padding-top:12px;border-top:1px dashed var(--hub-line)}
.form .f2{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end}
.form .f2 .fld{flex:1 1 130px;max-width:260px}

.form .add{flex:1 0 110px;max-width:220px;min-height:44px;font-weight:700;margin-left:auto}
.form-t{font-size:13px;font-weight:600;color:var(--hub-ink2);margin:0}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:1px solid var(--hub-line);background:var(--hub-surface);border-radius:999px;padding:5px 13px;font-size:14px;min-height:38px}
.seg button[aria-pressed=true]{background:var(--hub-ink);border-color:var(--hub-ink);color:var(--hub-bg)}
.seg button.st-worse[aria-pressed=true]{background:var(--hub-bad);border-color:var(--hub-bad);color:var(--hub-surface)}
.seg button.st-better[aria-pressed=true]{background:var(--hub-ok);border-color:var(--hub-ok);color:var(--hub-surface)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 0}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--hub-line);background:var(--hub-surface);border-radius:999px;padding:6px 13px;font-size:14px;min-height:38px}
.fu{display:flex;gap:10px;align-items:center;font-size:15px;padding:7px 0;line-height:1.45}
.fu+.fu{border-top:1px solid color-mix(in srgb,var(--hub-line) 60%,transparent)}
.fu input[type=checkbox]{width:22px;height:22px;flex:none}
.fu .w{font:12px var(--hub-mono);color:var(--hub-ink2);flex:none;min-width:4.6em}
.fu .w.over{color:var(--hub-bad);font-weight:700}
.fu-daily{display:inline-flex;align-items:center;gap:8px;min-height:44px;font-size:15px;font-weight:600;cursor:pointer}
.fu-daily input{width:22px;height:22px}
input[type=date]:disabled{opacity:.4}
.fu .x{margin-left:auto;flex:none;border:0;background:none;color:var(--hub-ink3);font-size:20px;min-width:40px;min-height:40px;padding:0}
.lab{display:grid;grid-template-columns:minmax(4.5em,auto) auto auto minmax(0,1fr);gap:2px 10px;align-items:baseline;font-variant-numeric:tabular-nums}
.lab .n{font-weight:600}
.lab .v{font:600 15px var(--hub-mono)}
.lab .v.H,.lab .v.L{color:var(--hub-bad)}
.lab .tr{font-size:13px;color:var(--hub-ink2);font-family:var(--hub-mono)}
.lab .rg{font-size:11.5px;color:var(--hub-ink3);text-align:right;line-height:1.3}
/* 每日清單 */
.ck{border:1px solid var(--hub-line);border-radius:10px;background:var(--hub-bg);overflow:hidden}
.ck+.ck{margin-top:6px}
.ck-h{display:flex;align-items:center;gap:8px;padding:8px 10px 8px 12px}
.ck-h .nm{flex:1;min-width:0;font-size:15px;font-weight:600}
.ck-h .bt{flex:none;width:46px;height:40px;border-radius:8px;border:1px solid var(--hub-line);background:var(--hub-surface);font-weight:700}
.ck-h .bt.on.k{background:var(--hub-ok);border-color:var(--hub-ok);color:var(--hub-surface)}
.ck-h .bt.on.w{background:var(--hub-bad);border-color:var(--hub-bad);color:var(--hub-surface)}
.ck-h .how{flex:none;border:0;background:none;color:var(--ac);font-size:13px;padding:4px}
.ck.k{border-color:color-mix(in srgb,var(--hub-ok) 40%,var(--hub-line))}
.ck.w{border-color:var(--hub-bad)}
.ck .note{padding:0 8px 8px}
.howto{padding:2px 12px 10px;font-size:13.5px;border-top:1px dashed var(--hub-line);background:var(--hub-surface)}
.howto h4{margin:8px 0 2px;font-size:12px;letter-spacing:.08em;color:var(--hub-ink2)}
.howto h4.red{color:var(--hub-bad)}
.howto ul{margin:0;padding-left:1.2em}
.howto .src{margin-top:8px;font-size:11.5px;color:var(--hub-ink3)}
.howto .wh{display:flex;gap:6px;align-items:center}
.draft{font-size:11.5px;color:var(--hub-warn);margin-top:6px}
/* 疊層 */
.view{display:none}
.view.on{display:block}
.top2{display:flex;align-items:center;gap:8px;padding:8px 0}
.top2 .ti{font-weight:800;font-size:17px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stepper{display:flex;gap:4px;margin:4px 0 2px}
.stepper i{flex:1;height:4px;border-radius:2px;background:var(--hub-line)}
.stepper i.on{background:var(--ac)}
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:12;background:var(--hub-surface);border-top:1px solid var(--hub-line);padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px))}
.bottom .wrap{display:flex;gap:8px;padding:0}
.bottom .btn{flex:1;min-height:44px;font-size:15px}
.out{font:13.5px/1.55 var(--hub-mono);min-height:320px}
.qr{display:flex;justify-content:center;padding:12px;background:#fff;border-radius:12px}
.qr img,.qr canvas{width:min(84vw,62vh,440px);height:auto;image-rendering:pixelated}
.drop{border:2px dashed var(--hub-line);border-radius:12px;padding:16px;text-align:center;color:var(--hub-ink2);font-size:14px}
.drop.on{border-color:var(--ac);background:var(--ac-soft)}
.imp{display:grid;grid-template-columns:auto minmax(4em,auto) 6em minmax(0,1fr);gap:6px 8px;align-items:center;font-size:14px}
.imp input[type=number]{min-height:34px;padding:3px 6px;font-family:var(--hub-mono)}
.imp .fl{font-weight:700;color:var(--hub-bad);font-family:var(--hub-mono)}
.imp .rg{font-size:12px;color:var(--hub-ink3)}
.ask{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px}
.ask-box{background:var(--hub-surface);color:var(--hub-ink);border:1px solid var(--hub-line);border-radius:14px;padding:16px;width:100%;max-width:420px;box-shadow:0 12px 40px rgba(0,0,0,.35)}
.ask-box p{margin:0 0 12px;font-size:15px;line-height:1.55;white-space:pre-line}
.ask-box input{margin-bottom:10px}
.btn.bad-fill{background:var(--hub-bad);border-color:var(--hub-bad);color:var(--hub-surface);font-weight:700}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--hub-ink);color:var(--hub-bg);padding:8px 16px;border-radius:999px;font-size:14px;max-width:calc(100% - 32px);box-shadow:0 8px 24px rgba(0,0,0,.25)}
details.snap summary{cursor:pointer;font-size:14px}
.muted{color:var(--hub-ink3);font-size:13.5px;line-height:1.55}
.lnk{border:0;background:none;color:var(--ac);padding:0;font-size:13px;text-decoration:underline}
@media (min-width:700px){.imp{grid-template-columns:auto minmax(6em,auto) 7em minmax(0,1fr)}}
</style>
</head>
<body>

<!-- 主畫面：床卡列表 -->
<section class="view on" id="v-list">
  <div class="bar"><div class="wrap">
    <span class="prog" id="prog"></span>
    <button class="btn pri" data-act="round">逐床跑</button>
    <button class="btn" data-act="hand">交班</button>
    <button class="btn" data-act="import">匯入</button>
    <button class="btn" data-act="settings" aria-label="設定與存檔">⋯</button>
  </div></div>
  <div class="wrap">
    <div class="save" id="save"></div>
    <div class="beds" id="beds"></div>
    <div class="row" style="margin-top:12px">
      <input type="text" id="nbBed" placeholder="床號" style="flex:0 0 5.5em" inputmode="text" autocomplete="off">
      <input type="text" id="nbCode" placeholder="代號，例：W" style="flex:1 1 6em" autocomplete="off">
      <button class="btn pri" data-act="addBed">＋ 新病人</button>
    </div>
    <p class="muted">只寫床號和代號（例如姓氏縮寫 W），資料只存在這支裝置的瀏覽器裡。</p>
  </div>
</section>

<!-- 單床／逐床跑 -->
<section class="view" id="v-bed">
  <div class="bar"><div class="wrap">
    <button class="btn ghost" data-act="back">← 返回</button>
    <span class="ti" id="bedTitle" style="font-weight:800;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"></span>
    <span class="prog" id="roundProg" style="margin:0"></span>
  </div><div class="wrap"><div class="stepper" id="stepper" hidden></div></div></div>
  <div class="wrap" id="bedBody"></div>
  <div class="bottom" id="roundBar" hidden><div class="wrap">
    <button class="btn" data-act="roundPrev">← 上一床</button>
    <button class="btn pri" data-act="roundNext">這床完成 → 下一床</button>
  </div></div>
</section>

<!-- 交班 -->
<section class="view" id="v-hand">
  <div class="bar"><div class="wrap">
    <button class="btn ghost" data-act="back">← 返回</button>
    <span style="font-weight:800;flex:1">產生交班／口頭報告</span>
  </div></div>
  <div class="wrap">
    <h2>格式</h2>
    <div class="seg" id="hFmt">
      <button data-fmt="isbar" aria-pressed="true">ISBAR 交班</button>
      <button data-fmt="oral" aria-pressed="false">口頭報告</button>
    </div>
    <h2>哪幾床 <button class="btn sm" data-act="hAll">全選</button></h2>
    <div class="seg" id="hBeds"></div>
    <h2>內容（可以先改再複製）</h2>
    <textarea class="out" id="hOut"></textarea>
    <div class="row" style="margin-top:8px"><button class="btn pri" data-act="hCopy" style="flex:1">複製</button></div>
    <p class="muted">R 只列還沒完成的待辦、等待中結果和交班重點。貼到哪裡由你決定，這裡不會自動送出。</p>
  </div>
</section>

<!-- 匯入站 -->
<section class="view" id="v-imp">
  <div class="bar"><div class="wrap">
    <button class="btn ghost" data-act="back">← 返回</button>
    <span style="font-weight:800;flex:1">匯入檢驗值</span>
  </div></div>
  <div class="wrap" id="impBody"></div>
</section>

<!-- 整床傳到手機（電腦端） -->
<section class="view" id="v-send">
  <div class="bar"><div class="wrap">
    <button class="btn ghost" data-act="back">← 返回</button>
    <span style="font-weight:800;flex:1">整床傳到手機</span>
  </div></div>
  <div class="wrap" id="sendBody"></div>
</section>

<!-- 設定與存檔 -->
<section class="view" id="v-set">
  <div class="bar"><div class="wrap">
    <button class="btn ghost" data-act="back">← 返回</button>
    <span style="font-weight:800;flex:1">設定與存檔</span>
  </div></div>
  <div class="wrap" id="setBody"></div>
</section>

<input type="file" id="fileImg" accept="image/*" hidden>
<input type="file" id="fileQR" accept="image/*" capture="environment" hidden>
<input type="file" id="fileJSON" accept="application/json,.json" hidden>

<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const today = () => ymd(new Date());
const parseD = s => { const [y, m, d] = String(s).split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = parseD(s); d.setDate(d.getDate() + n); return ymd(d); };
const diffDays = (a, b) => Math.round((parseD(b) - parseD(a)) / 864e5);
const md = s => s ? s.slice(5).replace('-', '/') : '';
const at8 = s => { const d = parseD(s); d.setHours(8, 0, 0, 0); return d.getTime(); };
const get = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const set = (k, v) => { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } };

const CK = Object.fromEntries(CHECKLIST.map(c => [c.id, c]));

// ── 檢驗項目：數值範圍（成人、常見單位；性別差異取較寬的範圍）。名稱比對用別名，大小寫不分。
const LABS = [
  ['WBC', ['WBC'], 4, 10, '×10³/μL'],
  ['Hb', ['Hb', 'HGB', 'Hgb', 'Hemoglobin'], 12, 17.5, 'g/dL'],
  ['Plt', ['Plt', 'PLT', 'Platelet'], 150, 400, '×10³/μL'],
  ['Na', ['Na', 'Sodium'], 135, 145, 'mEq/L'],
  ['K', ['K', 'Potassium'], 3.5, 5.0, 'mEq/L'],
  ['Cl', ['Cl', 'Chloride'], 98, 107, 'mEq/L'],
  ['HCO3', ['HCO3', 'HCO3-', 'Bicarbonate', 'TCO2'], 22, 26, 'mEq/L'],
  ['BUN', ['BUN', 'Urea'], 7, 20, 'mg/dL'],
  ['Cr', ['Cr', 'Creatinine', 'CRE', 'Crea'], 0.6, 1.3, 'mg/dL'],
  ['eGFR', ['eGFR', 'GFR'], 60, null, 'mL/min'],
  ['Ca', ['Ca', 'Calcium'], 8.6, 10.4, 'mg/dL'],
  ['Mg', ['Mg', 'Magnesium'], 1.7, 2.4, 'mg/dL'],
  ['P', ['P', 'IP', 'Phosphate', 'Phosphorus'], 2.5, 4.5, 'mg/dL'],
  ['Glu', ['Glucose', 'Glu', 'Sugar', 'GLU-AC', 'Glucose AC', 'Glucose PC', 'Glu AC', 'Sugar AC', 'BS'], 70, 180, 'mg/dL'],
  ['AST', ['AST', 'GOT'], null, 40, 'U/L'],
  ['ALT', ['ALT', 'GPT'], null, 40, 'U/L'],
  ['ALP', ['ALP', 'Alk-P', 'ALK-P'], 40, 130, 'U/L'],
  ['T-bil', ['T-bil', 'T-Bil', 'TBIL', 'T.Bil', 'Total bilirubin', 'Bil-T'], null, 1.2, 'mg/dL'],
  ['Alb', ['Albumin', 'Alb'], 3.5, 5.0, 'g/dL'],
  ['CRP', ['CRP', 'hs-CRP'], null, 0.5, 'mg/dL'],
  ['PCT', ['PCT', 'Procalcitonin'], null, 0.5, 'ng/mL'],
  ['Lactate', ['Lactate', 'Lactic acid', 'Lac'], null, 2.0, 'mmol/L'],
  ['INR', ['INR', 'PT-INR'], 0.8, 1.2, ''],
  ['pH', ['pH'], 7.35, 7.45, ''],
  ['PaCO2', ['PaCO2', 'pCO2', 'PCO2'], 35, 45, 'mmHg'],
  ['PaO2', ['PaO2', 'pO2', 'PO2'], 80, null, 'mmHg'],
  ['Lipase', ['Lipase'], null, 60, 'U/L'],
  ['BNP', ['BNP'], null, 100, 'pg/mL'],
  ['NT-proBNP', ['NT-proBNP', 'NT-pro BNP', 'NTproBNP'], null, 300, 'pg/mL'],
].map(([id, al, lo, hi, u]) => ({ id, al, lo, hi, u }));
const LAB = Object.fromEntries(LABS.map(l => [l.id, l]));
// 有填性別時，Hb、Cr 用性別範圍；沒填就用較寬的範圍。PaO2 只標偏低（給氧時偏高是正常的）
const SEXR = { Hb: { M: [13.5, 17.5], F: [12, 16] }, Cr: { M: [0.7, 1.3], F: [0.5, 1.1] } };
const lim = (id, sex) => { const l = LAB[id]; if (!l) return null; const r = SEXR[id] && SEXR[id][sex]; return r ? { ...l, lo: r[0], hi: r[1] } : l; };
const flag = (id, v, sex) => { const l = lim(id, sex); if (!l || v == null || isNaN(v)) return ''; if (l.lo != null && v < l.lo) return 'L'; if (l.hi != null && v > l.hi) return 'H'; return ''; };
const rangeTxt = (id, sex) => { const l = lim(id, sex); if (!l) return ''; return (l.lo != null && l.hi != null ? `${l.lo}–${l.hi}` : l.lo != null ? `≥ ${l.lo}` : `≤ ${l.hi}`) + (l.u ? ' ' + l.u : ''); };

// 從貼上或 OCR 的文字抓「項目 數值」。長的別名先比對（NT-proBNP 先於 BNP、eGFR 先於 GFR）；
// 名稱前後不能緊貼英文字母（避免 K 吃到 CK、P 吃到 PT），每個項目只取第一次出現的數值。
const reEsc = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
const ALIASES = LABS.flatMap(l => l.al.map(a => [a, l.id])).sort((a, b) => b[0].length - a[0].length);
function parseLabs(text) {
  const out = {}, taken = [];
  const src = String(text).replace(/[，：]/g, ' ').replace(/ /g, ' ');
  for (const [a, id] of ALIASES) {
    if (out[id] != null) continue;
    // 名稱和數值之間只允許空白、冒號、旗標符號或一個括號註記（例如 Na(B)），不能夾別的英文字，避免「K/uL Hb 12」被當成 K 12
    const re = new RegExp('(?<![A-Za-z])' + reEsc(a) + '(?![A-Za-z])[\\s:=*#<>]*(?:\\([^)\\n]{0,15}\\))?[\\s:=*#<>]*(?:[\\u4e00-\\u9fff]{1,6}[\\s:=*#<>]*)?(-?\\d+(?:\\.\\d+)?)', a.length <= 2 ? 'g' : 'gi');
    let m;
    while ((m = re.exec(src))) {
      const s = m.index, e = s + a.length;
      if (taken.some(([x, y]) => s < y && e > x)) continue;
      const v = parseFloat(m[1]);
      if (isNaN(v)) continue;
      out[id] = v; taken.push([s, e]); break;
    }
  }
  return out;
}

// ── 狀態
const KEY = 'rounds.v1', TODO = 'shiftboard.v1';
function blank() { return { beds: [], lastExport: 0, hidden: [], where: {}, v: 1 }; }
function load() {
  try { const s = JSON.parse(get(KEY) || 'null'); if (s && Array.isArray(s.beds)) return { ...blank(), ...s }; } catch (e) {}
  return blank();
}
let S = load();
let dirty = false;
function save(quiet) {
  S.mtime = Date.now();
  if (!set(KEY, JSON.stringify(S))) toast('存不進去：瀏覽器空間不足或被限制');
  dirty = true; snapSoon();
  if (!quiet) render();
}
const newBed = (bed, code) => ({ id: uid(), bed: String(bed || '').trim(), code: String(code || '').trim(), dx: '', hx: '', dnr: '', io: '', lines: [], abx: [], problems: [], pending: [], labs: {}, checks: {}, note: '', hand: '', learned: [], rounded: '', created: today() });
const bedById = id => S.beds.find(b => b.id === id);
const sortBeds = () => S.beds.sort((a, b) => String(a.bed).localeCompare(String(b.bed), 'zh-Hant', { numeric: true }));
const label = b => `${b.bed || '?'}床${b.code ? ' ' + b.code : ''}`;

// ── 待辦表（總站共用 shiftboard.v1）：p 1 立即／2 緊急／3 待辦／4 有空；due = 0 不計時
function todoAdd(bed, text, p = 3, due = 0, src = '查房板') {
  let st = null;
  try { st = JSON.parse(get(TODO) || 'null'); } catch (e) {}
  if (!st || !Array.isArray(st.items)) st = { items: [], done: [] };
  if (st.seeded) { st.items = st.items.filter(i => !i.ex); st.done = (st.done || []).filter(i => !i.ex); st.seeded = false; }
  const now = Date.now(), id = now.toString(36) + Math.random().toString(36).slice(2, 5);
  st.items.push({ id, bed: String(bed || ''), text, p, due, start: now, src });
  if (!set(TODO, JSON.stringify(st))) { toast('存不進待辦表'); return null; }
  if (bed) set('hub.lastBed', String(bed));
  try { parent !== window && parent.postMessage({ hub: 'todo-add', id, text, bed: String(bed || ''), n: 0 }, '*'); } catch (e) {}
  return id;
}
function todosOf(bed) {
  try { const st = JSON.parse(get(TODO) || 'null'); if (st && Array.isArray(st.items)) return st.items.filter(i => !i.ex && String(i.bed) === String(bed)); } catch (e) {}
  return [];
}
// 交班用：沒設時間的，或 24 小時內到期（含已過期）的
const todosSoon = bed => todosOf(bed).filter(i => !i.due || i.due <= Date.now() + 24 * 3600e3);

// problem 追蹤點：到期（含今天）的自動進待辦，一次就好
function whenToDue(w, since) {
  const m = /^D(\d+)$/.exec(w); if (m) return addDays(since, +m[1] - 1);
  const h = /^\+(\d+)h$/.exec(w); if (h) return addDays(since, Math.round(+h[1] / 24));
  if (w === '每日') return 'daily';
  return '';
}
function sweep() {
  const t = today(); let ch = false;
  for (const b of S.beds) for (const p of b.problems) {
    if (p.status === 'resolved') continue;
    for (const f of p.fus) {
      if (f.due === 'daily') {
        // 每日：今天還沒確認、今天還沒送 → 送一項（不計時，免得一打開就「已到時」響鈴）；昨天沒做完的那項直接換掉
        if (fuIsDone(f) || f.pushedOn === t) continue;
        if (f.todoId) { const st = readTodo(), n = st.items.length; st.items = st.items.filter(i => i.id !== f.todoId); if (st.items.length !== n) set(TODO, JSON.stringify(st)); }
        const did = todoAdd(b.bed, `${p.name}：${f.what}（每日）`, 3, 0);
        if (did) { f.todoId = did; f.pushedOn = t; ch = true; }
        continue;
      }

// ── 追蹤點 ↔ 待辦 雙向同步
// 每個送進待辦表的追蹤點記住那項待辦的 id（舊資料沒有 id 的，用床號＋文字找回來）。
// 查房板勾選 → 待辦移到「已完成」；取消勾選 → 移回待辦。待辦表按完成 → 追蹤點自動打勾。
function readTodo() {
  let st = null;
  try { st = JSON.parse(get(TODO) || 'null'); } catch (e) {}
  if (!st || !Array.isArray(st.items)) st = { items: [], done: [] };
  st.done = st.done || [];
  return st;
}
function linkTodo(st, b, p, f) {
  if (isDaily(f)) return f.pushedOn === today() ? (f.todoId || '') : '';
  if (f.todoId) return f.todoId;
  if (!f.pushed) return '';
  const text = `${p.name}：${f.what}`;
  const hit = [...st.items, ...st.done].find(i => String(i.bed) === String(b.bed) && i.text === text);
  if (hit) f.todoId = hit.id;
  return f.todoId || '';
}
// 查房板這邊改了勾選 → 改待辦表；回傳有沒有動到待辦
function todoFollowFu(b, p, f) {
  const st = readTodo(), id = linkTodo(st, b, p, f);
  if (!id) return false;
  if (fuIsDone(f)) {
    const it = st.items.find(i => i.id === id); if (!it) return false;
    st.items = st.items.filter(i => i !== it); st.done.push({ ...it, doneAt: Date.now() });
  } else {
    const d = st.done.find(i => i.id === id); if (!d) return false;
    st.done = st.done.filter(i => i !== d); delete d.doneAt; st.items.push(d);
  }
  return set(TODO, JSON.stringify(st));
}
// 待辦表那邊按了完成 → 追蹤點打勾
function syncFromTodo() {
  const st = readTodo(), doneIds = new Set(st.done.map(i => i.id)); let ch = false;
  for (const b of S.beds) for (const p of b.problems) for (const f of p.fus) {
    if (fuIsDone(f)) continue;
    const id = linkTodo(st, b, p, f);
    if (id && doneIds.has(id)) { if (isDaily(f)) f.doneOn = today(); else f.done = true; ch = true; }
  }
  if (ch) { save(true); render(); }
}

// ── 快照（IndexedDB）：變更後最多每 10 分鐘一份，留 3 天、最多 50 份
const SNAP_EVERY = 10 * 60e3;
let lastSnap = 0, snapT = 0;
function idb() {
  return new Promise((res, rej) => {
    try {
      const r = indexedDB.open('rounds-snap', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('s', { keyPath: 'ts' });
      r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
    } catch (e) { rej(e); }
  });
}
async function snap() {
  if (!dirty) return;
  try {
    const db = await idb(), now = Date.now();
    await new Promise((res, rej) => { const tx = db.transaction('s', 'readwrite'); tx.objectStore('s').put({ ts: now, n: S.beds.length, data: JSON.stringify(S) }); tx.oncomplete = res; tx.onerror = () => rej(tx.error); });
    const all = await snaps(db);
    const drop = all.filter((s, i) => s.ts < now - 3 * 864e5 || i >= 50);
    if (drop.length) await new Promise(res => { const tx = db.transaction('s', 'readwrite'); drop.forEach(s => tx.objectStore('s').delete(s.ts)); tx.oncomplete = res; tx.onerror = res; });
    lastSnap = now; dirty = false;
  } catch (e) {}
}
function snaps(db) {
  return new Promise(res => { const tx = db.transaction('s', 'readonly'); const r = tx.objectStore('s').getAll(); r.onsuccess = () => res((r.result || []).sort((a, b) => b.ts - a.ts)); r.onerror = () => res([]); });
}
function snapSoon() {
  const wait = Math.max(0, lastSnap + SNAP_EVERY - Date.now());
  if (snapT) return;
  snapT = setTimeout(() => { snapT = 0; snap(); }, Math.max(wait, 3000));
}
// 重新載入頁面後接續上次快照的時間，避免每開一次就多一份
idb().then(snaps).then(l => { if (l[0]) lastSnap = Math.max(lastSnap, l[0].ts); }).catch(() => {});
setInterval(() => { if (dirty) snap(); }, SNAP_EVERY);
addEventListener('pagehide', () => { if (dirty) snap(); });

function stLine(p) { return `${p.name}（${STN[p.status] || '—'}）`; }
function isbar(b) {
  const t = today(), act = b.problems.filter(p => p.status !== 'resolved');
  const abn = latestAbn(b).map(a => `${a.id} ${a.v}${a.f === 'H' ? '↑' : '↓'}${a.prev ? `（前 ${a.prev.v}）` : ''}`);
  const abx = b.abx.map(a => `${a.name} D${diffDays(a.start, t) + 1}${a.days ? '/' + a.days : ''}`);
  const lines = b.lines.map(l => `${l.t} D${diffDays(l.since, t) + 1}`);
  const warns = Object.entries(b.checks[t] || {}).filter(([, v]) => v.s === 'w').map(([k, v]) => `${(CK[k] || {}).name ? CK[k].name.replace(/（.*/, '') : k}${v.note ? '：' + v.note : ''}`);
  const td = todosSoon(b.bed).map(i => i.text);
  const pend = b.pending.filter(p => !p.done).map(p => `${p.what}${p.expect ? `（${md(p.expect)}）` : ''}`);
  const L = [];
  L.push(`【${label(b)}】${b.dnr ? ' ' + b.dnr : ''}`);
  L.push(`I：${label(b)}${b.dx ? '，' + b.dx : ''}`);
  L.push(`S：${act.length ? act.map(stLine).join('、') : '—'}`);
  const B = [b.hx, abx.length && '抗生素 ' + abx.join('、'), lines.length && '管路 ' + lines.join('、'), b.io && 'I/O ' + b.io].filter(Boolean);
  L.push(`B：${B.join('；') || '—'}`);
  const A = [abn.length && '異常 ' + abn.join('、'), ...act.filter(p => p.plan).map(p => `${p.name}：${p.plan}`), warns.length && '清單注意 ' + warns.join('、')].filter(Boolean);
  L.push(`A：${A.join('；') || '—'}`);
  const R = [td.length && '待辦 ' + td.join('、'), pend.length && '等結果 ' + pend.join('、'), b.hand].filter(Boolean);
  L.push(`R：${R.join('；') || '—'}`);
  return L.join('\n');
}
function oral(b) {
  const t = today(), act = b.problems.filter(p => p.status !== 'resolved');
  const L = [`${b.bed} 床${b.code ? ' ' + b.code : ''}，${b.dx || '（Dx）'}${b.hx ? `，病史有 ${b.hx}` : ''}。`];
  act.forEach((p, i) => {
    // 口頭報告只講最近的兩個追蹤點
    const nx = p.fus.filter(f => !f.done && f.due && f.due !== 'daily').sort((x, y) => x.due < y.due ? -1 : 1).slice(0, 2).map(f => `${f.what}（${md(f.due)}）`);
    L.push(`問題${i + 1}，${p.name}，目前${STN[p.status] || '—'}。${p.plan ? p.plan + '。' : ''}${nx.length ? '下一步：' + nx.join('、') + '。' : ''}`);
  });
  const abn = latestAbn(b);
  if (abn.length) L.push(`今天的異常值：${abn.map(a => `${a.id} ${a.v}${a.prev ? `，前一次 ${a.prev.v}` : ''}`).join('；')}。`);
  if (b.abx.length) L.push(`抗生素：${b.abx.map(a => `${a.name} 第 ${diffDays(a.start, t) + 1} 天${a.days ? `，預計 ${a.days} 天` : ''}`).join('；')}。`);
  if (b.lines.length) L.push(`管路：${b.lines.map(l => `${l.t} 第 ${diffDays(l.since, t) + 1} 天`).join('、')}。`);
  const pend = b.pending.filter(p => !p.done);

}

async function exportJSON() {

  // artifact 會擋網頁發起的下載，所以：手機用系統分享（→ 儲存到檔案）；不行就複製到剪貼簿請使用者貼到備忘錄。
  // 只有真的成功才更新「上次存檔」。
  const mark = how => { S.lastExport = Date.now(); save(true); render(); toast(how); };
  try {
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: name }); mark('已存檔：' + name); return; }
  } catch (e) { if (e && e.name === 'AbortError') return; }
  try { await navigator.clipboard.writeText(txt); mark('存檔內容已複製：請貼到備忘錄或記事本存起來'); return; } catch (e) {}
  const ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta); ta.select();
  let ok = false; try { ok = document.execCommand('copy'); } catch (e) {} ta.remove();
  if (ok) mark('存檔內容已複製：請貼到備忘錄或記事本存起來'); else toast('存檔失敗：這個瀏覽器不能分享也不能複製');
}
// artifact 的 iframe 沒有 allow-modals：confirm()／prompt() 根本不會跳出來，而是直接當成「取消」。
// 所以所有確認都用頁面內的視窗。type：要使用者打出這幾個字才能按確定（例如「清空」）。
function ask(msg, { ok = '確定', danger = false, type = '' } = {}) {
  return new Promise(res => {
    document.querySelector('.ask')?.remove();
    const d = document.createElement('div'); d.className = 'ask';
    d.innerHTML = `<div class="ask-box" role="alertdialog" aria-modal="true"><p>${esc(msg)}</p>${type ? `<input type="text" placeholder="輸入「${esc(type)}」" autocomplete="off">` : ''}<div class="row"><button class="btn" data-a="0" style="flex:1">取消</button><button class="btn ${danger ? 'bad-fill' : 'pri'}" data-a="1" style="flex:1">${esc(ok)}</button></div></div>`;
    const inp = d.querySelector('input');
    const done = v => { d.remove(); res(v); };
    const tryOk = () => { if (type && inp.value.trim() !== type) { inp.focus(); toast(`請輸入「${type}」`); return; } done(true); };
    d.addEventListener('click', e => { const a = e.target.closest('[data-a]'); if (a) a.dataset.a === '1' ? tryOk() : done(false); else if (e.target === d) done(false); });
    d.addEventListener('keydown', e => { e.stopPropagation(); if (e.key === 'Escape') done(false); if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); tryOk(); } });
    document.body.appendChild(d); (inp || d.querySelector('[data-a="1"]')).focus();
  });
}

    case 'sendDel': {
      const sb = bedById(send.bedId); if (!sb) return;
      ask(`確定手機已經收到了？\n會從這台電腦刪除 ${label(sb)} 和這床的待辦。`, { ok: '從這台電腦刪除', danger: true }).then(y => { if (!y) return;
      try {
        const st = JSON.parse(get(TODO) || 'null');
        if (st && Array.isArray(st.items)) { st.items = st.items.filter(i => String(i.bed) !== String(sb.bed)); st.done = (st.done || []).filter(i => String(i.bed) !== String(sb.bed)); set(TODO, JSON.stringify(st)); }
      } catch (er) {}
      S.beds = S.beds.filter(x => x !== sb); send = null; curBed = null; save(true); toast('已從這台電腦刪除'); go('list');
      }); return;
    }
    // 設定
    case 'importJSON': $('fileJSON').value = ''; $('fileJSON').click(); return;
    case 'restorePaste': { const v = ($('restoreTxt') || {}).value || ''; restoreFrom(v).then(ok => { if (ok) go('list'); }, () => toast('這不是查房板的存檔內容')); return; }
    case 'copyLearn': {
      const all = S.beds.flatMap(x => x.learned.map(l => ({ ...l, dx: x.dx }))).sort((x, y) => x.d < y.d ? -1 : 1);
      copy(all.map(l => `${l.d}${l.dx ? `（${l.dx}）` : ''} ${l.t}`).join('\n') || '（還沒有）'); return;
    }
    case 'restore': (async () => {
      try { const db = await idb(), list = await snaps(db), s = list.find(x => String(x.ts) === el.dataset.ts); if (s && await restoreFrom(s.data)) go('list'); } catch (er) { toast('還原失敗'); }
    })(); return;
    case 'wipe': {
      ask('刪除這支裝置上所有病人資料和快照？無法復原。\n確定的話，輸入「清空」。', { ok: '全部清空', danger: true, type: '清空' }).then(y => {
        if (!y) return;
        S = { ...blank(), hidden: S.hidden, where: S.where }; save(true);
        try { indexedDB.deleteDatabase('rounds-snap'); } catch (er) {}
        toast('已全部清空'); go('list');
      }); return;
    }
  }
});
document.querySelectorAll('#hFmt button').forEach(x => x.addEventListener('click', () => { hFmt = x.dataset.fmt; render(); }));

// 文字欄位：打字時存（不重畫，避免游標跳掉）
document.addEventListener('input', e => {
  const el = e.target, b = bedNow();
  if (el.dataset.f && b) { b[el.dataset.f] = el.value; if (el.dataset.f === 'bed' || el.dataset.f === 'code' || el.dataset.f === 'dx') $('bedTitle').textContent = label(b) + (b.dx ? '・' + b.dx : ''); save(true); return; }
  if (el.dataset.pf) { const p = prob(el.dataset.p); if (p) { p[el.dataset.pf] = el.value; save(true); } return; }
  if (el.dataset.ck && b) { const d = b.checks[today()]; if (d && d[el.dataset.ck]) { d[el.dataset.ck].note = el.value; save(true); } return; }
  if (el.dataset.where) { S.where[el.dataset.where] = el.value; save(true); return; }
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.hide) { const id = el.dataset.hide; S.hidden = S.hidden.filter(x => x !== id); if (!el.checked) S.hidden.push(id); save(true); return; }
  if (el.dataset.iv || el.dataset.iok) { impSync(); render(); }
  if (el.dataset.fudaily) { const d = document.querySelector(`[data-fudate="${el.dataset.fudaily}"]`); if (d) d.disabled = el.checked; }
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter' || e.isComposing) return;
  const id = e.target.id, map = { ordIn: 'ordAdd', nbCode: 'addBed', nbBed: 'addBed', lrIn: 'learnAdd', pdWhat: 'pendAdd', lnName: 'lineAdd', pFree: 'pAddFree' };
  if (map[id]) { e.preventDefault(); document.querySelector(`[data-act="${map[id]}"]`)?.click(); }
  if (e.target.dataset.fuin) { e.preventDefault(); document.querySelector(`[data-act="fuAdd"][data-p="${e.target.dataset.fuin}"]`)?.click(); }
});
$('fileImg').addEventListener('change', e => { const f = e.target.files[0]; if (f) ocr(f); });
$('fileQR').addEventListener('change', e => { const f = e.target.files[0]; if (f) scanQR(f); });
$('fileJSON').addEventListener('change', e => {
  const f = e.target.files[0]; if (!f) return;
  f.text().then(t => restoreFrom(t)).then(ok => { if (ok) go('list'); }, () => toast('這不是查房板的存檔'));
});
// 其他分頁（例如待辦表）改了資料 → 重畫
addEventListener('storage', e => { if (e.key === KEY) { S = load(); render(); } else if (e.key === TODO) { syncFromTodo(); if (view === 'bed') render(); } });
document.addEventListener('visibilitychange', () => { if (!document.hidden) { sweep(); if (view === 'list') render(); } });

sweep();
render();
// 改床號：把待辦表裡這床的待辦一起改過去（待辦表用床號對應病人）
document.addEventListener('focusin', e => { const el = e.target, b = bedNow(); if (el.dataset && el.dataset.f === 'bed' && b) el.dataset.old = String(b.bed); });
document.addEventListener('change', e => {
  const el = e.target, b = bedNow();
  if (!el.dataset || !b) return;
  if (el.dataset.f === 'sex') { render(); return; }
  if (el.dataset.f === 'bed') {
    const old = el.dataset.old, nw = String(b.bed).trim();
    if (old == null || old === nw) return;
    try {
      const st = JSON.parse(get(TODO) || 'null');
      if (st && Array.isArray(st.items)) {
        let n = 0; st.items.forEach(i => { if (String(i.bed) === old) { i.bed = nw; n++; } });
        if (n && set(TODO, JSON.stringify(st))) toast(`${n} 項待辦已改到 ${nw} 床`);
      }
    } catch (er) {}
    el.dataset.old = nw;
  }
});
// 請瀏覽器盡量不要自動回收這裡的資料（iOS 不一定答應，所以仍要手動存檔）
let persisted = null;
try { navigator.storage && navigator.storage.persist && navigator.storage.persist().then(ok => { persisted = ok; }, () => {}); } catch (e) {}
setInterval(() => { if (view === 'list') renderSave(); }, 60e3);
})();
</script>
</body>
</html>
