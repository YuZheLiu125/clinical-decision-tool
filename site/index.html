/* 臨床輔助決策工具 · 共用設計基底 v2（正本：shared/hub-common.css，由 scripts/sync_shared.py 寫進每個 HTML，不要直接改 HTML 裡這一段）
   原則：顏色只用來表達臨床意義（紅＝危急、琥珀＝注意、綠＝正常／完成）；介面本身只有一個品牌色（墨藍）和一組帶藍調的中性灰。

:root{
  --hub-bg:#F2F4F6; --hub-surface:#FFFFFF; --hub-surface2:#E8ECF0; --hub-ink:#111B24; --hub-ink2:#44515E; --hub-ink3:#687685; --hub-line:#D5DBE1;

  --hub-code:#B3261E; --hub-code-soft:#FBE6E4;
  --hub-p1:#B3322B; --hub-p2:#B26A12; --hub-p3:#4F6B8A; --hub-p4:#7F8791;
  --hub-sans:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Noto Sans CJK TC","Microsoft JhengHei",Roboto,system-ui,sans-serif;

  --hub-ease:cubic-bezier(.2,.8,.2,1); --hub-dur:.16s; --hub-r:8px; --hub-r-lg:12px;
  /* 舊的各工具辨識色：全部指到同一個品牌色（工具各自的對應層還在用這些名字） */
  --hub-pilot:var(--hub-brand); --hub-pilot-soft:var(--hub-brand-soft); --hub-consult:var(--hub-brand); --hub-consult-soft:var(--hub-brand-soft);
  --hub-meds:var(--hub-brand); --hub-meds-soft:var(--hub-brand-soft); --hub-labs:var(--hub-brand); --hub-labs-soft:var(--hub-brand-soft);
  --hub-todo:var(--hub-brand); --hub-todo-soft:var(--hub-brand-soft);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --hub-bg:#0D1218; --hub-surface:#141B23; --hub-surface2:#1C2530; --hub-ink:#E2E8EE; --hub-ink2:#A1ADBA; --hub-ink3:#7B8896; --hub-line:#28323E;
  --hub-brand:#8FB8E3; --hub-brand-soft:#17293D; --hub-on-brand:#0B1622;
  --hub-bad:#FF7A70; --hub-bad-soft:#3A1B19; --hub-warn:#F0B04A; --hub-warn-soft:#352812; --hub-ok:#6CCF8E; --hub-ok-soft:#15301F;
  --hub-code:#FF7A70; --hub-code-soft:#3A1B19;

:root[data-theme="dark"]{
  --hub-bg:#0D1218; --hub-surface:#141B23; --hub-surface2:#1C2530; --hub-ink:#E2E8EE; --hub-ink2:#A1ADBA; --hub-ink3:#7B8896; --hub-line:#28323E;
  --hub-brand:#8FB8E3; --hub-brand-soft:#17293D; --hub-on-brand:#0B1622;

  --hub-code:#FF7A70; --hub-code-soft:#3A1B19;

/* 各工具自己的強調色、強調色上的字，一律跟品牌色走（查房板的 --ac 也是） */
html:root:root{--ac:var(--hub-brand);--ac-soft:var(--hub-brand-soft);--accent-ink:var(--hub-on-brand)}
/* Android：內嵌在別的網頁裡時，往下拉不要帶動外層頁面（下拉重新整理）；左右方向不設，手機上工具之間才能左右滑 */
html{overscroll-behavior-y:contain}
:focus-visible{outline:2px solid var(--hub-brand);outline-offset:2px}
@media (pointer:fine){*{scrollbar-width:thin;scrollbar-color:var(--hub-line) transparent}}

/* 觸控：點擊不延遲、不閃灰框、iPhone 不自動放大字 */
html{-webkit-tap-highlight-color:transparent;touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{-webkit-font-smoothing:antialiased;text-rendering:optimizeSpeed}
::selection{background:color-mix(in srgb,var(--hub-accent,var(--hub-ink)) 22%,transparent)}
/* iPhone 點進字小於 16px 的輸入框會自動放大、而且不會縮回來：觸控裝置上所有輸入框一律 ≥16px */
@media (pointer:coarse){input:not([type="checkbox"]):not([type="radio"]):not([type="range"]),textarea,select{font-size:max(16px,1em)!important}}
/* 共用動畫：按下去微縮、顏色淡入淡出（低權重，工具自己的設定優先） */
:where(button,.btn,.chip,.card,summary,[role="tab"],a){transition:background-color var(--hub-dur) var(--hub-ease),border-color var(--hub-dur) var(--hub-ease),color var(--hub-dur) var(--hub-ease),box-shadow var(--hub-dur) var(--hub-ease),opacity var(--hub-dur) var(--hub-ease),transform .12s var(--hub-ease)}
:where(button,.btn,.chip,[role="tab"]):active:not(:disabled){transform:scale(.97)}
@keyframes hub-in{from{opacity:0;transform:translateY(6px)}}
@keyframes hub-pop{0%{transform:scale(1)}40%{transform:scale(1.18)}100%{transform:scale(1)}}
.hub-toast{position:fixed;left:16px;right:16px;margin:0 auto;width:fit-content;bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:60;max-width:min(520px,calc(100% - 32px));box-sizing:border-box;display:flex;gap:10px;align-items:center;background:var(--hub-ink);color:var(--hub-bg);font:500 14px/1.4 var(--hub-sans);padding:10px 14px;border-radius:var(--hub-r);box-shadow:0 6px 20px rgba(0,0,0,.22);animation:hub-in .22s var(--hub-ease)}
/* 待辦設定按鈕：跟待辦表的快速新增同一套（立即／緊急／待辦／有空，點緊急或待辦展開倒數） */
.hp{display:flex;flex-direction:column;gap:8px;min-width:0}

.hp-pr{--pc:var(--hub-p3);display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:0;min-height:46px;padding:4px;border:1px solid color-mix(in srgb,var(--pc) 45%,var(--hub-line));border-radius:var(--hub-r);background:transparent;color:var(--pc);font:500 15px/1.2 var(--hub-sans);cursor:pointer}
.hp-pr[data-p="1"]{--pc:var(--hub-p1)}.hp-pr[data-p="2"]{--pc:var(--hub-p2)}.hp-pr[data-p="4"]{--pc:var(--hub-p4)}
.hp-pr small{font-size:12px;font-variant-numeric:tabular-nums}
.hp-pr small:empty{display:none}
.hp-pr[aria-pressed="true"]{background:var(--pc);border-color:var(--pc);color:var(--hub-surface)}
.hp-tm{display:flex;gap:6px;overflow-x:auto;overscroll-behavior-x:contain;scrollbar-width:none;padding:2px}
.hp-tm::-webkit-scrollbar{display:none}
.hp-c{flex:none;min-height:40px;border:1px solid var(--hub-line);background:transparent;border-radius:var(--hub-r);padding:6px 14px;font:15px/1 var(--hub-sans);color:var(--hub-ink);white-space:nowrap;cursor:pointer;font-variant-numeric:tabular-nums}
.hp-c[aria-pressed="true"]{background:var(--hub-ink);border-color:var(--hub-ink);color:var(--hub-bg)}
.hp input{flex:none;font:16px var(--hub-sans);min-height:40px;padding:5px 10px;border-radius:var(--hub-r);border:1px solid var(--hub-line);background:var(--hub-bg);color:var(--hub-ink);width:80px;text-align:center}
.hp-dt{display:flex;gap:6px}
.hp-dt input[type="date"]{flex:1 1 9.5em;width:auto;max-width:12em}
.hp-dt input[type="time"]{width:7em}
/* 右滑加入待辦 */
[data-swipe]{position:relative;touch-action:pan-y}
[data-swipe].sw-drag{transition:none!important}
[data-swipe].sw-back{transition:transform .22s var(--hub-ease)!important}
[data-swipe]::before{content:"＋ 待辦";position:absolute;top:0;bottom:0;right:100%;width:var(--sw,0px);display:flex;align-items:center;justify-content:flex-end;padding-right:12px;box-sizing:border-box;background:var(--hub-todo);color:var(--hub-surface);font:700 14px/1 var(--hub-sans);white-space:nowrap;overflow:hidden;opacity:var(--swo,0);pointer-events:none}

</style>
<style>
/* 總站外殼 v2。版面概念：
   電腦＝左側工具欄（依情境分組，可收成圖示）｜中間目前的工具｜右側常駐待辦（可收起）
   手機＝工具佔滿畫面（左右滑切換）｜下方導覽（ACLS 固定＋釘選 3 個＋待辦＋全部工具）
   工具清單由下方 script 的 TOOLS 產生：加一個工具＝加一行，版面不會變擠（側欄可捲動、手機收進「全部工具」）。 */
*{box-sizing:border-box}
html,body{height:100%}
html{overscroll-behavior:none}
body{background:var(--hub-bg);color:var(--hub-ink);font-family:var(--hub-sans);font-size:15px;line-height:1.45;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}

.app{display:flex;height:100%;min-width:0}

/* ── 左側工具欄（電腦） ── */
.rail{flex:none;width:216px;display:flex;flex-direction:column;min-height:0;background:var(--hub-surface);border-right:1px solid var(--hub-line);padding-left:env(safe-area-inset-left,0px)}
.rail-h{flex:none;display:flex;align-items:center;gap:8px;padding:14px 10px 10px 16px}

.icon-btn:hover{background:var(--hub-surface2);color:var(--hub-ink)}
.rail-list{flex:1;min-height:0;overflow-y:auto;padding:2px 8px 8px}

.nav:hover{background:var(--hub-surface2);color:var(--hub-ink)}
.nav .tx{flex:1;min-width:0;display:flex;flex-direction:column}

.nav[aria-selected="true"]{background:var(--hub-brand-soft);color:var(--hub-brand)}
.nav[aria-selected="true"] .nm{font-weight:700;color:var(--hub-brand)}

.badge.hot{background:var(--hub-code);color:var(--hub-surface)}
.rail-f{flex:none;display:flex;flex-direction:column;gap:6px;padding:10px 16px 12px;border-top:1px solid var(--hub-line);font-size:12px;color:var(--hub-ink3)}

.clock{font-family:var(--hub-mono);font-variant-numeric:tabular-nums;color:var(--hub-ink2);white-space:nowrap}

/* 收成圖示 */
.app.rail-min .rail{width:60px}
.app.rail-min .rail-h{padding:14px 0 10px;justify-content:center}
.app.rail-min .rail-h b,.app.rail-min .nav .tx,.app.rail-min .grp,.app.rail-min .rail-f .sig,.app.rail-min .rail-f .clock,.app.rail-min .sync span{display:none}

/* ── 工作區 ── */
.work{flex:1;min-width:0;min-height:0;display:flex;position:relative}

}

  #pane-todo.open{transform:none;visibility:visible;transition:transform .22s var(--hub-ease);box-shadow:8px 0 30px rgba(0,0,0,.28)}

  .mnav{flex:none;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);background:var(--hub-surface);border-top:1px solid var(--hub-line);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
  .mnav button{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-width:0;min-height:54px;padding:6px 2px 5px;border:0;background:transparent;color:var(--hub-ink3);font-size:11px;line-height:1.2}

  .sheet-row{display:flex;align-items:center;gap:4px}
  .sheet-row .nav{flex:1;min-width:0;min-height:52px}
  .sheet-row .nav .nm{font-size:15px}
  .sheet-row .nav .hint{font-size:12.5px}
  .pin{flex:none;display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border:0;border-radius:var(--hub-r);background:transparent;color:var(--hub-ink3)}
  .pin[aria-pressed="true"]{color:var(--hub-brand)}
  .pin[aria-pressed="true"] svg{fill:currentColor}
  .sheet-f{flex:none;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 16px;border-top:1px solid var(--hub-line);font-size:12px;color:var(--hub-ink3)}
  .sheet-note{margin:6px 8px 2px;font-size:12px;color:var(--hub-ink3)}
  .hub-toast{bottom:calc(70px + env(safe-area-inset-bottom,0px))}
}
.hub-toast .undo{background:transparent;color:var(--hub-bg);box-shadow:inset 0 0 0 1px currentColor}
.hub-toast button{white-space:nowrap;flex:none;border:0;background:var(--hub-bg);color:var(--hub-ink);border-radius:6px;padding:4px 12px;font-weight:700}
@media (prefers-reduced-motion:reduce){#pane-todo,#pane-todo.open,.scrim,.sheet,.sheet.open{transition:none}}
</style>

<div class="app" id="app">
  <nav class="rail" id="rail" aria-label="工具">
    <div class="rail-h"><b title="by 劉宇哲">臨床輔助決策工具</b><button class="icon-btn" id="railToggle" type="button" aria-label="收合工具欄" title="收合／展開工具欄"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v14H4zM9 5v14"/></svg></button></div>
    <div class="rail-list" id="railList" role="tablist" aria-orientation="vertical"></div>
    <div class="rail-f">
      <div class="row"><span class="clock" id="clock">--:--</span><span class="sync" id="sync" data-s="wait" title="雲端同步：連線中">連線中</span></div>
      <div class="row"><span class="sig" id="sig">by 劉宇哲</span></div>
    </div>
  </nav>
  <main class="work" id="work"></main>
  <aside class="side" id="side">
    <section class="pane" id="pane-todo" aria-label="待辦表">
      <div class="pane-h"><b>待辦</b><span class="counts" id="status" aria-live="polite"></span><button class="icon-btn" type="button" id="todoClose" aria-label="收起待辦" title="收起待辦"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
      <iframe id="f-todo" data-src="tools/todo.html" title="待辦表"></iframe>
    </section>
  </aside>
  <nav class="mnav" id="mnav" aria-label="工具"></nav>
</div>
<div class="scrim" id="scrim"></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="全部工具">
  <div class="sheet-h"><b>全部工具</b><button class="icon-btn" type="button" id="sheetClose" aria-label="關閉"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <input class="sheet-q" id="sheetQ" type="search" placeholder="找工具" aria-label="找工具" hidden>
  <div class="sheet-list" id="sheetList"></div>
  <div class="sheet-f"><span class="sync" id="sSync" data-s="wait">連線中</span><span class="sig" id="sSig">by 劉宇哲</span></div>
</section>

<script>
(() => {
  /* ═══ 工具清單：要加工具，在這裡加一行就好 ═══
     id    分頁代號（網址 #id 可直接打開）
     src   工具檔案；沒有 src 而有 pane＋view 的，是「某個工具裡的一個畫面」（例如接新病人在主訴處理裡）
     name  顯示名稱（手機底部只放得下 4 個字）　hint  什麼情況用　group  分組　icon  ICONS 裡的名字
     urgent 急救類：圖示用紅色，手機上方固定有捷徑 */
  const TOOLS = [
    { id: 'acls',    src: 'tools/acls.html',    name: 'ACLS',     full: 'ACLS 輔助工具', hint: '急救、心律不整',       group: '急性處置', icon: 'bolt', urgent: 1 },
    { id: 'pilot',   src: 'tools/copilot.html', name: '主訴處理', full: '主訴處理',     hint: '被 call、病人不穩',     group: '急性處置', icon: 'bell' },
    { id: 'admit',   pane: 'pilot', view: 'admit', name: '接新病人', full: '接新病人',  hint: '先查病歷、床邊問診、PI', group: '病人',     icon: 'clip' },
    { id: 'rounds',  src: 'tools/rounds.html',  name: '查房板',   full: '查房板',       hint: '查房、追病人、交班',     group: '病人',     icon: 'rows' },
    { id: 'consult', src: 'tools/consult.html', name: '會診稿',   full: '會診電話稿',   hint: '要打電話找人',           group: '溝通',     icon: 'phone' },
    { id: 'meds',    src: 'tools/meds.html',    name: '用藥速查', full: '值班用藥速查', hint: '病人穩定、要開藥',       group: '查詢',     icon: 'pill' },
    { id: 'labs',    src: 'tools/labs.html',    name: '正常值',   full: '檢驗正常值',   hint: '報告回來、判讀數字',     group: '查詢',     icon: 'flask' },
  ];
  const DEFAULT_PINS = ['pilot', 'admit', 'rounds']   /* 手機底部預設釘選（使用者可在「全部工具」改） */, MAX_PINS = 3;
  const ICONS = {
    bolt: 'M13 2 4 14h7l-1 8 9-12h-7z',
    bell: 'M6 9a6 6 0 0 1 12 0c0 6 2.5 7.5 2.5 7.5h-17S6 15 6 9M10 20a2 2 0 0 0 4 0',
    clip: 'M9 4h6v3H9zM9 5.5H6V21h12V5.5h-3M12 11v6M9 14h6',
    rows: 'M4 5h16v5.5H4zM4 13.5h16V19H4zM7.5 7.75h3M7.5 16.25h3',
    phone: 'M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2',
    pill: 'M10.5 20.5a5 5 0 0 1-7-7l7-7a5 5 0 0 1 7 7zM7 10l7 7',
    flask: 'M9 3h6M10 3v6l-5 9a2 2 0 0 0 2 3h10a2 2 0 0 0 2-3l-5-9V3M7.5 15h9',
    todo: 'M10 6h10M10 12h10M10 18h10M3.5 6 5 7.5l2.5-3M3.5 12 5 13.5l2.5-3M3.5 18 5 19.5l2.5-3',
    grid: 'M5 5h5v5H5zM14 5h5v5h-5zM5 14h5v5H5zM14 14h5v5h-5z',
    pin: 'M9 4h6l-1 6 3 3H7l3-3zM12 13v7',
  };
  const ic = n => `<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="${ICONS[n] || ICONS.grid}"/></svg>`;
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  const $ = id => document.getElementById(id);
  const APP_V = (document.querySelector('meta[name="app-version"]') || {}).content || '';
  try { console.log('%c臨床輔助決策工具 v' + APP_V + ' · made by 劉宇哲', 'font-weight:700'); } catch (e) {}
  if (APP_V) ['sig', 'sSig'].forEach(i => { $(i).textContent = 'by 劉宇哲 · v' + APP_V; });
  const lsGet = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
  const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
  const lsJSON = (k, d) => { try { const v = JSON.parse(lsGet(k) || 'null'); return v == null ? d : v; } catch (e) { return d; } };
  const lsArr = (k, d) => { const v = lsJSON(k, d); return Array.isArray(v) ? v : d; };

  const PANES = TOOLS.filter(t => t.src);            // 真的有自己一個 iframe 的工具
  const MAIN = PANES.map(t => t.id), ALL = [...MAIN, 'todo'];
  const ENTRY = Object.fromEntries(TOOLS.map(t => [t.id, t]));
  const paneOf = id => (ENTRY[id] && (ENTRY[id].pane || ENTRY[id].id)) || null;
  const narrow = matchMedia('(max-width:900px)');
  const app = $('app'), track = $('work');

  // 工具的 iframe：依清單產生
  track.innerHTML = PANES.map(t => `<section class="pane" id="pane-${t.id}" aria-label="${esc(t.full)}"><iframe id="f-${t.id}" data-src="${esc(t.src)}" title="${esc(t.full)}"></iframe></section>`).join('');

  // 目前的位置：cur＝哪個工具（iframe）；views[工具]＝那個工具回報它現在在哪個畫面
  let cur = MAIN.includes('meds') ? 'meds' : MAIN[0];
  const views = {};
  const selected = () => { const v = views[cur]; const e = TOOLS.find(t => t.pane === cur && t.view === v); return e ? e.id : cur; };

  /* ── 導覽：側欄（電腦）、底部列與全部工具（手機） ── */
  let pins = lsArr('hub.ui.pins', DEFAULT_PINS).filter(id => ENTRY[id] && !ENTRY[id].urgent).slice(0, MAX_PINS);
  const groups = () => { const g = []; TOOLS.forEach(t => { let x = g.find(y => y.n === t.group); if (!x) g.push(x = { n: t.group, items: [] }); x.items.push(t); }); return g; };
  const navBtn = (t, prefix) => `<button class="nav${t.urgent ? ' urgent' : ''}" type="button" role="tab" id="${prefix}${t.id}" data-go="${t.id}" aria-selected="false" title="${esc(t.full + '：' + t.hint)}">${ic(t.icon)}<span class="tx"><span class="nm">${esc(t.full)}</span><span class="hint">${esc(t.hint)}</span></span></button>`;
  function buildRail() {
    $('railList').innerHTML = groups().map(g => `<div class="grp">${esc(g.n)}</div>` + g.items.map(t => navBtn(t, 'tab-')).join('')).join('') +
      `<div class="grp">值班</div><button class="nav" type="button" id="sideToggle" aria-pressed="true" title="顯示／收起右側待辦">${ic('todo')}<span class="tx"><span class="nm">待辦</span><span class="hint" id="railTodoHint">常駐在右側</span></span><span class="badge" id="railN" hidden></span></button>`;
  }
  function buildMnav() {
    // 急救類固定在最左邊，後面是釘選的
    const fixed = TOOLS.filter(t => t.urgent).map(t => t.id);
    $('mnav').innerHTML = [...fixed, ...pins.filter(id => !fixed.includes(id))].map(id => { const t = ENTRY[id]; return `<button type="button"${t.urgent ? ' class="urgent"' : ''} id="m-${t.id}" data-go="${t.id}" aria-selected="false">${ic(t.icon)}<span class="lb">${esc(t.name)}</span></button>`; }).join('') +
      `<button type="button" id="fab" aria-label="待辦表" aria-expanded="false">${ic('todo')}<span class="lb">待辦</span><span class="badge hot" id="tabN" hidden></span></button>` +
      `<button type="button" id="mAll" aria-label="全部工具" aria-expanded="false" aria-selected="false">${ic('grid')}<span class="lb" id="mAllLb">全部</span></button>`;
  }
  function buildSheet(q) {
    q = (q || '').trim().toLowerCase();
    const hit = t => !q || (t.name + t.full + t.hint + t.group + t.id).toLowerCase().includes(q);
    const html = groups().map(g => { const it = g.items.filter(hit); return it.length ? `<div class="grp">${esc(g.n)}</div>` + it.map(t =>
      `<div class="sheet-row">${navBtn(t, 's-')}${t.urgent ? '' : `<button class="pin" type="button" data-pin="${t.id}" aria-pressed="${pins.includes(t.id)}" aria-label="${pins.includes(t.id) ? '取消釘選' : '釘選到底部'}：${esc(t.full)}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="${ICONS.pin}"/></svg></button>`}</div>`).join('') : ''; }).join('');
    $('sheetList').innerHTML = (html || '<p class="sheet-note">找不到符合的工具</p>') + `<p class="sheet-note">圖釘＝放到底部導覽（最多 ${MAX_PINS} 個，ACLS 固定在最左邊）。工具之間也可以左右滑。</p>`;
    $('sheetQ').hidden = TOOLS.length <= 8;
  }
  function paintNav() {
    const sel = selected(), t = ENTRY[sel];
    TOOLS.forEach(x => ['tab-', 'm-', 's-'].forEach(p => { const b = $(p + x.id); if (b) b.setAttribute('aria-selected', x.id === sel); }));
    const all = $('mAll'); if (all) { const off = !$('m-' + sel); all.setAttribute('aria-selected', off); $('mAllLb').textContent = off ? t.name : '全部'; }
  }

  /* ── 載入：先載眼前的工具，其他的排隊一個一個載（上一個載完、畫面閒下來才載下一個）──
     全部都會預先載好：病房網路不穩時，已經載好的工具照樣能用（急救時不能等）。 */
  const loaded = new Set();
  function healthy(f) {
    try {
      const d = f.contentDocument;
      if (!d || d.location.href === 'about:blank') return false;
      return !!(d.body && d.body.childElementCount);
    } catch (e) { return true; }
  }
  // 自我修復：沒載出來就自動重載（最多兩次），還是不行就放「重新載入」按鈕
  const tries = {}, wt = {};
  function failUI(k) {
    const p = $('pane-' + k);
    let b = p.querySelector('.reload');
    if (!b) {
      b = document.createElement('button'); b.type = 'button'; b.className = 'reload';
      b.textContent = '這個工具沒載出來，點這裡重新載入';
      b.onclick = () => { tries[k] = 0; reloadTool(k); };
      p.appendChild(b);
    }
    p.classList.add('loaded', 'failed');
  }
  function watch(k) {
    clearTimeout(wt[k]);
    wt[k] = setTimeout(() => {
      const f = $('f-' + k);
      if ($('pane-' + k).classList.contains('loaded') && healthy(f)) return;
      (tries[k] || 0) < 2 ? reloadTool(k) : failUI(k);
    }, 15000);
  }
  function reloadTool(k) {
    const f = $('f-' + k);
    tries[k] = (tries[k] || 0) + 1;
    $('pane-' + k).classList.remove('failed', 'loaded');   // 拿掉 loaded：重載期間要送給工具的訊息會排隊等它載完
    f.src = f.dataset.src;
    watch(k);
  }
  const waiters = {};
  function ensure(k) {
    if (!k || loaded.has(k)) return;
    const f = $('f-' + k); if (!f) return;
    loaded.add(k);
    f.addEventListener('load', () => {
      if (!healthy(f)) { (tries[k] || 0) < 2 ? reloadTool(k) : failUI(k); return; }
      clearTimeout(wt[k]);
      delete views[k];
      $('pane-' + k).classList.remove('failed');
      $('pane-' + k).classList.add('loaded');
      syncTheme(); if (k === 'todo') bindTodoDoc();
      (waiters[k] || []).splice(0).forEach(fn => fn());
    });
    f.src = f.dataset.src;
    watch(k);
  }
  const whenLoaded = (k, fn) => { if ($('pane-' + k).classList.contains('loaded')) fn(); else (waiters[k] = waiters[k] || []).push(fn); };
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState !== 'visible') return;
    loaded.forEach(k => { const f = $('f-' + k); if ($('pane-' + k).classList.contains('loaded') && !healthy(f)) { tries[k] = 0; reloadTool(k); } });
  });
  const idle = cb => (window.requestIdleCallback ? requestIdleCallback(cb, { timeout: 1200 }) : setTimeout(cb, 200));
  function warmRest() {
    const recent = lsArr('hub.ui.recent', []);
    const rank = k => (k === 'todo' ? -3 : k === 'acls' ? -2 : recent.includes(k) ? recent.indexOf(k) : 50 + Math.abs(MAIN.indexOf(k) - MAIN.indexOf(cur)));
    const order = [...ALL].sort((a, b) => rank(a) - rank(b));
    const lite = !!(navigator.connection && navigator.connection.saveData);   // 省流量模式：只預載待辦和 ACLS
    const next = () => {
      const k = order.find(x => !loaded.has(x)); if (!k || (lite && rank(k) >= 0)) return;
      ensure(k);
      let gone = false; const go = () => { if (gone) return; gone = true; idle(next); };
      whenLoaded(k, go); setTimeout(go, 4000);
    };
    idle(next);
  }

  /* ── 切換工具 ── */
  let lockUntil = 0, syncT = 0;
  function paint() {
    const i = MAIN.indexOf(cur);
    MAIN.forEach((k, j) => {
      const p = $('pane-' + k);
      p.classList.toggle('main-on', k === cur); p.classList.toggle('on', k === cur);
      p.classList.toggle('near', Math.abs(j - i) <= 1);
    });
    paintNav();
    lsSet('hub.pane', JSON.stringify({ cur, lastMain: cur }));
  }
  function remember(k) { const r = [k, ...lsArr('hub.ui.recent', []).filter(x => x !== k && MAIN.includes(x))].slice(0, 4); lsSet('hub.ui.recent', JSON.stringify(r)); }
  // 進到工具裡的某個畫面（例如主訴處理裡的接新病人）；點「主訴處理」本身而它正停在接新病人時，請它回到主畫面
  function tellView(pane, view) {
    whenLoaded(pane, () => { try { $('f-' + pane).contentWindow.postMessage({ hub: 'go', view }, '*'); } catch (e) {} });
  }
  function show(id, instant) {
    const p = paneOf(id); if (!MAIN.includes(p)) return;
    const e = ENTRY[id], far = Math.abs(MAIN.indexOf(p) - MAIN.indexOf(cur)) > 1, was = cur;
    cur = p; ensure(p); remember(p);
    if (e.view) { views[p] = e.view; tellView(p, e.view); }
    else if (TOOLS.some(t => t.pane === p && t.view === views[p])) { delete views[p]; tellView(p, 'main'); }
    paint();
    if (narrow.matches) {
      if (far || instant) MAIN.forEach(k => $('pane-' + k).classList.add('near'));
      lockUntil = Date.now() + 600;
      track.scrollTo({ left: MAIN.indexOf(p) * track.clientWidth, behavior: instant || far || was === p ? 'instant' : 'smooth' });
      if (far || instant) requestAnimationFrame(paint);
    }
  }
  // 工具回報自己現在在哪個畫面 → 導覽的亮燈跟著變
  window.addEventListener('message', e => {
    if (!e.data || e.data.hub !== 'view') return;
    const k = MAIN.find(x => { try { return $('f-' + x).contentWindow === e.source; } catch (er) { return false; } });
    if (!k) return;
    views[k] = e.data.view; if (k === cur) paintNav();
  });
  function fromScroll() {
    const i = Math.round(track.scrollLeft / Math.max(1, track.clientWidth));
    ensure(MAIN[i]);
    if (MAIN[i] && MAIN[i] !== cur) { cur = MAIN[i]; remember(cur); paint(); }
  }
  track.addEventListener('scroll', () => {
    if (!narrow.matches) return;
    clearTimeout(syncT); syncT = setTimeout(() => { lockUntil = 0; fromScroll(); }, 100);
    if (Date.now() >= lockUntil) fromScroll();
  }, { passive: true });
  // 手指開始左右滑時，先把左右鄰居載起來
  track.addEventListener('touchstart', () => { const i = MAIN.indexOf(cur); ensure(MAIN[i + 1]); ensure(MAIN[i - 1]); }, { passive: true });
  addEventListener('resize', () => { if (narrow.matches) track.scrollTo({ left: MAIN.indexOf(cur) * track.clientWidth, behavior: 'instant' }); });

  /* ── 浮層：待辦抽屜、全部工具（手機）。Android 的返回鍵會先關掉浮層，不會直接離開 ── */
  const drawerOpen = () => $('pane-todo').classList.contains('open');
  const sheetOpen = () => $('sheet').classList.contains('open');
  let histOn = false;
  function histPush() { if (histOn) return; try { history.pushState({ hubOverlay: 1 }, ''); histOn = true; } catch (e) {} }
  let popSkip = 0;   // 自己呼叫 history.back() 引起的 popstate 要略過（它是非同步的，可能晚於下一次開浮層）
  function histPop() { if (!histOn) return; histOn = false; try { if (history.state && history.state.hubOverlay) { popSkip++; history.back(); } } catch (e) {} }
  window.addEventListener('popstate', () => {
    if (popSkip) {
      popSkip--;
      // 關了馬上又開：瀏覽器可能把新開浮層的那一筆紀錄跟著退掉了，這裡補回去，返回鍵才會是「關浮層」而不是離開
      if ((drawerOpen() || sheetOpen()) && !(history.state && history.state.hubOverlay)) { histOn = false; histPush(); }
      return;
    }
    if (!histOn) return; histOn = false; setDrawer(false, true); setSheet(false, true); });
  function setDrawer(open, fromHist) {
    const on = !!open && narrow.matches;
    $('pane-todo').classList.toggle('open', on);
    $('pane-todo').inert = narrow.matches && !on;
    const fab = $('fab'); if (fab) fab.setAttribute('aria-expanded', on);
    document.body.classList.toggle('drawer', on);
    if (on) { setSheet(false, true); ensure('todo'); histPush(); } else if (!fromHist && !sheetOpen()) histPop();
    paintScrim();
  }
  function setSheet(open, fromHist) {
    const on = !!open && narrow.matches;
    if (on) { buildSheet(''); $('sheetQ').value = ''; paintNav(); }
    $('sheet').classList.toggle('open', on);
    $('sheet').inert = !on;
    const b = $('mAll'); if (b) b.setAttribute('aria-expanded', on);
    if (on) { setDrawer(false, true); histPush(); } else if (!fromHist && !drawerOpen()) histPop();
    paintScrim();
  }
  function paintScrim() { $('scrim').classList.toggle('on', drawerOpen() || sheetOpen()); }
  $('sheet').inert = true;

  // 電腦：右側待辦可收起；左側工具欄可收成圖示（只記在這台裝置）
  function setSide(on) { app.classList.toggle('side-off', !on); const b = $('sideToggle'); if (b) { b.setAttribute('aria-pressed', on); $('railTodoHint').textContent = on ? '常駐在右側' : '已收起，點一下打開'; } lsSet('hub.ui.side', on ? '1' : '0'); }
  // 工具欄：使用者按過就照他的；沒按過的話，視窗不夠寬（901–1180px）時自動收成圖示，把寬度讓給工具
  const mid = matchMedia('(min-width:901px) and (max-width:1180px)');
  function paintRail() { const s = lsGet('hub.ui.rail'); app.classList.toggle('rail-min', s === '1' || (s == null && mid.matches)); }
  function setRail(min) { lsSet('hub.ui.rail', min ? '1' : '0'); paintRail(); }
  mid.addEventListener('change', paintRail);

  function toast(text, actions) {
    document.querySelector('.hub-toast')?.remove(); clearTimeout(toast.t);
    const t = document.createElement('div'); t.className = 'hub-toast'; t.setAttribute('role', 'status');
    const msg = document.createElement('span'); msg.textContent = text; t.appendChild(msg);
    (actions || []).forEach(([label, fn, cls]) => { const b = document.createElement('button'); b.type = 'button'; b.textContent = label; if (cls) b.className = cls; b.onclick = () => fn(t, msg, b); t.appendChild(b); });
    document.body.appendChild(t); toast.t = setTimeout(() => t.remove(), 3200);
    return t;
  }
  function togglePin(id) {
    if (pins.includes(id)) pins = pins.filter(x => x !== id);
    else if (pins.length >= MAX_PINS) { toast(`底部最多釘選 ${MAX_PINS} 個，先取消一個`); return; }
    else pins = TOOLS.map(t => t.id).filter(x => x === id || pins.includes(x));
    lsSet('hub.ui.pins', JSON.stringify(pins));
    buildMnav(); buildSheet($('sheetQ').value); status(true); paintNav(); mirror();
    $('mAll').setAttribute('aria-expanded', sheetOpen());
  }

  // 事件一律委派：導覽是依清單產生的
  document.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.pin) { togglePin(b.dataset.pin); return; }
    if (b.dataset.go) { const s = sheetOpen(); if (s) setSheet(false); if (drawerOpen()) setDrawer(false); show(b.dataset.go, s); return; }
    switch (b.id) {
      case 'fab': setDrawer(!drawerOpen()); break;
      case 'mAll': setSheet(!sheetOpen()); break;
      case 'sheetClose': setSheet(false); break;
      case 'todoClose': narrow.matches ? setDrawer(false) : setSide(false); break;
      case 'sideToggle': setSide(app.classList.contains('side-off')); break;
      case 'railToggle': setRail(!app.classList.contains('rail-min')); break;
    }
  });
  $('scrim').addEventListener('click', () => { setDrawer(false); setSheet(false); });
  $('sheetQ').addEventListener('input', e => { buildSheet(e.target.value); paintNav(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') { setDrawer(false); setSheet(false); } });
  narrow.addEventListener('change', () => { setDrawer(false, true); setSheet(false, true); histPop(); show(selected(), true); });

  // 其他工具把東西加進待辦：底部提示（可撤銷），待辦按鈕跳一下
  window.addEventListener('message', e => {
    if (!e.data || e.data.hub !== 'todo-add') return;
    const d = e.data, acts = [];
    if (d.id) acts.push(['撤銷', (t, msg, b) => {
      try {
        const st = JSON.parse(localStorage.getItem('shiftboard.v1') || 'null');
        if (st && Array.isArray(st.items)) { st.items = st.items.filter(i => i.id !== d.id); st.del = { ...(st.del || {}), [d.id]: Date.now() }; localStorage.setItem('shiftboard.v1', JSON.stringify(st)); }
      } catch (er) {}
      msg.textContent = '已撤銷'; t.querySelectorAll('button').forEach(x => x.remove()); status(true); clearTimeout(toast.t); toast.t = setTimeout(() => t.remove(), 1200);
    }, 'undo']);
    if (narrow.matches) acts.push(['打開', t => { t.remove(); setDrawer(true); }]);
    else if (app.classList.contains('side-off')) acts.push(['打開', t => { t.remove(); setSide(true); }]);
    toast(`已加入待辦：${d.bed ? d.bed + ' 床 ' : ''}${d.text}${d.n ? `（${d.n} 項）` : ''}`, acts);
    const fab = $('fab'); if (fab) { fab.classList.remove('pop'); void fab.offsetWidth; fab.classList.add('pop'); }
    status(true);
  });

  // 讓內嵌工具跟著總站的明暗主題
  function syncTheme() {
    const t = document.documentElement.getAttribute('data-theme');
    ALL.forEach(k => {
      try {
        const r = $('f-' + k).contentDocument && $('f-' + k).contentDocument.documentElement;
        if (!r) return;
        t ? r.setAttribute('data-theme', t) : r.removeAttribute('data-theme');
      } catch (e) {}
    });
  }
  new MutationObserver(syncTheme).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

  // 手勢：待辦抽屜開著時，往左拖會跟著手指收起；在輸入框或可左右捲動的區塊裡不觸發
  function scrollsX(el) {
    for (; el && el.nodeType === 1; el = el.parentElement) {
      if (/^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName)) return true;
      const cs = (el.ownerDocument.defaultView || window).getComputedStyle(el);
      if (el.scrollWidth > el.clientWidth + 2 && /(auto|scroll)/.test(cs.overflowX)) return true;
    }
    return false;
  }
  const drawer = $('pane-todo');
  let dg = null;
  function dStart(e) {
    if (!narrow.matches || !drawerOpen() || e.touches.length !== 1 || scrollsX(e.target)) { dg = null; return; }
    const t = e.touches[0];
    dg = { x: t.clientX, y: t.clientY, t0: Date.now(), lock: false, dx: 0 };
  }
  function dMove(e) {
    if (!dg) return;
    const t = e.touches[0], dx = t.clientX - dg.x, dy = t.clientY - dg.y;
    if (!dg.lock) {
      if (Math.abs(dx) < 10 && Math.abs(dy) < 10) return;
      if (dx < 0 && Math.abs(dx) > Math.abs(dy) * 1.5) { dg.lock = true; drawer.style.transition = 'none'; $('scrim').style.transition = 'none'; }
      else { dg = null; return; }
    }
    if (e.cancelable) e.preventDefault();
    dg.dx = Math.min(0, dx);
    drawer.style.transform = `translateX(${dg.dx}px)`;
    $('scrim').style.opacity = String(Math.max(0, 1 + dg.dx / drawer.offsetWidth));
  }
  function dEnd() {
    const g = dg; dg = null;
    if (!g || !g.lock) return;
    const close = g.dx < -drawer.offsetWidth * 0.3 || (Date.now() - g.t0 < 300 && g.dx < -40);
    drawer.style.transition = ''; $('scrim').style.transition = '';
    drawer.style.transform = ''; $('scrim').style.opacity = '';
    setDrawer(!close);
  }
  function bindDrag(el) {
    if (!el || el.__drag) return;
    el.__drag = true;
    el.addEventListener('touchstart', dStart, { passive: true });
    el.addEventListener('touchmove', dMove, { passive: false });
    el.addEventListener('touchend', dEnd, { passive: true });
    el.addEventListener('touchcancel', dEnd, { passive: true });
  }
  bindDrag(drawer); bindDrag($('scrim'));
  function bindTodoDoc() { try { bindDrag($('f-todo').contentDocument); } catch (e) {} }

  /* ── 狀態：時間、待辦數量（讀待辦表存的資料；內容沒變就不重算）、同步狀態鏡射到手機版位置 ── */
  let lastRaw, lastMin = -1, lastOver = -1;
  function status(force) {
    const now = Date.now(), d = new Date(), min = d.getHours() * 60 + d.getMinutes();
    if (min !== lastMin) {
      lastMin = min;
      $('clock').textContent = d.toLocaleString('zh-TW', { month: 'numeric', day: 'numeric', weekday: 'short', hour: '2-digit', minute: '2-digit', hour12: false });
    }
    const raw = lsGet('shiftboard.v1');
    if (raw !== lastRaw) { lastRaw = raw; status.items = []; try { const s = JSON.parse(raw || 'null'); if (s && Array.isArray(s.items)) status.items = s.items.filter(i => !i.ex); } catch (e) {} force = true; }
    const items = status.items || [];
    const over = items.filter(i => i.due && i.due <= now).length;
    if (!force && over === lastOver) return;
    lastOver = over;
    const p1 = items.filter(i => i.p === 1).length;
    $('status').innerHTML = `${over ? `<span class="hot">已到時 ${over}</span> · ` : ''}立即 ${p1} · 共 ${items.length}`;
    const rn = $('railN'); if (rn) { rn.hidden = !items.length; rn.textContent = over || items.length; rn.classList.toggle('hot', !!over); }
    const tn = $('tabN'); if (tn) { tn.hidden = !over; tn.textContent = over; }
  }
  window.addEventListener('storage', () => status());
  const syncEl = $('sync');
  const mirror = () => {
    const s = syncEl.dataset.s, txt = syncEl.textContent, tip = syncEl.title;
    if (!syncEl.firstElementChild) syncEl.innerHTML = `<span>${esc(txt)}</span>`;
    const all = $('mAll'); if (all) all.classList.toggle('warn', s === 'err');
    $('sSync').dataset.s = s; $('sSync').textContent = txt; $('sSync').title = tip;
  };
  new MutationObserver(mirror).observe(syncEl, { attributes: true, attributeFilter: ['data-s'], childList: true });

  /* ── 開機 ── */
  buildRail(); buildMnav(); buildSheet('');
  paintRail();
  setSide(lsGet('hub.ui.side') !== '0');
  mirror(); status(true); setInterval(status, 2000);
  const saved = lsJSON('hub.pane', null); if (saved && MAIN.includes(saved.lastMain)) cur = saved.lastMain;
  const h = location.hash.slice(1);
  show(ENTRY[h] ? h : cur, true);
  if (!narrow.matches) ensure('todo');
  if (h === 'todo' && narrow.matches) setDrawer(true);
  addEventListener('hashchange', () => { const x = location.hash.slice(1); if (ENTRY[x]) show(x, true); else if (x === 'todo') narrow.matches ? setDrawer(true) : setSide(true); });
  if (document.readyState === 'complete') warmRest(); else addEventListener('load', warmRest, { once: true });
})();
</script>

<script>
/* 雲端同步：把這個工具所有 localStorage 資料存到「每個人自己的」雲端空間（data/users/<id>/）。
   主畫面 App 被滑掉、換手機、清快取都不會掉。沒登入或沒有寫入權限時，照舊只存本機。 */
(async () => {
  const el = document.getElementById('sync');
  const LABEL = { wait: '連線中', ok: '已同步', busy: '同步中', local: '僅本機', err: '同步失敗' };
  const TIP = { wait: '雲端同步：連線中', ok: '資料已存到你自己的雲端空間，只有你看得到', busy: '正在存到雲端',
    local: '沒有登入 claude.ai 或沒有寫入權限：資料只存在這台裝置，被清掉就沒了', err: '雲端同步失敗，資料暫時只在這台裝置' };
  const ind = s => { el.dataset.s = s; el.textContent = LABEL[s]; el.title = TIP[s]; };
  const META = 'hub.sync.meta', CH = 60000;
  const skip = k => !k || k.startsWith('hub.sync') || k.startsWith('hub.ui.') || k === 'acls-run';   // hub.ui.*：只跟這台裝置有關的版面設定（釘選、側欄收合）
  const enc = k => 'k' + Array.from(new TextEncoder().encode(k), b => b.toString(16).padStart(2, '0')).join('');
  const dec = id => new TextDecoder().decode(new Uint8Array(id.slice(1).match(/../g).map(h => parseInt(h, 16))));
  const ls = {
    get: k => { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set: (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); return true; } catch (e) { return false; } },
    keys: () => { try { return Object.keys(localStorage).filter(k => !skip(k) && enc(k).length <= 190); } catch (e) { return []; } },
  };
  let meta = {}; try { meta = JSON.parse(ls.get(META) || '{}') || {}; } catch (e) {}
  const SIG = 'hub.sync.sig';
  let sig = {}; try { sig = JSON.parse(ls.get(SIG) || '{}') || {}; } catch (e) {}
  const fp = v => { if (v == null) return null; let h = 5381; for (let i = 0; i < v.length; i++) h = (h * 33 ^ v.charCodeAt(i)) >>> 0; return v.length + ':' + h; };
  const saveMeta = () => { ls.set(META, JSON.stringify(meta)); ls.set(SIG, JSON.stringify(sig)); };
  const within = (p, ms) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej({ code: 'timeout' }), ms))]);

  let db = null, uid = null;
  try {
    if (window.claude && claude.use) {
      const [d, u] = await Promise.all([claude.use('db'), claude.use('user')]);
      db = d; uid = d && u ? await u.id() : null;
    }
  } catch (e) {}
  if (!db || !uid) { ind('local'); return; }
  const col = db.collection('data/users/' + uid);
  const known = {}, chunksN = {};   // known：最後一次跟雲端一致的值

  async function pull(first) {
    const snap = await within(col.get(), 12000);
    const main = {}, parts = {};
    snap.docs.forEach(d => { if (!d.exists) return; const i = d.id.indexOf('~'); i < 0 ? (main[d.id] = d.data()) : (parts[d.id] = d.data()); });
    const changed = [];
    for (const id in main) {
      let k; try { k = dec(id); } catch (e) { continue; }
      if (skip(k)) continue;
      const d = main[id];
      let v = d.del ? null : d.n ? Array.from({ length: d.n }, (_, i) => (parts[id + '~' + i] || {}).v || '').join('') : d.v;
      if (typeof v !== 'string') v = null;
      chunksN[k] = d.n || 0;
      if ((d.t || 0) > (meta[k] || 0)) {            // 雲端比較新（或這台裝置被清空了）
        // 本機有沒有「還沒上傳的修改」：跟上次和雲端一致時的指紋比（存在本機，重開 App 也記得）
        const local = ls.get(k), dirty = local != null && local !== v && (k in sig ? sig[k] !== fp(local) : true);
        if (dirty && local != null && v != null && local !== v) {
          // 兩邊都改過：待辦表逐項合併；其他資料用雲端的，本機那份留一份備份（查房板「⋯」可以從快照救回）
          const m = merge(k, local, v);
          if (m != null) { ls.set(k, m); changed.push(k); }
          else { ls.set('hub.sync.bak:' + k, local); ls.set(k, v); changed.push(k); }
        } else if (local !== v) { ls.set(k, v); changed.push(k); }
        meta[k] = d.t;
      }
      known[k] = v; sig[k] = fp(ls.get(k) === v ? v : known[k]);
    }
    saveMeta();
    if (changed.length) notify(changed);
  }
  // 待辦表：兩台裝置各自加的都留著；任一邊完成就算完成
  function merge(k, a, b) {
    if (k !== 'shiftboard.v1') return null;
    try {
      const A = JSON.parse(a), B = JSON.parse(b);
      if (!A || !B || !Array.isArray(A.items) || !Array.isArray(B.items)) return null;
      // 任一邊刪掉的（del：id → 刪除時間）就算刪掉，不會被另一邊的舊資料補回來；14 天前的刪除紀錄清掉
      const now = Date.now(), del = {};
      [A.del, B.del].forEach(d => { for (const id in d || {}) if (now - d[id] <= 14 * 864e5) del[id] = Math.max(del[id] || 0, d[id]); });
      const done = new Map(), items = new Map();
      [...(A.done || []), ...(B.done || [])].forEach(i => { if (!del[i.id] && !done.has(i.id)) done.set(i.id, i); });
      [...A.items, ...B.items].forEach(i => { if (!del[i.id] && !done.has(i.id) && !items.has(i.id)) items.set(i.id, i); });
      return JSON.stringify({ ...B, items: [...items.values()], done: [...done.values()], del });
    } catch (e) { return null; }
  }
  // 雲端帶來新資料：送一個 storage 事件給每個工具，各自就地更新（不整頁重載，查房板跑到哪一床、OCR、急救計時都不會被打斷）。
  // 只有不會自己聽 storage 的工具，而且是它自己的資料變了，才重新載入它。
  const OWN = { 'f-consult': ['consult-draft', 'consult-example'], 'f-meds': ['wr3'], 'f-pilot': ['oncall.prefs.v1'] };
  function notify(changed) {
    document.querySelectorAll('.pane iframe[src]').forEach(f => {
      const own = OWN[f.id];
      if (own && changed.some(k => own.includes(k))) {
        // 還在第一次載入中（pane 還沒 loaded）就不用重載：它載完會自己讀到新資料。
        // 這時候 reload 會重載的是佔位的 about:blank，把正在載的工具打斷，畫面就停在空白（11/12 用藥速查、會診稿載不出來）
        if (!f.closest('.pane').classList.contains('loaded')) return;
        f.closest('.pane').classList.remove('loaded');   // 載完（load 事件）會再加回來；期間總站要送給它的訊息會排隊
        try { f.contentWindow.location.reload(); } catch (e) { f.src = f.dataset.src; }
        return;
      }
      changed.forEach(k => { try { f.contentWindow.dispatchEvent(new StorageEvent('storage', { key: k, newValue: ls.get(k) })); } catch (e) {} });
    });
    window.dispatchEvent(new Event('storage'));
  }

  async function write(k, v) {
    const t = Date.now(), id = enc(k), ref = col.doc(id);
    if (v == null) await ref.set({ t, del: 1 });
    else if (v.length <= CH) await ref.set({ t, v });
    else {
      const n = Math.ceil(v.length / CH);
      for (let i = 0; i < n; i++) await col.doc(id + '~' + i).set({ v: v.slice(i * CH, (i + 1) * CH) });
      await ref.set({ t, n });
      for (let i = n; i < (chunksN[k] || 0); i++) await col.doc(id + '~' + i).delete().catch(() => {});
      chunksN[k] = n;
    }
    known[k] = v; sig[k] = fp(v); meta[k] = t; saveMeta();
  }

  let busy = false, again = false, ready = false, tick = 0;
  async function flush() {
    if (!ready) return;
    if (busy) { again = true; return; }
    busy = true;
    try {
      do {
        again = false;
        const keys = new Set([...ls.keys(), ...Object.keys(known).filter(k => known[k] != null)]);
        const todo = [...keys].filter(k => ls.get(k) !== (known[k] ?? null));
        if (!todo.length) break;
        ind('busy');
        for (const k of todo) await write(k, ls.get(k));
      } while (again);
      ind('ok');
    } catch (e) {
      ind('err');
      if (e && e.code === 'revoked') { clearInterval(tick); return; }
    } finally { busy = false; }
  }

  // 一定要先成功讀到雲端，才開始往上存：避免剛被清空的裝置把空白資料蓋到雲端
  async function start() {
    try { await pull(true); ready = true; ind('ok'); flush(); }
    catch (e) { if (e && e.code === 'revoked') { ind('local'); return; } ind('err'); setTimeout(start, 15000); }
  }
  start();
  let deb = 0;
  const soon = () => { clearTimeout(deb); deb = setTimeout(flush, 800); };
  window.addEventListener('storage', soon);
  tick = setInterval(flush, 3000);
  // 切到背景（滑回主畫面、鎖螢幕）時立刻存；回到前景時拉一次別台裝置的變更
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden') flush();
    else if (ready) pull(false).then(flush).catch(() => {}); // pull 會先處理本機沒上傳完的修改（合併或備份），不會直接蓋掉
  });
  window.addEventListener('pagehide', flush);
  // 電腦切回這個視窗（不一定會觸發 visibilitychange），以及畫面開著時每 30 秒，各拉一次別台裝置的變更：
  // 手機上剛打的 admission note、待辦，電腦不用重新整理就看得到
  let lastPull = 0;
  const pullSoon = () => { if (!ready || document.visibilityState !== 'visible' || Date.now() - lastPull < 5000) return; lastPull = Date.now(); pull(false).then(flush).catch(() => {}); };
  window.addEventListener('focus', pullSoon);
  setInterval(pullSoon, 30000);
})();
</script>
