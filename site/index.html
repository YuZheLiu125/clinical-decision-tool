<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>

<meta name="author" content="劉宇哲">

<style id="hub-base">/* 臨床輔助決策工具 · 共用基底（每個工具都內嵌這一份）
   字體：系統字（iPhone = 蘋方，Android = Noto CJK），不下載網路字型，開啟更快
   色票：病房冷灰底 + 各工具辨識色；動畫：同一組曲線與時長 */
:root{
  --hub-bg:#EEF1F2; --hub-surface:#FFFFFF; --hub-surface2:#E6EAEC; --hub-ink:#152025; --hub-ink2:#4A575E; --hub-ink3:#6E7A81; --hub-line:#D3DADD;
  --hub-bad:#B3261E; --hub-bad-soft:#FBE6E4; --hub-warn:#9A5B00; --hub-warn-soft:#FBEFD9; --hub-ok:#1D7A3E; --hub-ok-soft:#E1F2E6;
  --hub-code:#C0262F; --hub-code-soft:#FBE4E5; --hub-pilot:#A35500; --hub-pilot-soft:#F6E7D2;
  --hub-consult:#2C5C8C; --hub-consult-soft:#DFE8F2; --hub-meds:#0D6870; --hub-meds-soft:#DDEFF0;
  --hub-labs:#5B4699; --hub-labs-soft:#EBE6F6; --hub-todo:#B4573A; --hub-todo-soft:#F5E3DA;
  --hub-p1:#B3322B; --hub-p2:#C27416; --hub-p3:#4F6B8A; --hub-p4:#8A867B;
  --hub-sans:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Noto Sans CJK TC","Microsoft JhengHei",system-ui,sans-serif;
  --hub-mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,"Roboto Mono",monospace;
  --hub-ease:cubic-bezier(.2,.8,.2,1); --hub-dur:.18s;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --hub-bg:#0E1316; --hub-surface:#161D21; --hub-surface2:#1E272C; --hub-ink:#E4E9EB; --hub-ink2:#A2AEB4; --hub-ink3:#7E8B93; --hub-line:#2A353B;
  --hub-bad:#FF7A70; --hub-bad-soft:#3A1B19; --hub-warn:#F0B04A; --hub-warn-soft:#352812; --hub-ok:#6CCF8E; --hub-ok-soft:#15301F;
  --hub-code:#FF6B70; --hub-code-soft:#3A1A1D; --hub-pilot:#F0A23A; --hub-pilot-soft:#3A2911;
  --hub-consult:#80B1E0; --hub-consult-soft:#162636; --hub-meds:#5CC2C8; --hub-meds-soft:#16302F;
  --hub-labs:#B4A2EC; --hub-labs-soft:#2A2440; --hub-todo:#E08A68; --hub-todo-soft:#3A241B; --hub-p1:#EF6A5E; --hub-p2:#E3A04A; --hub-p3:#8FABC9; --hub-p4:#A6A297; color-scheme:dark}}
:root[data-theme="dark"]{
  --hub-bg:#0E1316; --hub-surface:#161D21; --hub-surface2:#1E272C; --hub-ink:#E4E9EB; --hub-ink2:#A2AEB4; --hub-ink3:#7E8B93; --hub-line:#2A353B;
  --hub-bad:#FF7A70; --hub-bad-soft:#3A1B19; --hub-warn:#F0B04A; --hub-warn-soft:#352812; --hub-ok:#6CCF8E; --hub-ok-soft:#15301F;
  --hub-code:#FF6B70; --hub-code-soft:#3A1A1D; --hub-pilot:#F0A23A; --hub-pilot-soft:#3A2911;
  --hub-consult:#80B1E0; --hub-consult-soft:#162636; --hub-meds:#5CC2C8; --hub-meds-soft:#16302F;
  --hub-labs:#B4A2EC; --hub-labs-soft:#2A2440; --hub-todo:#E08A68; --hub-todo-soft:#3A241B; --hub-p1:#EF6A5E; --hub-p2:#E3A04A; --hub-p3:#8FABC9; --hub-p4:#A6A297; color-scheme:dark}

/* 觸控：點擊不延遲、不閃灰框、iPhone 不自動放大字 */
html{-webkit-tap-highlight-color:transparent;touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{-webkit-font-smoothing:antialiased;text-rendering:optimizeSpeed}
::selection{background:color-mix(in srgb,var(--hub-accent,var(--hub-ink)) 22%,transparent)}
/* iPhone 點進字小於 16px 的輸入框會自動放大、而且不會縮回來：觸控裝置上所有輸入框一律 ≥16px */
@media (pointer:coarse){input:not([type="checkbox"]):not([type="radio"]):not([type="range"]),textarea,select{font-size:max(16px,1em)!important}}
/* 共用動畫：按下去微縮、顏色淡入淡出（低權重，工具自己的設定優先） */
:where(button,.btn,.chip,.card,summary,[role="tab"],a){transition:background-color var(--hub-dur) var(--hub-ease),border-color var(--hub-dur) var(--hub-ease),color var(--hub-dur) var(--hub-ease),box-shadow var(--hub-dur) var(--hub-ease),opacity var(--hub-dur) var(--hub-ease),transform .12s var(--hub-ease)}
:where(button,.btn,.chip,[role="tab"]):active:not(:disabled){transform:scale(.97)}
@keyframes hub-in{from{opacity:0;transform:translateY(6px)}}
@keyframes hub-pop{0%{transform:scale(1)}40%{transform:scale(1.18)}100%{transform:scale(1)}}
.hub-toast{position:fixed;left:16px;right:16px;margin:0 auto;width:fit-content;bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:60;max-width:min(520px,calc(100% - 32px));box-sizing:border-box;display:flex;gap:10px;align-items:center;background:var(--hub-ink);color:var(--hub-bg);font:500 14px/1.4 var(--hub-sans);padding:9px 14px;border-radius:999px;box-shadow:0 8px 24px rgba(0,0,0,.25);animation:hub-in .22s var(--hub-ease)}
/* 待辦設定按鈕：跟待辦表的快速新增同一套（立即／緊急／待辦／有空，點緊急或待辦展開倒數） */
.hp{display:flex;flex-direction:column;gap:8px;min-width:0}
.hp-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.hp-pr{--pc:var(--hub-p3);display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:0;min-height:46px;padding:4px;border:1px solid color-mix(in srgb,var(--pc) 45%,var(--hub-line));border-radius:999px;background:transparent;color:var(--pc);font:500 15px/1.2 var(--hub-sans);cursor:pointer}
.hp-pr[data-p="1"]{--pc:var(--hub-p1)}.hp-pr[data-p="2"]{--pc:var(--hub-p2)}.hp-pr[data-p="4"]{--pc:var(--hub-p4)}
.hp-pr small{font-size:12px;font-variant-numeric:tabular-nums}
.hp-pr small:empty{display:none}
.hp-pr[aria-pressed="true"]{background:var(--pc);border-color:var(--pc);color:var(--hub-surface)}
.hp-tm{display:flex;gap:6px;overflow-x:auto;overscroll-behavior-x:contain;scrollbar-width:none;padding:2px}
.hp-tm::-webkit-scrollbar{display:none}
.hp-c{flex:none;min-height:40px;border:1px solid var(--hub-line);background:transparent;border-radius:999px;padding:6px 14px;font:15px/1 var(--hub-sans);color:var(--hub-ink);white-space:nowrap;cursor:pointer;font-variant-numeric:tabular-nums}
.hp-c[aria-pressed="true"]{background:var(--hub-ink);border-color:var(--hub-ink);color:var(--hub-bg)}
.hp input{flex:none;font:16px var(--hub-sans);min-height:40px;padding:5px 10px;border-radius:999px;border:1px solid var(--hub-line);background:var(--hub-bg);color:var(--hub-ink);width:80px;text-align:center}
.hp-dt{display:flex;gap:6px}
.hp-dt input[type="date"]{flex:1 1 9.5em;width:auto;max-width:12em}
.hp-dt input[type="time"]{width:7em}
/* 右滑加入待辦 */
[data-swipe]{position:relative;touch-action:pan-y}
[data-swipe].sw-drag{transition:none!important}
[data-swipe].sw-back{transition:transform .22s var(--hub-ease)!important}
[data-swipe]::before{content:"＋ 待辦";position:absolute;top:0;bottom:0;right:100%;width:var(--sw,0px);display:flex;align-items:center;justify-content:flex-end;padding-right:12px;box-sizing:border-box;background:var(--hub-todo);color:var(--hub-surface);font:700 14px/1 var(--hub-sans);white-space:nowrap;overflow:hidden;opacity:var(--swo,0);pointer-events:none}
[data-swipe].sw-arm::before{content:"放開加入"}
body.sw-on{-webkit-user-select:none;user-select:none}
@keyframes hub-flash{from{background-color:var(--hub-todo-soft);box-shadow:inset 4px 0 0 var(--hub-todo)}}
.sw-done{animation:hub-flash .9s var(--hub-ease)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}}
</style>
<style>
/* Layout: one-screen console. Top = clock + 待辦狀態; triage strip = 四種狀況依緊急度由左到右;
   below = 左邊 ACLS／副駕／會診稿／用藥速查／正常值五選一，右邊待辦表常駐（手機改六個分頁）。
   Palette: 病房冷灰底；每個工具保留自己的辨識色（急救紅、副駕琥珀、會診藍、用藥青、正常值紫、待辦陶土）。 */
:root{
  --bg:#EEF1F2; --surface:#FFFFFF; --ink:#152025; --ink-2:#4A575E; --line:#D3DADD;
  --code:#C0262F; --code-soft:#FBE4E5;
  --pilot:#A35500; --pilot-soft:#F6E7D2;
  --consult:#2C5C8C; --consult-soft:#DFE8F2;
  --meds:#0D6870; --meds-soft:#DDEFF0;
  --todo:#B4573A; --todo-soft:#F5E3DA;
  --labs:#5B4699; --labs-soft:#EBE6F6;
  --rounds:#3F6B2E; --rounds-soft:#E3EEDC;
  --f-body:var(--hub-sans);
  --f-mono:var(--hub-mono);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1316; --surface:#161D21; --ink:#E4E9EB; --ink-2:#A2AEB4; --line:#2A353B;
  --code:#FF6B70; --code-soft:#3A1A1D; --pilot:#F0A23A; --pilot-soft:#3A2911;
  --consult:#80B1E0; --consult-soft:#162636; --meds:#5CC2C8; --meds-soft:#16302F;
  --todo:#E08A68; --todo-soft:#3A241B; --labs:#B4A2EC; --labs-soft:#2A2440; --rounds:#93CC7C; --rounds-soft:#1E2E18; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1316; --surface:#161D21; --ink:#E4E9EB; --ink-2:#A2AEB4; --line:#2A353B;
  --code:#FF6B70; --code-soft:#3A1A1D; --pilot:#F0A23A; --pilot-soft:#3A2911;
  --consult:#80B1E0; --consult-soft:#162636; --meds:#5CC2C8; --meds-soft:#16302F;
  --todo:#E08A68; --todo-soft:#3A241B; --labs:#B4A2EC; --labs-soft:#2A2440; --rounds:#93CC7C; --rounds-soft:#1E2E18; color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;display:flex;flex-direction:column;overflow:hidden}
button,a{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* top bar */
.top{flex:none;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:10px 8px}
.top h1{margin:0;font-size:19px;font-weight:900;letter-spacing:.06em;display:flex;align-items:center;gap:8px}
.top h1::before{content:"";width:9px;height:9px;border-radius:2px;background:var(--code);box-shadow:12px 0 0 var(--pilot),24px 0 0 var(--meds);margin-right:26px}
.clock{font-family:var(--f-mono);font-size:14px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.status{margin-left:auto;display:flex;gap:6px;align-items:center;font-size:13px}
.pill{border-radius:999px;padding:2px 10px;background:var(--surface);border:1px solid var(--line);color:var(--ink-2);white-space:nowrap}
.pill b{font-family:var(--f-mono);font-weight:600;color:var(--ink)}
.pill.hot{background:var(--code);border-color:var(--code);color:var(--surface)}
.pill.hot b{color:var(--surface)}

/* triage strip */
.triage{flex:none;padding-block:4px 10px}
.tlab{font-size:12px;letter-spacing:.12em;color:var(--ink-2);margin:0 0 6px;display:flex;justify-content:space-between;gap:8px}
.tlab span:last-child{letter-spacing:0}
.cards{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.card{--c:var(--ink);--cs:var(--surface);display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:2px 10px;align-items:center;text-decoration:none;background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--c);border-radius:10px;padding:10px 12px;cursor:pointer;text-align:left;min-width:0}
.card:hover{background:var(--cs)}
.card .lv{grid-row:1/3;font-family:var(--f-mono);font-weight:600;font-size:12px;color:var(--c);border:1.5px solid var(--c);border-radius:6px;padding:2px 6px;align-self:start;margin-top:2px}
.card .sit{font-size:13px;color:var(--ink-2);min-width:0}
.card .nm{font-weight:700;font-size:16px;min-width:0}
.card .go{grid-row:1/3;grid-column:3;font-size:12px;color:var(--c);white-space:nowrap}
.card.code{--c:var(--code);--cs:var(--code-soft)}
.card.pilot{--c:var(--pilot);--cs:var(--pilot-soft)}
.card.consult{--c:var(--consult);--cs:var(--consult-soft)}
.card.meds{--c:var(--meds);--cs:var(--meds-soft)}
.card.labs{--c:var(--labs);--cs:var(--labs-soft)}
.card.rounds{--c:var(--rounds);--cs:var(--rounds-soft)}
/* 六張卡：寬度不夠時拿掉「在下方」，說明維持一行 */
@media (max-width:1500px){.card .go{display:none}.card{grid-template-columns:auto minmax(0,1fr)}.card .sit,.card .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}}
@media (max-width:1100px){.cards{grid-template-columns:repeat(3,minmax(0,1fr))}}

/* workspace: 寬螢幕 = 左邊主工作區（急救／會診／用藥，三選一）＋ 右邊常駐待辦；手機 = 六個分頁 */
.tabs{flex:none;display:flex;gap:4px;padding-block:0 8px}
.tabs button{flex:1;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 10px;cursor:pointer;font-weight:500;color:var(--ink-2);display:flex;justify-content:center;gap:6px;align-items:center;min-width:0;white-space:nowrap}
.tabs button i{width:8px;height:8px;border-radius:50%;flex:none}
.tabs button[aria-selected="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.tabs .n{font-family:var(--f-mono);font-size:12px;border-radius:999px;padding:0 6px;background:var(--code);color:var(--surface)}
.tabs .mob{display:none}
.work{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(360px,460px);grid-template-areas:"main side";gap:10px;padding-bottom:max(10px,env(safe-area-inset-bottom,0px))}
.pane{grid-area:main;display:none;flex-direction:column;min-height:0;min-width:0;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.pane.main-on{display:flex}
#pane-todo{grid-area:side;display:flex}
.pane-h{flex:none;display:flex;align-items:center;gap:8px;padding:6px 12px;border-bottom:1px solid var(--line);font-size:13px;color:var(--ink-2)}
.pane-h b{color:var(--ink);font-size:14px}
.pane-h i{width:8px;height:8px;border-radius:50%;flex:none}
.pane iframe{flex:1;width:100%;border:0;display:block;background:var(--bg);opacity:0;transition:opacity .2s var(--hub-ease)}
.pane{position:relative}
.pane.loaded iframe{opacity:1}
.pane:not(.loaded)::after{content:"載入中";position:absolute;left:50%;top:40%;transform:translateX(-50%);font-size:13px;letter-spacing:.2em;color:var(--ink-2);animation:hub-blink 1.2s ease-in-out infinite}
@keyframes hub-blink{50%{opacity:.35}}
.fab.pop{animation:hub-pop .45s var(--hub-ease)}
@media (max-width:900px){.hub-toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}}
.hub-toast .undo{background:transparent;color:var(--bg);box-shadow:inset 0 0 0 1px currentColor}
.hub-toast button{white-space:nowrap;flex:none;border:0;background:var(--todo);color:var(--surface);border-radius:999px;padding:3px 12px;font-weight:700;cursor:pointer}
@media (max-width:900px){
  .tabs .mob{display:flex}
  .tabs button{padding:7px 4px;font-size:14px}
  .work{grid-template-columns:minmax(0,1fr);grid-template-areas:"main"}
  .pane,.pane.main-on,#pane-todo{grid-area:main;display:none}
  .pane.on,#pane-todo.on{display:flex}
  .pane-h{display:none}
}
/* 手機：待辦改成左側抽屜，右滑拉出、左滑收起（iframe 同源，手勢也綁在工具內） */
.pane-h .close{display:none;margin-left:auto;flex:none;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:3px 10px;font-size:13px;cursor:pointer}
.pane-h span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pane-h .sig{margin-left:auto;flex:none;font-style:normal;font-size:10px;letter-spacing:.08em;opacity:.38}
.pane-h .sig+.close{margin-left:8px}
.scrim{display:none}
@media (max-width:900px){
  #pane-todo{display:flex;position:fixed;z-index:20;top:0;bottom:0;left:0;width:min(92vw,460px);border-left:0;border-radius:0 14px 14px 0;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);transform:translateX(-102%);visibility:hidden;transition:transform .22s ease,visibility 0s linear .22s}
  #pane-todo.open{transform:none;visibility:visible;transition:transform .22s ease;box-shadow:8px 0 30px rgba(0,0,0,.28)}
  #pane-todo .pane-h{display:flex}
  #pane-todo .pane-h .close{display:inline-flex}
  .scrim{display:block;position:fixed;inset:0;z-index:19;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .22s}
  .scrim.on{opacity:1;pointer-events:auto}
}
@media (prefers-reduced-motion:reduce){#pane-todo,#pane-todo.open,.scrim{transition:none}}
@media (prefers-reduced-motion:no-preference){.card{transition:background .15s}}

/* 直立手機（≤900px）：不要卡片列，工具區佔滿螢幕，導覽列放在最上面（狀態列下方）。
   每個分頁用「工具名＋什麼狀況用」兩行，顏色沿用各工具的辨識色。 */
.tabs .hint{display:none}
@media (max-width:900px){
  html,body{background:var(--surface)}
  .top{flex-wrap:nowrap;gap:8px;padding-block:6px;border-bottom:1px solid var(--line)}
  .top h1{font-size:16px;letter-spacing:.04em;min-width:0;white-space:nowrap}
  .top h1::before{display:none}
  .clock{margin-left:auto;font-size:12px;white-space:nowrap}
  .status{margin-left:0;font-size:12px}
  .pill:not(.hot){display:none}
  .triage{display:none}
  .work.gut{order:2;gap:0;padding:0 env(safe-area-inset-right,0px) 0 env(safe-area-inset-left,0px)}
  .pane,.pane.main-on{border:0;border-radius:0}
  .tabs{order:1;gap:0;background:var(--surface);border-bottom:1px solid var(--line)}
  .tabs.gut{padding:0 env(safe-area-inset-right,0px) 0 env(safe-area-inset-left,0px)}
  .tabs button{flex:1 1 0;flex-direction:column;justify-content:center;gap:0;min-height:46px;padding:4px 1px 5px;border:0;border-bottom:3px solid transparent;border-radius:0;background:transparent;color:var(--ink-2);font-size:13.5px;font-weight:500;letter-spacing:0}
  .tabs button i{display:none}
  .tabs .hint{display:block;font-size:10px;font-weight:400;line-height:1.15;color:var(--ink-2)}
  .tabs button[aria-selected="true"]{background:var(--cs);border-bottom-color:var(--c);color:var(--ink);font-weight:700}
  .tabs button[aria-selected="true"] .hint{color:var(--ink);font-weight:500}
  .tabs .n{font-size:11px;padding:0 5px;margin-left:2px}
  #pane-todo .pane-h{padding:8px 12px}
  #pane-todo .pane-h b{white-space:nowrap}

<script>
(() => {
  // 版本號：由 scripts/release.py 寫進 <meta name="app-version">，顯示在待辦表標頭的署名後面
  const APP_V = (document.querySelector('meta[name="app-version"]') || {}).content || '';
  try { console.log('%c臨床輔助決策工具 v' + APP_V + ' · made by 劉宇哲', 'color:#B4573A;font-weight:700'); } catch (e) {}
  try { const sg = document.querySelector('#pane-todo .sig'); if (sg && APP_V) sg.textContent = 'by 劉宇哲 · v' + APP_V; } catch (e) {}
  const $ = id => document.getElementById(id);
  const MAIN = ['acls', 'pilot', 'consult', 'meds', 'labs', 'rounds'], ALL = [...MAIN, 'todo'];
  const narrow = matchMedia('(max-width:900px)');
  let cur = 'meds', lastMain = 'meds';

  // cur：手機上顯示的分頁；lastMain：寬螢幕左邊顯示的工具（待辦永遠在右邊）
  // 手機上的待辦抽屜
  const drawerOpen = () => $('pane-todo').classList.contains('open');
  function setDrawer(open) {
    const on = !!open && narrow.matches;
    $('pane-todo').classList.toggle('open', on);
    $('scrim').classList.toggle('on', on);
    $('pane-todo').inert = narrow.matches && !on;
    $('fab').setAttribute('aria-expanded', on);
    document.body.classList.toggle('drawer', on);
  }

  // 延遲載入：先載現在看的工具和待辦表，其他的等畫面閒下來再一個一個載（副駕和用藥速查很大）
  const loaded = new Set();
  function ensure(k) {
    if (!k || loaded.has(k)) return;
    const f = $('f-' + k); if (!f) return;
    loaded.add(k);
    f.addEventListener('load', () => $('pane-' + k).classList.add('loaded'), { once: true });
    f.src = f.dataset.src;
  }
  const idle = cb => (window.requestIdleCallback ? requestIdleCallback(cb, { timeout: 1500 }) : setTimeout(cb, 300));
  function warmRest() {
    const order = [...MAIN].sort((a, b) => Math.abs(MAIN.indexOf(a) - MAIN.indexOf(cur)) - Math.abs(MAIN.indexOf(b) - MAIN.indexOf(cur)));
    const next = () => { const k = order.find(x => !loaded.has(x)); if (!k) return; ensure(k); idle(() => setTimeout(next, 250)); };
    idle(next);
  }

  const track = $('work');
  let lockUntil = 0, syncT = 0;
  function paint() {
    const sel = narrow.matches ? cur : lastMain;
    ALL.forEach(k => {
      $('pane-' + k).classList.toggle('on', k === cur);
      $('pane-' + k).classList.toggle('main-on', k === lastMain);
      const t = $('tab-' + k); if (t) t.setAttribute('aria-selected', k === sel);
    });
    try { localStorage.setItem('hub.pane', JSON.stringify({ cur, lastMain })); } catch (e) {}
    applyFab();
  }
  // 手機上切換工具 = 把橫向軌道捲到那一格（點上方分頁會平順滑過去）
  function show(p, instant) {
    if (!MAIN.includes(p)) return;
    cur = lastMain = p; ensure(p);
    paint();
    if (narrow.matches) {
      lockUntil = Date.now() + 600;
      track.scrollTo({ left: MAIN.indexOf(p) * track.clientWidth, behavior: instant ? 'instant' : 'smooth' });
    }
  }
  // 手指拖動時，過半就換上方分頁的亮起；拖完停下來再校正一次
  function fromScroll() {
    const i = Math.round(track.scrollLeft / Math.max(1, track.clientWidth));
    ensure(MAIN[i]); ensure(MAIN[i + 1]); ensure(MAIN[i - 1]);
    if (MAIN[i] && MAIN[i] !== cur) { cur = lastMain = MAIN[i]; paint(); }
  }
  track.addEventListener('scroll', () => {
    if (!narrow.matches) return;
    clearTimeout(syncT); syncT = setTimeout(() => { lockUntil = 0; fromScroll(); }, 100);
    if (Date.now() >= lockUntil) fromScroll();
  }, { passive: true });
  narrow.addEventListener('change', () => { setDrawer(false); show(cur, true); });
  addEventListener('resize', () => { if (narrow.matches) track.scrollTo({ left: MAIN.indexOf(cur) * track.clientWidth, behavior: 'instant' }); });
  $('fab').addEventListener('click', () => setDrawer(true));
  // 值班用藥速查的辭典彈出時，隱藏右下角待辦按鈕（它會蓋到辭典）
  let glOpen = false, sheetOpen = false;
  function applyFab() { document.body.classList.toggle('gl-open', (glOpen && cur === 'meds') || (sheetOpen && cur === 'pilot')); }
  window.addEventListener('message', e => { if (e.data && e.data.hub === 'sheet') { sheetOpen = !!e.data.open; applyFab(); } });
  $('f-meds').addEventListener('load', () => { glOpen = false; applyFab(); });
  $('f-pilot').addEventListener('load', () => { sheetOpen = false; applyFab(); });
  window.addEventListener('message', e => {
    const f = $('f-meds');
    if (!f || e.source !== f.contentWindow || !e.data || e.data.hub !== 'gloss') return;
    glOpen = !!e.data.open; applyFab();
  });
  // 其他工具匯入待辦時：底部提示＋待辦按鈕跳一下；手機可直接打開待辦
  let hubT = 0;
  window.addEventListener('message', e => {
    if (!e.data || e.data.hub !== 'todo-add') return;
    document.querySelector('.hub-toast')?.remove(); clearTimeout(hubT);
    const t = document.createElement('div'); t.className = 'hub-toast'; t.setAttribute('role', 'status');
    const msg = document.createElement('span');
    msg.textContent = `已加入待辦：${e.data.bed ? e.data.bed + ' 床 ' : ''}${e.data.text}${e.data.n ? `（${e.data.n} 項）` : ''}`;
    t.appendChild(msg);
    if (e.data.id) {
      const u = document.createElement('button'); u.type = 'button'; u.className = 'undo'; u.textContent = '撤銷';
      u.onclick = () => {
        try {
          const st = JSON.parse(localStorage.getItem('shiftboard.v1') || 'null');
          if (st && Array.isArray(st.items)) { st.items = st.items.filter(i => i.id !== e.data.id); st.del = { ...(st.del || {}), [e.data.id]: Date.now() }; localStorage.setItem('shiftboard.v1', JSON.stringify(st)); }
        } catch (er) {}
        msg.textContent = '已撤銷'; u.remove(); t.querySelector('button')?.remove(); status(); clearTimeout(hubT); hubT = setTimeout(() => t.remove(), 1200);
      };
      t.appendChild(u);
    }
    if (narrow.matches) {
      const b = document.createElement('button'); b.type = 'button'; b.textContent = '打開';
      b.onclick = () => { t.remove(); setDrawer(true); }; t.appendChild(b);
    }
    document.body.appendChild(t); hubT = setTimeout(() => t.remove(), 3200);
    const fab = $('fab'); fab.classList.remove('pop'); void fab.offsetWidth; fab.classList.add('pop');
    status();
  });
  $('scrim').addEventListener('click', () => setDrawer(false));
  $('todoClose').addEventListener('click', () => setDrawer(false));
  document.addEventListener('keydown', e => { if (e.key === 'Escape') setDrawer(false); });
  document.querySelectorAll('.tabs button').forEach(b => b.addEventListener('click', () => show(b.dataset.p)));
  document.querySelectorAll('[data-go]').forEach(b => b.addEventListener('click', () => show(b.dataset.go)));

  try { const s = JSON.parse(localStorage.getItem('hub.pane') || 'null'); if (s && MAIN.includes(s.lastMain)) lastMain = s.lastMain; } catch (e) {}
  cur = lastMain;
  const h = location.hash.slice(1);
  if (MAIN.includes(h)) cur = lastMain = h;
  show(cur, true);
  ensure('todo');
  if (h === 'todo' && narrow.matches) setDrawer(true);
  if (document.readyState === 'complete') warmRest(); else addEventListener('load', warmRest, { once: true });

  // 讓內嵌工具跟著總站的明暗主題
  const frames = ALL.map(k => $('f-' + k));
  function syncTheme() {
    const t = document.documentElement.getAttribute('data-theme');
    frames.forEach(f => {
      try {
        const r = f.contentDocument && f.contentDocument.documentElement;
        if (!r) return;
        t ? r.setAttribute('data-theme', t) : r.removeAttribute('data-theme');
      } catch (e) {}
    });
  }
  new MutationObserver(syncTheme).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
  frames.forEach(f => f.addEventListener('load', syncTheme));

  // 手勢：工具之間的左右滑由上面的橫向軌道原生處理（跟手、有慣性）。
  // 待辦抽屜開著時，往左拖會跟著手指收起；在輸入框或可左右捲動的區塊裡不觸發。
  function scrollsX(el) {
    for (; el && el.nodeType === 1; el = el.parentElement) {
      if (/^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName)) return true;
      const cs = (el.ownerDocument.defaultView || window).getComputedStyle(el);
      if (el.scrollWidth > el.clientWidth + 2 && /(auto|scroll)/.test(cs.overflowX)) return true;
    }
    return false;
  }
  const drawer = $('pane-todo');
  let dg = null;
  function dStart(e) {
    if (!narrow.matches || !drawerOpen() || e.touches.length !== 1 || scrollsX(e.target)) { dg = null; return; }
    const t = e.touches[0];
    dg = { x: t.clientX, y: t.clientY, t0: Date.now(), lock: false, dx: 0 };
  }
  function dMove(e) {
    if (!dg) return;
    const t = e.touches[0], dx = t.clientX - dg.x, dy = t.clientY - dg.y;
    if (!dg.lock) {
      if (Math.abs(dx) < 10 && Math.abs(dy) < 10) return;
      if (dx < 0 && Math.abs(dx) > Math.abs(dy) * 1.5) { dg.lock = true; drawer.style.transition = 'none'; $('scrim').style.transition = 'none'; }
      else { dg = null; return; }
    }
    if (e.cancelable) e.preventDefault();
    dg.dx = Math.min(0, dx);
    drawer.style.transform = `translateX(${dg.dx}px)`;
    $('scrim').style.opacity = String(Math.max(0, 1 + dg.dx / drawer.offsetWidth));
  }
  function dEnd() {
    const g = dg; dg = null;
    if (!g || !g.lock) return;
    const close = g.dx < -drawer.offsetWidth * 0.3 || (Date.now() - g.t0 < 300 && g.dx < -40);
    drawer.style.transition = ''; $('scrim').style.transition = '';
    drawer.style.transform = ''; $('scrim').style.opacity = '';
    setDrawer(!close);
  }
  function bindDrag(el) {
    if (!el || el.__drag) return;
    el.__drag = true;
    el.addEventListener('touchstart', dStart, { passive: true });
    el.addEventListener('touchmove', dMove, { passive: false });
    el.addEventListener('touchend', dEnd, { passive: true });
    el.addEventListener('touchcancel', dEnd, { passive: true });
  }
  bindDrag(drawer); bindDrag($('scrim'));
  const ft = $('f-todo');
  const bindTodoDoc = () => { try { bindDrag(ft.contentDocument); } catch (e) {} };
  ft.addEventListener('load', bindTodoDoc); bindTodoDoc();

  // 頂部狀態：讀待辦表存的資料（同一個來源的 localStorage）
  function status() {
    const now = Date.now();
    $('clock').textContent = new Date().toLocaleString('zh-TW', { month: 'numeric', day: 'numeric', weekday: 'short', hour: '2-digit', minute: '2-digit', hour12: false });
    let items = [];
    try { const s = JSON.parse(localStorage.getItem('shiftboard.v1') || 'null'); if (s && Array.isArray(s.items)) items = s.items.filter(i => !i.ex); } catch (e) {}
    const over = items.filter(i => i.due && i.due <= now).length;
    const p1 = items.filter(i => i.p === 1).length;
    $('status').innerHTML =
      `<span class="pill${over ? ' hot' : ''}">已到時 <b>${over}</b></span>` +
      `<span class="pill">立即 <b>${p1}</b></span>` +
      `<span class="pill">待辦共 <b>${items.length}</b></span>`;
    $('tabN').hidden = !over; $('tabN').textContent = over;
  }
  status(); setInterval(status, 2000);
  window.addEventListener('storage', status);
})();
</script>

<style>
/* 精簡版面：拿掉「現在的狀況」大卡片列，只留一排分頁；分頁上直接寫什麼狀況用 */

</style>
<script>
/* 雲端同步：把這個工具所有 localStorage 資料存到「每個人自己的」雲端空間（data/users/<id>/）。
   主畫面 App 被滑掉、換手機、清快取都不會掉。沒登入或沒有寫入權限時，照舊只存本機。 */
(async () => {
  const el = document.getElementById('sync');
  const LABEL = { wait: '連線中', ok: '已同步', busy: '同步中', local: '僅本機', err: '同步失敗' };
  const TIP = { wait: '雲端同步：連線中', ok: '資料已存到你自己的雲端空間，只有你看得到', busy: '正在存到雲端',
    local: '沒有登入 claude.ai 或沒有寫入權限：資料只存在這台裝置，被清掉就沒了', err: '雲端同步失敗，資料暫時只在這台裝置' };
  const ind = s => { el.dataset.s = s; el.textContent = LABEL[s]; el.title = TIP[s]; };
  const META = 'hub.sync.meta', CH = 60000;
  const skip = k => !k || k.startsWith('hub.sync') || k === 'acls-run';
  const enc = k => 'k' + Array.from(new TextEncoder().encode(k), b => b.toString(16).padStart(2, '0')).join('');
  const dec = id => new TextDecoder().decode(new Uint8Array(id.slice(1).match(/../g).map(h => parseInt(h, 16))));
  const ls = {
    get: k => { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set: (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); return true; } catch (e) { return false; } },
    keys: () => { try { return Object.keys(localStorage).filter(k => !skip(k) && enc(k).length <= 190); } catch (e) { return []; } },
  };
  let meta = {}; try { meta = JSON.parse(ls.get(META) || '{}') || {}; } catch (e) {}
  const SIG = 'hub.sync.sig';
  let sig = {}; try { sig = JSON.parse(ls.get(SIG) || '{}') || {}; } catch (e) {}
  const fp = v => { if (v == null) return null; let h = 5381; for (let i = 0; i < v.length; i++) h = (h * 33 ^ v.charCodeAt(i)) >>> 0; return v.length + ':' + h; };
  const saveMeta = () => { ls.set(META, JSON.stringify(meta)); ls.set(SIG, JSON.stringify(sig)); };
  const within = (p, ms) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej({ code: 'timeout' }), ms))]);

  let db = null, uid = null;
  try {
    if (window.claude && claude.use) {
      const [d, u] = await Promise.all([claude.use('db'), claude.use('user')]);
      db = d; uid = d && u ? await u.id() : null;
    }
  } catch (e) {}
  if (!db || !uid) { ind('local'); return; }
  const col = db.collection('data/users/' + uid);
  const known = {}, chunksN = {};   // known：最後一次跟雲端一致的值

  async function pull(first) {
    const snap = await within(col.get(), 12000);
    const main = {}, parts = {};
    snap.docs.forEach(d => { if (!d.exists) return; const i = d.id.indexOf('~'); i < 0 ? (main[d.id] = d.data()) : (parts[d.id] = d.data()); });
    const changed = [];
    for (const id in main) {
      let k; try { k = dec(id); } catch (e) { continue; }
      if (skip(k)) continue;
      const d = main[id];
      let v = d.del ? null : d.n ? Array.from({ length: d.n }, (_, i) => (parts[id + '~' + i] || {}).v || '').join('') : d.v;
      if (typeof v !== 'string') v = null;
      chunksN[k] = d.n || 0;
      if ((d.t || 0) > (meta[k] || 0)) {            // 雲端比較新（或這台裝置被清空了）
        // 本機有沒有「還沒上傳的修改」：跟上次和雲端一致時的指紋比（存在本機，重開 App 也記得）
        const local = ls.get(k), dirty = local != null && local !== v && (k in sig ? sig[k] !== fp(local) : true);
        if (dirty && local != null && v != null && local !== v) {
          // 兩邊都改過：待辦表逐項合併；其他資料用雲端的，本機那份留一份備份（查房板「⋯」可以從快照救回）
          const m = merge(k, local, v);
          if (m != null) { ls.set(k, m); changed.push(k); }
          else { ls.set('hub.sync.bak:' + k, local); ls.set(k, v); changed.push(k); }
        } else if (local !== v) { ls.set(k, v); changed.push(k); }
        meta[k] = d.t;
      }
      known[k] = v; sig[k] = fp(ls.get(k) === v ? v : known[k]);
    }
    saveMeta();
    if (changed.length) notify(changed);
  }
  // 待辦表：兩台裝置各自加的都留著；任一邊完成就算完成
  function merge(k, a, b) {
    if (k !== 'shiftboard.v1') return null;
    try {
      const A = JSON.parse(a), B = JSON.parse(b);
      if (!A || !B || !Array.isArray(A.items) || !Array.isArray(B.items)) return null;
      // 任一邊刪掉的（del：id → 刪除時間）就算刪掉，不會被另一邊的舊資料補回來；14 天前的刪除紀錄清掉
      const now = Date.now(), del = {};
      [A.del, B.del].forEach(d => { for (const id in d || {}) if (now - d[id] <= 14 * 864e5) del[id] = Math.max(del[id] || 0, d[id]); });
      const done = new Map(), items = new Map();
      [...(A.done || []), ...(B.done || [])].forEach(i => { if (!del[i.id] && !done.has(i.id)) done.set(i.id, i); });
      [...A.items, ...B.items].forEach(i => { if (!del[i.id] && !done.has(i.id) && !items.has(i.id)) items.set(i.id, i); });
      return JSON.stringify({ ...B, items: [...items.values()], done: [...done.values()], del });
    } catch (e) { return null; }
  }
  // 雲端帶來新資料：送一個 storage 事件給每個工具，各自就地更新（不整頁重載，查房板跑到哪一床、OCR、急救計時都不會被打斷）。
  // 只有不會自己聽 storage 的工具，而且是它自己的資料變了，才重新載入它。
  const OWN = { 'f-consult': ['consult-draft', 'consult-example'], 'f-meds': ['wr3'], 'f-pilot': ['oncall.prefs.v1'] };
  function notify(changed) {
    document.querySelectorAll('.pane iframe[src]').forEach(f => {
      const own = OWN[f.id];
      if (own && changed.some(k => own.includes(k))) { try { f.contentWindow.location.reload(); } catch (e) { f.src = f.src; } return; }
      changed.forEach(k => { try { f.contentWindow.dispatchEvent(new StorageEvent('storage', { key: k, newValue: ls.get(k) })); } catch (e) {} });
    });
    window.dispatchEvent(new Event('storage'));
  }

  async function write(k, v) {
    const t = Date.now(), id = enc(k), ref = col.doc(id);
    if (v == null) await ref.set({ t, del: 1 });
    else if (v.length <= CH) await ref.set({ t, v });
    else {
      const n = Math.ceil(v.length / CH);
      for (let i = 0; i < n; i++) await col.doc(id + '~' + i).set({ v: v.slice(i * CH, (i + 1) * CH) });
      await ref.set({ t, n });
      for (let i = n; i < (chunksN[k] || 0); i++) await col.doc(id + '~' + i).delete().catch(() => {});
      chunksN[k] = n;
    }
    known[k] = v; sig[k] = fp(v); meta[k] = t; saveMeta();
  }

  let busy = false, again = false, ready = false, tick = 0;
  async function flush() {
    if (!ready) return;
    if (busy) { again = true; return; }
    busy = true;
    try {
      do {
        again = false;
        const keys = new Set([...ls.keys(), ...Object.keys(known).filter(k => known[k] != null)]);
        const todo = [...keys].filter(k => ls.get(k) !== (known[k] ?? null));
        if (!todo.length) break;
        ind('busy');
        for (const k of todo) await write(k, ls.get(k));
      } while (again);
      ind('ok');
    } catch (e) {
      ind('err');
      if (e && e.code === 'revoked') { clearInterval(tick); return; }
    } finally { busy = false; }
  }

  // 一定要先成功讀到雲端，才開始往上存：避免剛被清空的裝置把空白資料蓋到雲端
  async function start() {
    try { await pull(true); ready = true; ind('ok'); flush(); }
    catch (e) { if (e && e.code === 'revoked') { ind('local'); return; } ind('err'); setTimeout(start, 15000); }
  }
  start();
  let deb = 0;
  const soon = () => { clearTimeout(deb); deb = setTimeout(flush, 800); };
  window.addEventListener('storage', soon);
  tick = setInterval(flush, 3000);
  // 切到背景（滑回主畫面、鎖螢幕）時立刻存；回到前景時拉一次別台裝置的變更
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden') flush();
    else if (ready) pull(false).then(flush).catch(() => {}); // pull 會先處理本機沒上傳完的修改（合併或備份），不會直接蓋掉
  });
  window.addEventListener('pagehide', flush);
})();
</script>

</body></html>
